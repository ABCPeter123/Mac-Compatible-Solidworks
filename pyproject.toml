[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-mac-compat-lab"
version = "0.3.0"
description = "Experimental Wine/macOS compatibility diagnostics for licensed SOLIDWORKS"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
swcompat = "swcompat.cli:main"

[tool.setuptools]
packages = ["swcompat"]
