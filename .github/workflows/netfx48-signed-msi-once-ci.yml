name: One-shot authentic Microsoft .NET 4.8 extracted x64 MSI and MSP

# Authenticated original Microsoft offline 4.8 bootstrapper exited 5100
# on Wine Staging 11.21 Win7SP1 and Windows 10. The official offline media
# contains netfx_Full_x64.msi and netfx_Patch_x64.msp. Test the unmodified
# extracted vendor packages on a disposable original Microsoft .NET 4.0
# prefix without the bootstrapper's prerequisite stop-block.
# A normal MSI exit does not establish .NET 4.8. We require original CLR
# changes, Release, x64 loader and actual native managed execution.
# Do not upload original packages, binaries, vendor MSI logs or paths.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-signed-msi-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: netfx48-signed-msi-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-signed-msi:
    name: Authenticate genuine .NET4.0 then try original 4.8 x64 MSI plus MSP
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: '11.21'
      use_macos26_runner: true
      host_provenance_only: false
      try_48_payload_host: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_msi: true
