name: One-shot original .NET 4.8 BlockIf prerequisite differential

# Original signed 4.8 returned exit 5100 under both Windows 7 SP1 and Windows 10.
# Win10/Win7 profile changes, CLR DLL staging, and fake framework registry keys
# did not resolve the actual failure. This is one bounded execution on an
# authenticated original Microsoft 4.0 host, not a claim of installation.
# NEW information: the count and safe type of TRUE BlockIf expressions
# versus FALSE blocks, plus the SCM helper's Wine process startup evidence.
# Original Microsoft installer transcript remains private, then is erased.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-blockif-original-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-netfx48-blockif-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-original-blockif:
    name: Diagnose signed 4.8 StopBlock after genuine native Microsoft .NET 4.0
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      host_provenance_only: false
      try_48_payload_host: false
      try_48_intermediate: false
      try_48_direct: true
      original_48_profile: win10
      use_macos26_runner: true
