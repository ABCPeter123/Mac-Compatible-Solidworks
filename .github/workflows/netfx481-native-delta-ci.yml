name: Native IPD decoder on genuine KB5011048
on:
  pull_request:
    paths:
      - 'scripts/netfx481_native_delta.py'
      - 'scripts/netfx481_native_delta_gate.py'
      - 'scripts/netfx481_ipd_stage.py'
      - 'scripts/patch_wusa_ipd_dryrun.py'
      - 'scripts/netfx481_ipd_wusa_dryrun.py'
      - 'tests/test_netfx481_ipd_wusa_dryrun.py'
      - 'tests/test_netfx481_ipd_stage.py'
      - 'scripts/netfx481_cix_graph.py'
      - 'data/netfx481/recipes/**'
      - 'scripts/patch_msdelta_compat.py'
      - 'probes/swcompat_verified_delta.rs'
      - 'tests/test_netfx481_native_delta.py'
      - '.github/workflows/netfx481-native-delta-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ipd-decoder-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  decode-windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bounded decoder adapter
        run: python -m unittest discover -s tests -p test_netfx481_native_delta.py -v
      - name: Test private staging safety
        run: python -m unittest discover -s tests -p test_netfx481_ipd_stage.py -v
      - name: Test WUSA preflight contract
        run: python -m unittest discover -s tests -p test_netfx481_ipd_wusa_dryrun.py -v
      - name: Build pinned MSDelta CLI and intrinsic-hash compatibility adapter
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          git clone --filter=blob:none --no-checkout https://github.com/CaddyGlow/ms-delta.git "$RUNNER_TEMP/swcompat-msdelta-source"
          git -C "$RUNNER_TEMP/swcompat-msdelta-source" checkout --detach 6f25d63e8a8573015feb2f6a3d3f98861edbb22c
          test "$(git -C "$RUNNER_TEMP/swcompat-msdelta-source" rev-parse HEAD)" = 6f25d63e8a8573015feb2f6a3d3f98861edbb22c
          python -m scripts.patch_msdelta_compat "$RUNNER_TEMP/swcompat-msdelta-source/src/pa30.rs"
          mkdir -p "$RUNNER_TEMP/swcompat-msdelta-source/src/bin"
          cp probes/swcompat_verified_delta.rs "$RUNNER_TEMP/swcompat-msdelta-source/src/bin/swcompat-verified-delta.rs"
          cargo +stable build --manifest-path "$RUNNER_TEMP/swcompat-msdelta-source/Cargo.toml" --locked --release --features cli --bin ms-delta --bin swcompat-verified-delta
          cargo +stable test --manifest-path "$RUNNER_TEMP/swcompat-msdelta-source/Cargo.toml" --locked --release --features cli --lib swcompat_provenance_tests
      - name: Compare genuine portable reconstruction with native Windows IPD Expand oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build | Out-Null
          $msu = Join-Path (Resolve-Path build) "KB5011048.msu"
          try {
            curl.exe --fail --location --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 600 --connect-timeout 20 --max-time 120 --output $msu "https://catalog.s.download.windowsupdate.com/c/msdownload/update/software/ftpk/2023/09/windows10.0-kb5011048-x64_411d40ab5705c99f2bdb576ad3dc3e6ec0f3902e.msu"
            if ($LASTEXITCODE -ne 0 -or (Get-Item -LiteralPath $msu).Length -ne 71059034) { throw "Catalog download failed" }
            if ((Get-FileHash -LiteralPath $msu -Algorithm SHA1).Hash.ToLowerInvariant() -ne "411d40ab5705c99f2bdb576ad3dc3e6ec0f3902e") { throw "Original package identity mismatch" }
            (Get-FileHash -LiteralPath $msu -Algorithm SHA256).Hash.ToLowerInvariant() |
              Set-Content -LiteralPath build/netfx481-catalog.sha256 -NoNewline -Encoding ascii
            python -m scripts.netfx481_native_delta --package $msu --sha256-file build/netfx481-catalog.sha256 --sevenzip (Join-Path $env:ProgramFiles "7-Zip\7z.exe") --codec (Join-Path $env:RUNNER_TEMP "swcompat-msdelta-source\target\release\ms-delta.exe") --expand (Join-Path $env:WINDIR "System32\expand.exe") --verified-codec (Join-Path $env:RUNNER_TEMP "swcompat-msdelta-source\target\release\swcompat-verified-delta.exe") --recipe-dir data/netfx481/recipes --output build/netfx481-native-delta.json
            if ($LASTEXITCODE -ne 0) { throw "Native delta reference failed" }
          } finally {
            if (Test-Path -LiteralPath $msu) { Remove-Item -LiteralPath $msu }
          }
      - name: Require complete tree and all native Windows reference matches
        run: python -m scripts.netfx481_native_delta_gate build/netfx481-native-delta.json --windows-oracle
      - uses: actions/upload-artifact@v4
        with:
          name: native-delta-allowlisted-result-windows-2025
          path: build/netfx481-native-delta.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}
  decode-macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bounded decoder adapter
        run: python -m unittest discover -s tests -p test_netfx481_native_delta.py -v
      - name: Test private staging safety
        run: python -m unittest discover -s tests -p test_netfx481_ipd_stage.py -v
      - name: Test WUSA preflight contract
        run: python -m unittest discover -s tests -p test_netfx481_ipd_wusa_dryrun.py -v
      - name: Build pinned MSDelta CLI and intrinsic-hash compatibility adapter
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          git clone --filter=blob:none --no-checkout https://github.com/CaddyGlow/ms-delta.git "$RUNNER_TEMP/swcompat-msdelta-source"
          git -C "$RUNNER_TEMP/swcompat-msdelta-source" checkout --detach 6f25d63e8a8573015feb2f6a3d3f98861edbb22c
          test "$(git -C "$RUNNER_TEMP/swcompat-msdelta-source" rev-parse HEAD)" = 6f25d63e8a8573015feb2f6a3d3f98861edbb22c
          python -m scripts.patch_msdelta_compat "$RUNNER_TEMP/swcompat-msdelta-source/src/pa30.rs"
          mkdir -p "$RUNNER_TEMP/swcompat-msdelta-source/src/bin"
          cp probes/swcompat_verified_delta.rs "$RUNNER_TEMP/swcompat-msdelta-source/src/bin/swcompat-verified-delta.rs"
          cargo +stable build --manifest-path "$RUNNER_TEMP/swcompat-msdelta-source/Cargo.toml" --locked --release --features cli --bin ms-delta --bin swcompat-verified-delta
          cargo +stable test --manifest-path "$RUNNER_TEMP/swcompat-msdelta-source/Cargo.toml" --locked --release --features cli --lib swcompat_provenance_tests
      - name: Install native macOS CAB reader
        run: brew install sevenzip
      - name: Download original pinned Microsoft update and exercise native decompression on macOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 600 --connect-timeout 20 --max-time 120 --output build/KB5011048.msu \
            'https://catalog.s.download.windowsupdate.com/c/msdownload/update/software/ftpk/2023/09/windows10.0-kb5011048-x64_411d40ab5705c99f2bdb576ad3dc3e6ec0f3902e.msu'
          python -c 'import hashlib; from pathlib import Path; p=Path("build/KB5011048.msu"); data=p.read_bytes(); assert len(data)==71059034 and hashlib.sha1(data).hexdigest()=="411d40ab5705c99f2bdb576ad3dc3e6ec0f3902e"; Path("build/netfx481-catalog.sha256").write_text(hashlib.sha256(data).hexdigest())'
          python -m scripts.netfx481_native_delta \
            --package build/KB5011048.msu --sha256-file build/netfx481-catalog.sha256 \
            --sevenzip "$(realpath "$(command -v 7zz)")" \
            --codec "$RUNNER_TEMP/swcompat-msdelta-source/target/release/ms-delta" \
            --verified-codec "$RUNNER_TEMP/swcompat-msdelta-source/target/release/swcompat-verified-delta" \
            --recipe-dir data/netfx481/recipes --stage-dir "$RUNNER_TEMP/netfx481-ipd-stage" \
            --output build/netfx481-native-delta.json
      - name: Validate fully materialized private Apple Silicon tree
        shell: bash
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          from scripts.netfx481_ipd_stage import inventory, digest_tree
          from scripts.netfx481_native_delta_gate import EXPECTED_TREE_SHA256
          root = Path(os.environ['RUNNER_TEMP']) / 'netfx481-ipd-stage'
          files = inventory(root)
          assert len(files) == 2446 and digest_tree(files) == EXPECTED_TREE_SHA256
          report = json.loads(Path('build/netfx481-native-delta.json').read_text())
          assert report['stage_verified'] is True and report['stage_files'] == 2446
          print('Private stage contains all 2446 exact manifest-path files')
          PY
      - name: Require complete tree and independently verified Windows digest
        run: python -m scripts.netfx481_native_delta_gate build/netfx481-native-delta.json
      - name: Build read-only WUSA source probe
        shell: bash
        run: |
          set -euo pipefail
          brew install mingw-w64
          src="$RUNNER_TEMP/wusa-original"
          dst="$RUNNER_TEMP/wusa-ipd-dryrun"
          mkdir -p "$src/wine"
          base=https://raw.githubusercontent.com/wine-mirror/wine/wine-11.13
          for name in main.c manifest.c wusa.h; do
            curl --fail --location --retry 4 --retry-all-errors --max-time 60 --output "$src/$name" "$base/programs/wusa/$name"
          done
          curl --fail --location --retry 4 --retry-all-errors --max-time 60 --output "$src/wine/list.h" "$base/include/wine/list.h"
          python -m scripts.patch_wusa_ipd_dryrun "$src" "$dst"
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -municode -mconsole -static -D_WIN32_WINNT=0x0601 \
            -I"$dst" "$dst/main.c" "$dst/manifest.c" \
            -o "$RUNNER_TEMP/swcompat-wusa-ipd-dryrun.exe" \
            -lcabinet -lshlwapi -lole32 -loleaut32 -ladvapi32 -lshell32 -luuid
      - name: Prepare pinned Wiage Wine 11.13 disposable prefix
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wiage-ipd-runtime.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors --max-time 600 --output "$archive" \
            "https://github.com/dttdrv/mage/releases/download/preview-2026-08-02/wiage-runtime.tar.gz"
          printf '%s  %s\n' d0cea7ff492dd3801dfa26a2a7d5ed1331e60f65929318d17301a3ce9cbba56c "$archive" | shasum -a 256 -c -
          python -m scripts.wine_engine_archive --archive "$archive"
          mkdir -p "$RUNNER_TEMP/ipd-wine-engine"
          COPYFILE_DISABLE=1 tar --exclude='._*' --exclude='*/._*' -xzf "$archive" -C "$RUNNER_TEMP/ipd-wine-engine"
          rm -f "$archive"
          export SWCOMPAT_WINE="$RUNNER_TEMP/ipd-wine-engine/wiage/bin/wine"
          export MAGE_BACKGROUND_EXE=rundll32.exe:services.exe:explorer.exe:conhost.exe
          export WINEMSYNC=1
          test -x "$SWCOMPAT_WINE"
          python -m swcompat --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --logs-dir "$RUNNER_TEMP/netfx481-ipd-wusa-logs" init --timeout 120 --skip-bootstrap-mono-gecko
          touch "$RUNNER_TEMP/netfx40-msxml3-prefix/.swcompat-netfx481-disposable"
          python -m scripts.netfx40_prefix_readiness --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --output build/netfx481-ipd-prefix-readiness.json --agree-disposable-prefix
      - name: Exercise original WUSA dependency and file preflight against verified IPD stage
        shell: bash
        run: |
          set -euo pipefail
          export MAGE_BACKGROUND_EXE=rundll32.exe:services.exe:explorer.exe:conhost.exe
          export WINEMSYNC=1
          python -m scripts.netfx481_ipd_wusa_dryrun \
            --wine "$RUNNER_TEMP/ipd-wine-engine/wiage/bin/wine" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --fixture "$RUNNER_TEMP/swcompat-wusa-ipd-dryrun.exe" \
            --package build/KB5011048.msu --sha256-file build/netfx481-catalog.sha256 \
            --stage "$RUNNER_TEMP/netfx481-ipd-stage" \
            --output build/netfx481-ipd-wusa-dryrun.json
      - name: Compare installed MSXML3 parser with isolated builtin parser on original verified IPD stage
        shell: bash
        run: |
          set -euo pipefail
          export MAGE_BACKGROUND_EXE=rundll32.exe:services.exe:explorer.exe:conhost.exe
          export WINEMSYNC=1
          export SWCOMPAT_WINE="$RUNNER_TEMP/ipd-wine-engine/wiage/bin/wine"
          brew install winetricks
          winetricks --version | grep -F '20260125'
          python -m scripts.netfx40_msxml3_prerequisite \
            --wine "$SWCOMPAT_WINE" --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --winetricks "$(realpath "$(command -v winetricks)")" \
            --output build/netfx481-ipd-msxml3-prerequisite.json \
            --timeout 300 --agree-disposable-prefix
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.netfx40_msxml3_prerequisite import validate
          r = json.loads(Path("build/netfx481-ipd-msxml3-prerequisite.json").read_text())
          assert validate(r) and r["status"] == "VERB_SUCCEEDED"
          assert r["x86_dll_changed"] or r["x64_dll_changed"]
          PY
          for mode in default builtin; do
            set -- python -m scripts.netfx481_ipd_wusa_dryrun \
              --wine "$SWCOMPAT_WINE" --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
              --fixture "$RUNNER_TEMP/swcompat-wusa-ipd-dryrun.exe" \
              --package build/KB5011048.msu --sha256-file build/netfx481-catalog.sha256 \
              --stage "$RUNNER_TEMP/netfx481-ipd-stage" \
              --output "build/netfx481-ipd-msxml3-$mode.json"
            if [ "$mode" = default ]; then set -- "$@" --control-default-xml; fi
            "$@"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.netfx481_ipd_apply_candidate import preflight_ready
          reports = {mode: json.loads(Path(f"build/netfx481-ipd-msxml3-{mode}.json").read_text())
                     for mode in ("default", "builtin")}
          summary = {mode: {"ready": preflight_ready(r), "load_failure": r["events"].get("load_failure"),
                            "no_updates": r["events"].get("no_updates")} for mode, r in reports.items()}
          print("Native MSXML3 A/B control", json.dumps(summary, sort_keys=True))
          assert summary["builtin"]["ready"], "Builtin parser does not restore full original update preflight"
          PY
      - name: Remove private staged Microsoft files
        if: always()
        shell: bash
        run: |
          if [[ -x "$RUNNER_TEMP/ipd-wine-engine/wiage/bin/wineserver" && -f "$RUNNER_TEMP/netfx40-msxml3-prefix/.swcompat-netfx481-disposable" ]]; then
            WINEPREFIX="$RUNNER_TEMP/netfx40-msxml3-prefix" "$RUNNER_TEMP/ipd-wine-engine/wiage/bin/wineserver" -k || true
          fi
          rm -f -- build/KB5011048.msu "$RUNNER_TEMP/wiage-ipd-runtime.tar.gz"
          rm -rf -- "$RUNNER_TEMP/netfx481-ipd-stage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-delta-allowlisted-result-macos-26
          path: |
            build/netfx481-native-delta.json
            build/netfx481-ipd-wusa-dryrun.json
            build/netfx481-ipd-msxml3-prerequisite.json
            build/netfx481-ipd-msxml3-default.json
            build/netfx481-ipd-msxml3-builtin.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}
