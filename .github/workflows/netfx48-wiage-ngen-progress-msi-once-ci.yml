name: One-shot authenticated Wiage .NET 4.8 MSI after progress-drained CLR4 NGen

# Verified original Microsoft servicing baseline (November 24, 2026):
# Authenticated Apple Silicon run 45502751553 attempt 2 passed genuine
# CLR4/NGen x64+x86 preflights, unmodified signed .NET4.8 x64 MSI, genuine
# CLR64 change and native-only managed execution after a Wine restart.
# Its unmodified original x64 MSP returned exact Win32 00000643 / 1603.
# The corrected private full-stream Wine trace (PR #261) classified
# MSI_UNATTRIBUTED_SCRIPT_ENGINE, but no first failing script action;
# non-final action class UNKNOWN and the NGen/service log hints are noncausal.
#
# Authentic run 45522878087 verified MSI_SEQ_MACHINE_APPLICABLE for the
# original signed MSP and still returned native Win32 1603 under the
# baseline quiet /p command. MSI product registration and cache are present.
# PR #268 selects the Microsoft-documented explicit silent reinstall mode
# for this isolated A/B: public MSI properties are fixed in the native
# monitor; original signed MSI/MSP bytes, Wine version and acceptance gates
# are unchanged. A successful wrapper or sequencing API is NOT MSP success.
# https://learn.microsoft.com/windows-server/administration/windows-commands/msiexec#update-options
# Authentic run 45518474022: native original Microsoft CLR and signed x64
# .NET 4.8 MSI SUCCESS; the unchanged x64 MSP returned genuine Win32
# 00000643/1603. Read-only registration proved the original MSI product
# INSTALLED and its LocalPackage cache PRESENT. These are excluded causes.
# Merged PR #267 tests the original signed MSP's read-only eligibility in
# both USER_UNMANAGED and MACHINE MSI installation contexts via the actual
# native MsiDeterminePatchSequenceW API. Only finite enum classifications
# from PRIVATE Wine stderr enter the report. The unmodified original /p,
# genuine native-only managed probe and exact Win32 MSP gates stay strict.
# Sequencing eligibility does NOT prove that the patch executed successfully.
# Authenticated run 45516726602 encountered genuine original CLR4 setup
# Win32 1603 with no CLR, correctly selected one fresh disposable prefix,
# but stopped at a Python ImportError before the second original setup:
# netfx40_prefix_readiness exports valid(), not validate(). Merged PR #266
# repairs that import and compiles/resolves both retry heredoc APIs in CI.
# This retry uses UNMODIFIED original media and preserves exact original
# signed 4.8 MSI/MSP Windows Installer success gates.
# PR #265 corrects a false-negative in that gate: run 45512909191
# installed genuine CLR4 x64, native managed PASS and persisted across a
# completed Wine restart, but the original bootstrapper timed out and its
# process group was reaped. The bootstrapper TIMEOUT is kept unchanged;
# the separately verified native CLR can continue to NGen/MSI research.
# Continue the original x64 MSI/MSP only if independent native CLR proof
# and exact original signed package exit gates still pass.
# PR #262 allows ONE fresh-prefix genuine CLR4 retry after a verified 1603
# with NO real CLR installed; all original NGen/MSI/MSP gates remain strict.
# Merged PR #264 now adds a READ-ONLY native Windows Installer ProductCode
# registration and LocalPackage cache query BEFORE the unchanged MSP launch.
# ProductCode, cache paths, source MSI, GUIDs and raw traces remain private;
# only fixed finite registration enums may enter the existing Wine report.
# This test distinguishes missing MSI registration from patch execution
# failure. It does not alter the original vendor MSI/MSP or activation, and
# it cannot promote a Win32 1603 to complete .NET4.8 servicing.
# Genuine complete .NET4.8/.NET4.8.1 and working SOLIDWORKS CAD unverified.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-wiage-ngen-progress-msi-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-wiage-progress-ngen-before-signed-48-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-progress-ngen-signed-msi:
    name: Genuine CLR4 NGen progress drain then original signed 4.8 MSI and MSP
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: 'wiage-11.13'
      use_macos26_runner: true
      host_provenance_only: false
      win7_setup: false
      try_wow64_managed: false
      try_wow64_faults: false
      try_40_core_msi_recovery: false
      probe_native40_ngen_if_ready: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_payload_host: false
      try_48_msi: true
      drain_native40_ngen: true
      ngen_host_stack64: true
      progress_gated_native40_ngen: true
      retry_growing_native40_ngen_nonzero: true
      signed_msi_timeout_seconds: 420
      prepare_48_assembly_cache: true
      pause_native_ngen_queue: false
      pause_after_verified_native40_ngen: false
      signed_msi_win10_profile: true
      signed_msp_win32_exit: true
      signed_msp_reinstall: true
