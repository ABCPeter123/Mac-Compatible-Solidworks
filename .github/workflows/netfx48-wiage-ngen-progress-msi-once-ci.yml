name: One-shot authenticated Wiage .NET 4.8 MSI after progress-drained CLR4 NGen

# Current original Microsoft servicing gate, November 24, 2026.
# Source-validated PR #261: bounded full-stream classification of the original
# MSP's private WINEDEBUG trace, replacing the last-8-MiB sample that missed
# Wine err:msi entirely in authenticated run 45495950145. Preserve original
# Microsoft MSI and MSP bytes and native Win32 DWORD exit gate unchanged.
# Original Win32 1603 remains the blocker until independently cured.
# This authenticated one-shot tests whether a fixed-category first-failure
# action can be observed across complete Wine MSI execution and rollback.
# Authenticated Apple Silicon run 45426863980 attempt 2: both genuine
# original Microsoft CLR4 x64+x86 NGen preflights SUCCESS without retry.
# Original signed Microsoft .NET4.8 x64 MSI SUCCESS; changed real CLR64,
# native-only Microsoft managed code PASS after clean Wine restart, genuine
# Release in NETFX48_RANGE. The unmodified x64 MSP returned full Win32
# DWORD 00000643 = installer fatal error 1603, not an inferred POSIX byte.
# Private original MSP verbose log lacked a failing Return value 3 marker,
# but classified an NGen/X64 custom-action hint and SERVICE_MISSING. No
# specific service or NGen operation has been proved to cause the failure.
# Authenticated attempt 2 of run 45441804424: genuine original CLR4 NGen
# x64+x86 PASS; original x64 signed MSI SUCCESS; restarted original CLR
# native-managed PASS; original x64 signed MSP full Win32 1603 persists.
# Its private err+msi trace had MSI errors but no recognized script action
# and no fixed known error signal. The preceding NGen/SERVICE hints are not
# causal evidence. Merged PR #259 now adds bounded Wine internal MSI-source
# fallback classes, distinct regtlb and custom-action pipe/return signals.
# Re-run solely to classify authentic MSP errors; no installer mutation,
# fake service, fake Release, NGen suppression, or acceptance-gate bypass.
# Authenticated run 45469551065: genuine .NET 4.8 signed x64 MSI SUCCESS,
# original CLR x64 native-only managed PASS after restart, original signed
# x64 MSP still full Win32 1603. Private err+msi saw only the generic
# ITERATE_Actions error, with no first forward script action.
# PR #260 added temporary private trace+msi only around the unchanged
# original signed MSP and fixed-category classification of last observed
# non-final MSI action. Stderr classification reads the final bounded 8 MiB;
# no raw trace, action text, Microsoft binary or private path is exported.
# An observed trace action is not proof of 1603 causation or MSP success.
# New original native MSP probe (PR #256) captures separate PRIVATE Wine
# err+msi stderr and classifies the first forward Wine installer script
# failure separately from a rollback script error. It emits only fixed
# finite categories; no vendor log text, user path, SIDs or original media.
# Original signed Microsoft x64 MSI/MSP unchanged, 420s servicing cap,
# original x86+x64 NGen success mandatory, at most one progress-gated
# genuine NGen retry, no NGen pause or fabricated installation state.
# Win32 original MSP exact-success, restarted genuine CLR, Release, and
# native-only managed gates stay strict. .NET4.8.1 and SOLIDWORKS still
# unverified and blocked until complete signed .NET4.8 servicing passes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-wiage-ngen-progress-msi-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-wiage-progress-ngen-before-signed-48-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-progress-ngen-signed-msi:
    name: Genuine CLR4 NGen progress drain then original signed 4.8 MSI and MSP
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: 'wiage-11.13'
      use_macos26_runner: true
      host_provenance_only: false
      win7_setup: false
      try_wow64_managed: false
      try_wow64_faults: false
      try_40_core_msi_recovery: false
      probe_native40_ngen_if_ready: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_payload_host: false
      try_48_msi: true
      drain_native40_ngen: true
      ngen_host_stack64: true
      progress_gated_native40_ngen: true
      retry_growing_native40_ngen_nonzero: true
      signed_msi_timeout_seconds: 420
      prepare_48_assembly_cache: true
      pause_native_ngen_queue: false
      pause_after_verified_native40_ngen: false
      signed_msi_win10_profile: true
      signed_msp_win32_exit: true
