name: One-shot Wiage real Microsoft CLR4 NGen 64 MiB stack and SEH A/B

# Actual run 44982144141: independently verified native Microsoft CLR4
# hosting and managed execution survived restart; original x64 ngen.exe
# executeQueuedItems timed out after 180 seconds BEFORE any signed 4.8 MSI
# attempt. Prior untouched Wiage 4.8 MSI run 44979241666 also stalled at
# genuine NGen/assembly servicing with installed, working native 4.8 CLR.
# Historic Wine bug 48847 describes NGen-related stack overflow and Wine
# critical-section waits. Test one independent controlled runtime variable:
# 65520 KiB inherited macOS stack rather than Wine's default. Emit only
# fixed diagnostic classes from short-lived private Wine SEH/ntdll/ole trace.
# If native original NGen x64 and x86 complete, run UNMODIFIED signed
# .NET 4.8 MSI+MSP; otherwise stop, retain no vendor binary or trace.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-wiage-ngen-stack-seh-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: authentic-wiage-ngen-stack-seh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-microsoft-ngen-stack-ab:
    name: Compare larger inherited host stack using real Microsoft CLR4 NGen
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: 'wiage-11.13'
      use_macos26_runner: true
      host_provenance_only: false
      win7_setup: false
      try_wow64_managed: false
      try_wow64_faults: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_payload_host: false
      try_48_msi: true
      drain_native40_ngen: true
      ngen_host_stack64: true
      signed_msi_timeout_seconds: 420
      prepare_48_assembly_cache: true
      pause_native_ngen_queue: false
