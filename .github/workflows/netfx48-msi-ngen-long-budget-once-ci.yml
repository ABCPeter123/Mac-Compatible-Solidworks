name: One-shot original .NET4.8 MSI extended NGen servicing budget

# Microsoft says .NET4 native-image regeneration can take tens of minutes.
# Original signed x64 MSI previously hit a 420-second ceiling at NGen.
# Re-test only in disposable verified original CLR4 Wine prefix with a
# bounded 1200-second MSI budget, 55-minute total runner job budget.
# The original authentic MSI+MSP, Release, native CLR, managed-execution and
# 4.8.1 and SOLIDWORKS gates are NOT relaxed. No vendor media/log artifacts.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-msi-ngen-long-budget-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-netfx48-ngen-long-budget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-msi-long-ngen-diagnostic:
    name: Authenticate CLR4 then attempt signed MSI with extended NGen budget
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: '11.21'
      use_macos26_runner: true
      host_provenance_only: false
      try_48_payload_host: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_msi: true
      prepare_48_assembly_cache: true
      signed_msi_timeout_seconds: 1200
