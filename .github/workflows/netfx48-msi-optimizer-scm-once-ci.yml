name: One-shot original .NET4.8 MSI with native CLR optimizer service presence

# Independent Win32 OpenSCManagerW/OpenServiceW read-only queries in the
# original Microsoft .NET4.0 prefix before launching authenticated 4.8 MSI.
# Distinguishes actual absent / present / denied CLR optimization x64/x86,
# TrustedInstaller and msiserver from mere references in private MSI logs.
# Compare native CLR service presence before and immediately after the real
# MSI attempt, including incomplete installs. No query after denied cleanup.
# No fake service, NGen override, registry lie, binary shim, or skipped MSP.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-msi-optimizer-scm-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-netfx48-optimizer-service-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-signed-msi-scm-optimizer:
    name: Authenticate Microsoft CLR4, check native SCM services then original x64 MSI
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: '11.21'
      use_macos26_runner: true
      host_provenance_only: false
      try_48_payload_host: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_msi: true
