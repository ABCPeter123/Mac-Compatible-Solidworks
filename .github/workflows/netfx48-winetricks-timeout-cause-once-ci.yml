name: One-shot original dotnet48 Winetricks timeout stage differential

# The complete pinned 20260125 Winetricks dotnet48 verb on a verified genuine
# native Microsoft .NET 4.0 Wine prefix reached original NDP48 media but
# timed out after 840 seconds. CLR64 unchanged, Release absent.
# This bounded rerun records only allowlisted stage markers and their last
# observed class, never raw Winetricks/Microsoft logs or private paths.
# 4.8.1 and SOLIDWORKS gates stay closed without authentic 4.8.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-winetricks-timeout-cause-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: netfx48-winetricks-timeout-cause-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify-authenticated-winetricks-timeout:
    name: Identify last Winetricks prerequisite before original dotnet48 stall
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      host_provenance_only: false
      try_48_payload_host: false
      try_48_intermediate: true
      try_48_direct: false
      use_macos26_runner: true
