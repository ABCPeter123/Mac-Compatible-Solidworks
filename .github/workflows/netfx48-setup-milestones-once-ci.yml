name: One-shot original Microsoft .NET 4.8 setup phase census

# Original signed installer returns 5100 with zero recognizable BlockIf verdicts.
# A distinct bounded diagnostic establishes whether the original private
# bootstrapper transcript contains ANY BlockIf text, global-block checks,
# install/extraction phases, or only the generic terminal StopBlock.
# Private original Microsoft transcript is erased. No vendor media/logs
# may be uploaded, and no runtime installation can be claimed without
# authentic CLR/release/managed-execution verification.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-setup-milestones-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-netfx48-setup-milestones-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-setup-milestones:
    name: Diagnose original 4.8 bootstrapper stage after genuine native 4.0
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      host_provenance_only: false
      try_48_payload_host: false
      try_48_intermediate: false
      try_48_direct: true
      original_48_profile: win10
      use_macos26_runner: true
