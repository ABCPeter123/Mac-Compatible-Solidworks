name: One-shot original .NET4.8 Winetricks after disposable wineserver shutdown

# Previous signed dotnet48 tries under Wine11.21 and 11.10 froze after
# Windows-version change, process census WINETRICKS_SHELL and WINE_SERVER.
# Test whether an idle leftover Wine client prevents wineserver -w completion.
# Runs a bounded wineserver -k ONLY inside a disposable authenticated
# native-Microsoft-.NET4.0 CI prefix, immediately before full dotnet48.
# 4.8 CLR replacement, Release, native-only managed and 4.8.1 gates unchanged.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-settle-wineserver-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-dotnet48-wineserver-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticated-original-48-wineserver-control:
    name: Test original native 4.8 with only verified CLR4 and prefix-scoped server reset
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: '11.21'
      use_macos26_runner: true
      host_provenance_only: false
      try_48_payload_host: false
      try_48_direct: false
      try_48_intermediate: true
      try_48_msi: false
      reuse_verified_native40: true
      settle_wineserver: true
