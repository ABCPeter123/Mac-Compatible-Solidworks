name: Read-only .NET 4.8.1 CBS operation preflight
on:
  pull_request:
    paths:
      - 'scripts/netfx481_cbs_operation_preflight.py'
      - 'tests/test_netfx481_cbs_operation_preflight.py'
      - '.github/workflows/netfx481-cbs-operation-preflight-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-cbs-operation-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded, non-installing CBS parser
        run: python -m unittest discover -s tests -p 'test_netfx481_cbs_operation_preflight.py' -v
