name: Genuine Microsoft .NET Framework 4.8.1 on Apple Silicon Wine

on:
  pull_request:
    paths:
      - '.github/workflows/netfx481-wine-ci.yml'
      - 'probes/netfx481_runtime_probe.cs'
      - 'scripts/netfx481_trial.py'
      - 'scripts/netfx481_winetricks48_bridge.py'
      - 'tests/test_netfx481_winetricks48_bridge.py'
      - 'scripts/netfx40_msxml3_prerequisite.py'
      - 'tests/test_netfx40_msxml3_prerequisite.py'
      - 'tests/test_netfx481_trial.py'
      - 'scripts/wine_mono_removal.py'
      - 'tests/test_wine_mono_removal.py'
      - 'scripts/netfx481_setup_evidence.py'
      - 'tests/test_netfx481_setup_evidence.py'
      - 'probes/netfx481_win32_launch.c'
      - 'scripts/netfx481_win32_exit.py'
      - 'tests/test_netfx481_win32_exit.py'
      - 'scripts/netfx481_payload_audit.py'
      - 'tests/test_netfx481_payload_audit.py'
      - 'scripts/netfx481_clr_load.py'
      - 'tests/test_netfx481_clr_load.py'
      - 'probes/netfx481_clr_load.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-microsoft:
    name: Verify signed official .NET 4.8.1 installer and independent probe
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate self-authored framework verification tests
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_netfx481_trial.py' -v
      - name: Test real msxml3 prerequisite privacy and failure gates
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_netfx40_msxml3_prerequisite.py' -v
          if ($LASTEXITCODE -ne 0) { throw "msxml3 compatibility preinstall tests failed" }
      - name: Test native dotnet48 bridge cannot spoof .NET 4.8.1 success
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_netfx481_winetricks48_bridge.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Native dotnet48 to dotnet481 safety tests failed" }
      - name: Validate verified Wine Mono MSI uninstall safety tests
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_wine_mono_removal.py' -v
      - name: Validate privacy-safe setup log classification
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_netfx481_setup_evidence.py' -v
      - name: Test full Win32 exit-code parser and process safety
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_netfx481_win32_exit.py' -v
      - name: Test native CLR binary inspection and loader safety
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_netfx481_payload_audit.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Native CLR audit tests failed" }
          python -m unittest discover -s tests -p 'test_netfx481_clr_load.py' -v
          if ($LASTEXITCODE -ne 0) { throw "CLR loader tests failed" }
      - name: Compile self-authored Windows x64 process monitor and validate real 3010 preservation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "Visual Studio MSVC locator missing" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "MSVC x64 compiler not installed on reference runner" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) { throw "MSVC x64 tools environment missing" }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /DUNICODE /D_UNICODE /Fe:build\\netfx481_win32_launch.exe probes\\netfx481_win32_launch.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-win32-probe.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-win32-probe.cmd
          if ($LASTEXITCODE -ne 0) { throw "Win32 launcher reference compilation failed" }
          $proof = & build\netfx481_win32_launch.exe --selftest-3010
          if ($LASTEXITCODE -ne 0) { throw "Windows selftest failed" }
          if ($proof -notcontains "SWCOMPAT_WIN32_SETUP_EXIT_HEX=00000BC2") { throw "Full Windows 3010 code not preserved" }
          if ($proof -notcontains "SWCOMPAT_WIN32_SETUP_STATUS=EXIT") { throw "Win32 process status not returned" }
          Write-Output "Verified self-authored Win32 monitor preserves exact Windows 3010 return code"
      - name: Build and verify actual native Framework64 clr.dll loader on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "MSVC missing" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /Fe:build\\netfx481_clr_load.exe probes\\netfx481_clr_load.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-native-clr-load.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-native-clr-load.cmd
          if ($LASTEXITCODE -ne 0) { throw "Native CLR loader fixture compilation failed" }
          $proof = & build\netfx481_clr_load.exe
          if ($LASTEXITCODE -ne 0 -or $proof -notcontains "SWCOMPAT_CLR_LOAD_STATUS=LOADED") {
            throw "Reference Windows failed to LoadLibraryW real Framework64 CLR"
          }
          Write-Output "Real Windows native CLR PE LoadLibraryW reference passed"
      - name: Compile original C# Framework probe against native Windows Framework
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build | Out-Null
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "Windows Framework C# compiler is missing" }
          & $csc /nologo /target:exe /reference:System.Core.dll /reference:System.Xml.dll /out:build\netfx481_runtime_probe.exe probes\netfx481_runtime_probe.cs
          if ($LASTEXITCODE -ne 0) { throw "C# probe build failed" }
          & build\netfx481_runtime_probe.exe
          if ($LASTEXITCODE -ne 0) { throw "Original managed fixture failed on native Windows" }
      - name: Download and authenticate original Microsoft .NET Framework 4.8.1 offline installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.microsoft.com/download/4/b/2/cd00d4ed-ebdd-49ee-8a33-eabc3d1030e3/NDP481-x86-x64-AllOS-ENU.exe"
          curl.exe --fail --location --retry 3 --max-time 600 --output build/NDP481-x86-x64-AllOS-ENU.exe $url
          if ($LASTEXITCODE -ne 0) { throw "Official Microsoft offline installer unavailable" }
          $file = Get-Item build/NDP481-x86-x64-AllOS-ENU.exe
          if ($file.Length -lt 15728640 -or $file.Length -gt 262144000) { throw "Unexpected Microsoft package size" }
          $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
          if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid) { throw "Authenticode validation failed" }
          if ($null -eq $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch '(^|, )O=Microsoft Corporation(,|$)') { throw "Unexpected publisher" }
          $sha = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath build/netfx481.sha256 -Value $sha -NoNewline -Encoding ascii
          Write-Output "Actual Microsoft .NET Framework 4.8.1 offline installer publisher and full SHA256 verified"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-netfx481-original-microsoft-runtime
          path: |
            build/NDP481-x86-x64-AllOS-ENU.exe
            build/netfx481.sha256
            build/netfx481_runtime_probe.exe
            build/netfx481_win32_launch.exe
            build/netfx481_clr_load.exe
          compression-level: 0
          retention-days: 1

  macos-real-netfx:
    name: Real .NET 4.8.1 framework install in disposable Apple Silicon Wine
    runs-on: macos-15
    needs: verify-microsoft
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: signed-netfx481-original-microsoft-runtime
          path: build
      - name: Fetch and verify fixed Wine 11.21 Apple Silicon-compatible x64 build
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/wine-devel-11.21-osx64.tar.xz"
          curl --fail --location --retry 3 --output "$ARCHIVE" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-devel-11.21-osx64.tar.xz"
          echo "9909b486657e10ab66c7279371ae1f990345b596b3b1b3a0cf21f28af24fa0ce  $ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/wine-build"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/wine-build"
          WINE_BIN="$(find "$RUNNER_TEMP/wine-build" -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN" && test -x "$WINE_BIN"
          echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
      - name: Initialize isolated, explicitly disposable Wine prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m swcompat --prefix "$RUNNER_TEMP/netfx481-prefix" --logs-dir "$RUNNER_TEMP/netfx481-logs" init
          touch "$RUNNER_TEMP/netfx481-prefix/.swcompat-netfx481-disposable"
          # .NET 4.8.1 is an in-place framework offered for Windows 10 too.
          # Wine's Windows 11 profile can imply 4.8.1 is already included.
          # Temporarily use Windows 10 for Microsoft Framework setup ONLY.
          python3 -m swcompat --prefix "$RUNNER_TEMP/netfx481-prefix" --logs-dir "$RUNNER_TEMP/netfx481-logs" set-winver win10
      - name: Install original Microsoft .NET 4.8.1 and validate runtime identity and managed execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx481_trial \
            --wine "$SWCOMPAT_WINE" --prefix "$RUNNER_TEMP/netfx481-prefix" \
            --installer build/NDP481-x86-x64-AllOS-ENU.exe \
            --sha256-file build/netfx481.sha256 \
            --probe build/netfx481_runtime_probe.exe \
            --win32-launcher build/netfx481_win32_launch.exe \
            --clr-loader build/netfx481_clr_load.exe \
            --experiment-fusion-builtin \
            --output build/netfx481-experiment.json \
            --timeout 210 --agree-disposable-prefix --experiment-clear-false-release --experiment-clear-wow6432-release --experiment-remove-wine-mono --experiment-reboot-after-possible-3010 --experiment-setup-log
      - name: Restore reported Windows 11 profile and retest managed CLR functionality
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/netfx481-prefix"
          if [ -f "$PREFIX/.swcompat-netfx481-disposable" ]; then
            python3 -m swcompat --prefix "$PREFIX" \
              --logs-dir "$RUNNER_TEMP/netfx481-logs" set-winver win11
            if [ -f build/netfx481-experiment.json ]; then
              python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx481_trial import probe, runtime_ready
          prefix = Path(os.environ["RUNNER_TEMP"]) / "netfx481-prefix"
          wine = Path(os.environ["SWCOMPAT_WINE"])
          fixture = Path("build/netfx481_runtime_probe.exe").resolve()
          status = probe(wine, prefix, fixture)
          report = Path("build/netfx481-experiment.json")
          data = json.loads(report.read_text(encoding="utf-8"))
          data["install_os_profile"] = "WIN10_REPORTED"
          data["post_restore_os_profile"] = "WIN11_REPORTED"
          data["post_restore_wine11"] = status
          data["post_restore_framework_ready"] = runtime_ready(status)
          report.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Returned Wine profile to Windows 11; runtime ready:",
                data["post_restore_framework_ready"])
          PY
            fi
          fi
      - name: Report exact outcome, never turn Wine Mono or registry spoof into Microsoft Framework
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path("build/netfx481-experiment.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Genuine Microsoft .NET Framework 4.8.1 under Apple Silicon Wine\n\n")
              if not report.is_file():
                  out.write("Trial did not yield a complete report. No compatibility claim.\n")
              else:
                  result = json.loads(report.read_text(encoding="utf-8"))
                  out.write("False preexisting .NET registry adjustment: **" + result["registry_adjustment"] + "**\n\n")
                  out.write("32-bit Wine Mono Release prior: **" + result["wow6432_release"]["before"] + "**\n\n")
                  out.write("32-bit Wine Mono Release correction: **" + result["wow6432_release"]["action"] + "**\n\n")
                  out.write("Registered Wine Mono MSI removal: **" + result["wine_mono_removal"]["action"] + "**\n\n")
                  out.write("Possible Win32 3010 (Unix status 194): **" + result["wine_restart"]["reason"] + "**\n\n")
                  out.write("Simulated disposable-prefix reboot: **" + result["wine_restart"]["action"] + "**\n\n")
                  out.write("32-bit Wine Mono Release afterward: **" + result["wow6432_release"]["after"] + "**\n\n")
                  out.write("Microsoft setup temporary reported OS: **" + result.get("install_os_profile", "NOT_VERIFIED") + "**\n\n")
                  out.write("Wine profile restored: **" + result.get("post_restore_os_profile", "NOT_VERIFIED") + "**\n\n")
                  out.write("Framework readiness after restoring Windows 11: **" + str(result.get("post_restore_framework_ready", False)) + "**\n\n")
                  out.write("Original signed Microsoft offline setup: **" + result["install_execution"] + "**\n\n")
                  win32 = result["win32_launch"]
                  out.write("Win32 original process capture: **" + win32["status"] + "**\n\n")
                  out.write("Windows full 32-bit process exit (hex): **" + win32["exit_hex"] + "**\n\n")
                  out.write("Windows exit classification: **" + win32["category"] + "**\n\n")
                  out.write("Direct bootstrapper child observed: **" + win32["child_seen"] + "**\n\n")
                  payload = result["payload_audit"]
                  out.write("CLR file inventory measurement: **" + payload["status"] + "**\n\n")
                  out.write("Microsoft setup scoped Fusion policy: **" + result["fusion_setup_override"] + "**\n\n")
                  out.write("Framework64 native CLR before: **" + payload["before"]["CLR64"] + "**\n\n")
                  out.write("Framework64 native CLR after: **" + payload["after"]["CLR64"] + "**\n\n")
                  out.write("Framework64 native CLR file change: **" + payload["changes"]["CLR64"] + "**\n\n")
                  out.write("Framework64 mscorlib after: **" + payload["after"]["MSCORLIB64"] + "**\n\n")
                  out.write("Framework x86 native CLR after: **" + payload["after"]["CLR32"] + "**\n\n")
                  out.write("Framework x86 mscorlib after: **" + payload["after"]["MSCORLIB32"] + "**\n\n")
                  out.write("Real Win32 native CLR LoadLibraryW: **" + result["clr_dll_load"] + "**\n\n")
                  out.write("Direct child lifecycle after parent exit: **" + win32["child_lifecycle"] + "**\n\n")
                  out.write("Observed direct child exit classification: **" + win32["child_exit"] + "**\n\n")
                  out.write("Genuine Microsoft setup /log: **" + result["setup_evidence"]["status"] + "**\n\n")
                  out.write("Microsoft setup failure stage: **" + result["setup_evidence"]["phase"] + "**\n\n")
                  out.write("Recognized Windows error categories: **" + ", ".join(result["setup_evidence"]["codes"] or ["NONE"]) + "**\n\n")
                  other = result["secondary_evidence"]
                  out.write("Secondary Windows setup log collection: **" + other["status"] + "**\n\n")
                  out.write("Secondary source files inspected: **" + str(other["files_scanned"]) + "**\n\n")
                  out.write("Secondary setup failure stage: **" + other["phase"] + "**\n\n")
                  out.write("Secondary Windows error categories: **" + ", ".join(other["codes"] or ["NONE"]) + "**\n\n")
                  out.write("Framework registry signal: **" + result["after"]["registry"] + "**\n\n")
                  out.write("Independent CLR identity: **" + result["after"]["clr_family"] + "**\n\n")
                  out.write("Real managed operations: **" + result["after"]["managed"] + "**\n\n")
                  out.write("Default Microsoft CLR readiness: **" + str(result["framework_runtime_ready"]) + "**\n\n")
                  out.write("Native-first CLR family: **" + result["after_native_first"]["clr_family"] + "**\n\n")
                  out.write("Native-first readiness: **" + str(result["native_first_runtime_ready"]) + "**\n\n")
                  out.write("Native-only CLR family: **" + result["after_native_only"]["clr_family"] + "**\n\n")
                  out.write("Native-only readiness: **" + str(result["native_only_runtime_ready"]) + "**\n\n")
                  out.write("SOLIDWORKS installation, activation and CAD: **NOT TESTED**\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netfx481-macos-original-microsoft-runtime-sanitized
          path: build/netfx481-experiment.json
          if-no-files-found: warn
          retention-days: 7
      - name: Ensure the trial produced a complete privacy-safe result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build/netfx481-experiment.json").read_text())
          assert data["scope"] == "MICROSOFT_NETFX481_WINE_DISPOSABLE_EXPERIMENT"
          assert data["media_sha256_verified"] is True
          assert data["solidworks_compatibility"] == "NOT_DEMONSTRATED"
          from scripts.netfx481_payload_audit import validate as validate_payload
          from scripts.netfx481_clr_load import STATUSES as CLR_LOAD_STATES
          assert validate_payload(data["payload_audit"])
          assert data["payload_audit"]["status"] == "MEASURED"
          assert data["fusion_setup_override"] == "BUILTIN_ONLY"
          assert data["clr_dll_load"] in CLR_LOAD_STATES
          assert data["clr_dll_load"] != "NOT_REQUESTED"
          from scripts.netfx481_win32_exit import validate as validate_win32
          assert validate_win32(data["win32_launch"])
          assert data["win32_launch"]["status"] != "NOT_REQUESTED"
          from scripts.netfx481_setup_evidence import KNOWN_CODES, KNOWN_PHASES, KNOWN_RESULTS
          evidence = data["setup_evidence"]
          assert evidence["status"] in KNOWN_RESULTS
          assert evidence["phase"] in KNOWN_PHASES
          assert isinstance(evidence["codes"], list)
          assert all(code in KNOWN_CODES.values() for code in evidence["codes"])
          from scripts.netfx481_setup_evidence import validate_secondary_report
          assert validate_secondary_report(data["secondary_evidence"])
          assert data["wine_restart"]["action"] in {"COMPLETED", "NOT_NEEDED", "WINEBOOT_MISSING", "TIMED_OUT", "START_FAILED", "EXIT_NONZERO", "SKIPPED_CHILD_ACTIVE", "SKIPPED_CHILD_UNVERIFIED"}
          assert data["wine_restart"]["reason"] in {"UNIX_194_POSSIBLE_3010", "WIN32_3010_CONFIRMED", "NO_3010_SIGNAL"}
          assert data["wine_mono_removal"]["action"] in {"REMOVED", "NOT_APPLICABLE", "MONO_NOT_REGISTERED", "INVENTORY_FAILED", "REMOVE_FAILED", "VERIFY_FAILED"}
          assert data["wow6432_release"]["action"] in {"CLEARED", "NOT_NEEDED", "NOT_APPLICABLE", "DELETE_FAILED", "QUERY_FAILED", "VERIFY_FAILED"}
          assert "after_native_first" in data and "after_native_only" in data
          assert type(data["runtime_ready_with_controlled_override"]) is bool
          assert data["install_os_profile"] == "WIN10_REPORTED"
          assert data["post_restore_os_profile"] == "WIN11_REPORTED"
          assert type(data["post_restore_framework_ready"]) is bool
          PY


  apple-silicon-msxml3-netfx481:
    name: Try original Microsoft .NET 4.8.1 with msxml3 first on Apple Silicon
    runs-on: macos-15
    needs: verify-microsoft
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: signed-netfx481-original-microsoft-runtime
          path: build
      - name: Prepare verified Winetricks msxml3 command and cabextract
        shell: bash
        run: |
          set -euo pipefail
          brew install winetricks
          command -v cabextract >/dev/null
          winetricks --version | grep -F '20260125'
          echo "SWCOMPAT_WINETRICKS=$(realpath "$(command -v winetricks)")" >> "$GITHUB_ENV"
      - name: Verify identical Apple Silicon Wine Development 11.21 as the baseline
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/wine-devel-11.21-osx64.tar.xz"
          curl --fail --location --retry 3 --output "$ARCHIVE" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-devel-11.21-osx64.tar.xz"
          echo "9909b486657e10ab66c7279371ae1f990345b596b3b1b3a0cf21f28af24fa0ce  $ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/netfx481-msxml3-wine"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/netfx481-msxml3-wine"
          WINE_BIN="$(find "$RUNNER_TEMP/netfx481-msxml3-wine" -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN" && test -x "$WINE_BIN"
          echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
      - name: Initialize fresh marked prefix with the same Windows 10 setup profile
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/netfx481-msxml3-prefix"
          LOGS="$RUNNER_TEMP/netfx481-msxml3-logs"
          python3 -m swcompat --prefix "$PREFIX" --logs-dir "$LOGS" init
          touch "$PREFIX/.swcompat-netfx481-disposable"
          python3 -m swcompat --prefix "$PREFIX" --logs-dir "$LOGS" set-winver win10
      - name: Install msxml3 before the unchanged original Microsoft 4.8.1 setup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_msxml3_prerequisite \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx481-msxml3-prefix" \
            --winetricks "$SWCOMPAT_WINETRICKS" \
            --output build/netfx481-msxml3-prerequisite.json \
            --timeout 300 --agree-disposable-prefix
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx40_msxml3_prerequisite import validate
          r = json.loads(Path("build/netfx481-msxml3-prerequisite.json").read_text())
          assert validate(r)
          if (r["status"] == "VERB_SUCCEEDED"
                  and r["x86_dll_changed"] and r["x64_dll_changed"]):
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("SWCOMPAT_NETFX481_MSXML3_READY=yes\n")
          PY
      - name: Restore Windows 10 setup profile after msxml3
        if: env.SWCOMPAT_NETFX481_MSXML3_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m swcompat \
            --prefix "$RUNNER_TEMP/netfx481-msxml3-prefix" \
            --logs-dir "$RUNNER_TEMP/netfx481-msxml3-logs" set-winver win10
      - name: Test verified Windows 10 compatibility sidecar on original .NET 4.8.1
        if: env.SWCOMPAT_NETFX481_MSXML3_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx481_trial import validate_prefix, verify_media
          prefix = Path(os.environ["RUNNER_TEMP"]) / "netfx481-msxml3-prefix"
          validate_prefix(prefix)
          installer = Path("build/NDP481-x86-x64-AllOS-ENU.exe")
          digest = Path("build/netfx481.sha256")
          sidecar = installer.with_name(installer.name + ".manifest")
          manifest = Path("probes/winver_481_win10.manifest")
          assert not sidecar.exists() and not sidecar.is_symlink() and not manifest.is_symlink()
          assert verify_media(installer, digest)
          xml = manifest.read_text(encoding="utf-8")
          assert "8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a" in xml and len(xml) < 2048
          with sidecar.open("x", encoding="utf-8") as f:
              f.write(xml)
          assert verify_media(installer, digest)
          Path("build/netfx481-direct-sidecar-setup.json").write_text(
              json.dumps({"status": "WRITTEN", "original_media_unchanged": True}),
              encoding="ascii")
          print("Original signed Microsoft installer unchanged, Windows 10 sidecar active")
          PY
          WINEPREFIX="$RUNNER_TEMP/netfx481-msxml3-prefix" WINEARCH=win64 WINEDEBUG=-all \
            "$SWCOMPAT_WINE" reg.exe add 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\SideBySide' \
            /v PreferExternalManifest /t REG_DWORD /d 1 /f >/dev/null 2>&1
      - name: Run unchanged authentic Microsoft .NET 4.8.1 installer after msxml3
        if: env.SWCOMPAT_NETFX481_MSXML3_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx481_trial \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx481-msxml3-prefix" \
            --installer build/NDP481-x86-x64-AllOS-ENU.exe \
            --sha256-file build/netfx481.sha256 \
            --probe build/netfx481_runtime_probe.exe \
            --win32-launcher build/netfx481_win32_launch.exe \
            --clr-loader build/netfx481_clr_load.exe \
            --experiment-fusion-builtin \
            --output build/netfx481-msxml3-experiment.json \
            --timeout 210 --agree-disposable-prefix \
            --experiment-clear-false-release \
            --experiment-clear-wow6432-release \
            --experiment-remove-wine-mono \
            --experiment-reboot-after-possible-3010 \
            --experiment-setup-log
      - name: Remove external manifest after original .NET 4.8.1 setup
        if: always() && env.SWCOMPAT_NETFX481_MSXML3_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.netfx481_trial import verify_media
          installer = Path("build/NDP481-x86-x64-AllOS-ENU.exe")
          sidecar = installer.with_name(installer.name + ".manifest")
          expected = Path("probes/winver_481_win10.manifest").read_bytes()
          if sidecar.is_file():
              assert not sidecar.is_symlink() and sidecar.read_bytes() == expected
              sidecar.unlink()
          assert not sidecar.exists()
          assert verify_media(installer, Path("build/netfx481.sha256"))
          Path("build/netfx481-direct-sidecar-cleanup.json").write_text(
              json.dumps({"status": "REMOVED", "original_media_unchanged": True}),
              encoding="ascii")
          print("Signed original Microsoft .NET 4.8.1 bytes verified unchanged after setup")
          PY
          WINEPREFIX="$RUNNER_TEMP/netfx481-msxml3-prefix" WINEARCH=win64 WINEDEBUG=-all \
            "$SWCOMPAT_WINE" reg.exe delete 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\SideBySide' \
            /v PreferExternalManifest /f >/dev/null 2>&1 || true
      - name: Restore Windows 11 profile and test the actual managed runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/netfx481-msxml3-prefix"
          if [ -f "$PREFIX/.swcompat-netfx481-disposable" ]; then
            python3 -m swcompat --prefix "$PREFIX" \
              --logs-dir "$RUNNER_TEMP/netfx481-msxml3-logs" set-winver win11
            if [ -f build/netfx481-msxml3-experiment.json ]; then
              python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx481_trial import probe, runtime_ready
          wine = Path(os.environ["SWCOMPAT_WINE"])
          prefix = Path(os.environ["RUNNER_TEMP"]) / "netfx481-msxml3-prefix"
          fixture = Path("build/netfx481_runtime_probe.exe").resolve()
          status = probe(wine, prefix, fixture)
          result = Path("build/netfx481-msxml3-experiment.json")
          data = json.loads(result.read_text(encoding="utf-8"))
          data["install_os_profile"] = "WIN10_REPORTED"
          data["post_restore_os_profile"] = "WIN11_REPORTED"
          data["post_restore_wine11"] = status
          data["post_restore_framework_ready"] = runtime_ready(status)
          result.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Original .NET 4.8.1 after msxml3 Windows 11 managed gate:",
                data["post_restore_framework_ready"])
          PY
            fi
          fi
      - name: Report allowlisted prerequisites and original .NET 4.8.1 outcome
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx40_msxml3_prerequisite import validate as pre_valid
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Original Microsoft .NET 4.8.1 after native msxml3\n\n")
              pre = Path("build/netfx481-msxml3-prerequisite.json")
              if pre.is_file():
                  r = json.loads(pre.read_text())
                  assert pre_valid(r)
                  for k in ("status", "x86_dll_changed", "x64_dll_changed"):
                      f.write(f"msxml3_{k}: **{r[k]}**\n\n")
              else:
                  f.write("msxml3 prerequisite: **NOT_RUN**\n\n")
              p = Path("build/netfx481-msxml3-experiment.json")
              if p.is_file():
                  r = json.loads(p.read_text())
                  for k in ("install_execution", "clr_dll_load",
                            "framework_runtime_ready", "native_only_runtime_ready",
                            "post_restore_framework_ready", "solidworks_compatibility"):
                      f.write(f"original_netfx481_{k}: **{r.get(k, 'NOT_VERIFIED')}**\n\n")
                  for k in ("status", "category", "child_lifecycle"):
                      f.write(f"original_win32_{k}: **{r['win32_launch'][k]}**\n\n")
                  for k in ("clr_family", "managed", "registry"):
                      f.write(f"original_after_{k}: **{r['after'][k]}**\n\n")
              else:
                  f.write("Original .NET 4.8.1 setup after msxml3: **NOT_RUN**\n\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netfx481-original-after-msxml3-private-safe
          path: |
            build/netfx481-msxml3-prerequisite.json
            build/netfx481-msxml3-experiment.json
            build/netfx481-direct-sidecar-setup.json
            build/netfx481-direct-sidecar-cleanup.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require real signed installer measurement without false SOLIDWORKS claims
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.netfx40_msxml3_prerequisite import validate as pre_valid
          from scripts.netfx481_win32_exit import validate as win32_valid
          pre = Path("build/netfx481-msxml3-prerequisite.json")
          assert pre.is_file(), "No msxml3 trial result"
          p = json.loads(pre.read_text())
          assert pre_valid(p)
          runtime = Path("build/netfx481-msxml3-experiment.json")
          if (p["status"] == "VERB_SUCCEEDED"
                  and p["x86_dll_changed"] and p["x64_dll_changed"]):
              assert runtime.is_file(), "Original .NET 4.8.1 trial did not execute"
          if runtime.is_file():
              for name, expected in (("setup", "WRITTEN"), ("cleanup", "REMOVED")):
                  policy = Path(f"build/netfx481-direct-sidecar-{name}.json")
                  assert policy.is_file(), "Original Microsoft sidecar setup not verified"
                  assert json.loads(policy.read_text()) == {
                      "status": expected, "original_media_unchanged": True}
              r = json.loads(runtime.read_text())
              assert r["scope"] == "MICROSOFT_NETFX481_WINE_DISPOSABLE_EXPERIMENT"
              assert r["media_sha256_verified"] is True
              assert r["solidworks_compatibility"] == "NOT_DEMONSTRATED"
              assert r["install_os_profile"] == "WIN10_REPORTED"
              assert r["post_restore_os_profile"] == "WIN11_REPORTED"
              assert win32_valid(r["win32_launch"])
              assert r["win32_launch"]["status"] != "NOT_REQUESTED"
              assert type(r["native_only_runtime_ready"]) is bool
              assert type(r["post_restore_framework_ready"]) is bool
              if r["post_restore_framework_ready"]:
                  assert r["post_restore_wine11"]["managed"] == "PASS"
          PY

  apple-silicon-winetricks48-bridge:
    name: Install original .NET 4.8.1 after upstream Winetricks dotnet48 sequence
    needs: verify-microsoft
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: signed-netfx481-original-microsoft-runtime
          path: build
      - name: Install real Winetricks 20260125 prerequisite recipes
        shell: bash
        run: |
          set -euo pipefail
          brew install winetricks
          command -v cabextract >/dev/null
          winetricks --version | grep -F '20260125'
          echo "SWCOMPAT_WINETRICKS=$(realpath "$(command -v winetricks)")" >> "$GITHUB_ENV"
      - name: Install hash-pinned Wine Development 11.21 compatible with Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/wine-devel-11.21-osx64.tar.xz"
          curl --fail --location --retry 3 --output "$ARCHIVE" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-devel-11.21-osx64.tar.xz"
          echo "9909b486657e10ab66c7279371ae1f990345b596b3b1b3a0cf21f28af24fa0ce  $ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/wine-48bridge"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/wine-48bridge"
          WINE_BIN="$(find "$RUNNER_TEMP/wine-48bridge" -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN" && test -x "$WINE_BIN"
          echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
      - name: Create marked disposable 64-bit prefix for upstream dependency sequence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m swcompat --prefix "$RUNNER_TEMP/netfx481-48bridge-prefix" \
            --logs-dir "$RUNNER_TEMP/netfx481-48bridge-logs" init
          touch "$RUNNER_TEMP/netfx481-48bridge-prefix/.swcompat-netfx481-disposable"
      - name: Install msxml3 prerequisite before Winetricks genuine dotnet48 recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_msxml3_prerequisite \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx481-48bridge-prefix" \
            --winetricks "$SWCOMPAT_WINETRICKS" \
            --output build/netfx481-48bridge-msxml3.json \
            --timeout 300 --agree-disposable-prefix
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx40_msxml3_prerequisite import validate
          result = json.loads(Path("build/netfx481-48bridge-msxml3.json").read_text())
          assert validate(result)
          if result["status"] == "VERB_SUCCEEDED":
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("SWCOMPAT_48BRIDGE_MSXML3_READY=yes\n")
          PY
      - name: Attempt genuine dotnet48 recipe followed by original signed Microsoft 4.8.1
        if: env.SWCOMPAT_48BRIDGE_MSXML3_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx481_winetricks48_bridge \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx481-48bridge-prefix" \
            --winetricks "$SWCOMPAT_WINETRICKS" \
            --installer481 build/NDP481-x86-x64-AllOS-ENU.exe \
            --sha481 build/netfx481.sha256 \
            --launcher481 build/netfx481_win32_launch.exe \
            --loader build/netfx481_clr_load.exe \
            --managed build/netfx481_runtime_probe.exe \
            --output build/netfx481-48bridge.json \
            --timeout 600 --agree-disposable-prefix
      - name: Report strictly verified native .NET 4.8 and 4.8.1 categories
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx40_msxml3_prerequisite import validate as valid_msxml
          from scripts.netfx481_winetricks48_bridge import validate as valid_bridge
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Genuine Winetricks dotnet48 to signed .NET 4.8.1 bridge\n\n")
              pre = Path("build/netfx481-48bridge-msxml3.json")
              if pre.is_file():
                  value = json.loads(pre.read_text())
                  assert valid_msxml(value)
                  f.write(f"msxml3_prerequisite: **{value['status']}**\n\n")
              report = Path("build/netfx481-48bridge.json")
              if not report.is_file():
                  f.write("Authentic .NET bridge result: **NOT_RUN**\n\n")
              else:
                  r = json.loads(report.read_text())
                  assert valid_bridge(r)
                  for k in ("status", "winetricks48_exit", "verb_reboot",
                            "native48_release", "native48_candidate",
                            "clr64_before481", "clr64_after481", "clr64_change",
                            "native_loader", "native_only_managed", "runtime_family",
                            "framework481_registry", "restart", "native481_confirmed",
                            "solidworks"):
                      f.write(f"{k}: **{r[k]}**\n\n")
                  for k in ("status", "category", "child_lifecycle"):
                      f.write(f"original481_setup_{k}: **{r['setup'][k]}**\n\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-481-after-upstream-dotnet48-private-safe
          path: |
            build/netfx481-48bridge-msxml3.json
            build/netfx481-48bridge.json
          if-no-files-found: warn
          retention-days: 7
      - name: Prevent CI green from claiming an uninstalled Microsoft CLR
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.netfx40_msxml3_prerequisite import validate as valid_msxml
          from scripts.netfx481_winetricks48_bridge import validate as valid_bridge
          p = Path("build/netfx481-48bridge-msxml3.json")
          assert p.is_file(), "Required msxml3 proof missing"
          pre = json.loads(p.read_text())
          assert valid_msxml(pre)
          if pre["status"] == "VERB_SUCCEEDED":
              report = Path("build/netfx481-48bridge.json")
              assert report.is_file(), "Winetricks dotnet48 trial not attempted"
              r = json.loads(report.read_text())
              assert valid_bridge(r)
              assert r["solidworks"] == "NOT_DEMONSTRATED"
              if r["native481_confirmed"]:
                  assert r["native48_candidate"]
                  assert r["native48_release"] == "AT_LEAST_48"
                  assert r["clr64_change"] == "CHANGED"
                  assert r["native_loader"] == "LOADED"
                  assert r["native_only_managed"] == "PASS"
                  assert r["framework481_registry"] == "AT_LEAST_481"
          PY
