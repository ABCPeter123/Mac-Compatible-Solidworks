name: Functional COM registration and activation on Wine

on:
  push:
    paths:
      - '.github/workflows/com-lifecycle-ci.yml'
      - 'probes/com_inproc_server.c'
      - 'probes/com_lifecycle_check.c'
      - 'scripts/com_lifecycle.py'
      - 'tests/test_com_lifecycle.py'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: com-lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build native Windows x64 COM server and client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 x64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Compile server DLL and independent client
        run: |
          set -euo pipefail
          mkdir -p build
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -shared \
            probes/com_inproc_server.c -o build/swcompat_com.dll \
            -lole32 -ladvapi32 -luuid
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -municode \
            probes/com_lifecycle_check.c -o build/com_check.exe \
            -lole32 -ladvapi32 -luuid
          file build/swcompat_com.dll build/com_check.exe
          x86_64-w64-mingw32-objdump -p build/swcompat_com.dll > build/com-exports.txt
          grep -q 'DllGetClassObject' build/com-exports.txt
          grep -q 'DllRegisterServer' build/com-exports.txt
      - uses: actions/upload-artifact@v4
        with:
          name: original-com-windows-x64
          path: |
            build/swcompat_com.dll
            build/com_check.exe
          retention-days: 5

  native-reference:
    name: Windows Server COM registration reference
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: original-com-windows-x64
          path: build
      - name: Register, activate and unregister original COM DLL
        shell: pwsh
        run: |
          python -m scripts.com_lifecycle --host native --checker build/com_check.exe --dll build/swcompat_com.dll --output build/com-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com-lifecycle-windows-reference
          path: build/com-*-result.json
          retention-days: 7
          if-no-files-found: warn

  linux-wine:
    name: Linux Wine cross-process COM activation
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: original-com-windows-x64
          path: build
      - name: Install Wine and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 xvfb xauth
      - name: Initialize isolated prefix
        run: xvfb-run -a python -m swcompat --prefix "$RUNNER_TEMP/com-prefix" --logs-dir build/logs init
      - name: Diagnose standard per-user COM registration
        continue-on-error: true
        run: xvfb-run -a python -m scripts.com_lifecycle --host wine --mode user --prefix "$RUNNER_TEMP/com-prefix" --checker build/com_check.exe --dll build/swcompat_com.dll --output build/com-user-result.json
      - name: Check isolated Wine HKCR fallback registration
        run: xvfb-run -a python -m scripts.com_lifecycle --host wine --mode classes-root --prefix "$RUNNER_TEMP/com-prefix" --checker build/com_check.exe --dll build/swcompat_com.dll --output build/com-root-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com-lifecycle-linux-wine
          path: build/com-*-result.json
          retention-days: 7
          if-no-files-found: warn

  macos-wine:
    name: Apple Silicon Wine cross-process COM activation
    needs: build
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: original-com-windows-x64
          path: build
      - name: Download checksum-pinned Wine 11.21
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/wine-devel-11.21-osx64.tar.xz"
          curl --fail --location --retry 3 --output "$ARCHIVE" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-devel-11.21-osx64.tar.xz"
          echo "9909b486657e10ab66c7279371ae1f990345b596b3b1b3a0cf21f28af24fa0ce  $ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/wine-build"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/wine-build"
          WINE_BIN="$(find "$RUNNER_TEMP/wine-build" -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN" && test -x "$WINE_BIN"
          echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
      - name: Initialize isolated Windows x64 Wine prefix
        run: python -m swcompat --prefix "$RUNNER_TEMP/com-prefix" --logs-dir build/logs init
      - name: Diagnose standard per-user COM registration
        continue-on-error: true
        run: python -m scripts.com_lifecycle --host wine --mode user --prefix "$RUNNER_TEMP/com-prefix" --checker build/com_check.exe --dll build/swcompat_com.dll --output build/com-user-result.json
      - name: Check isolated Wine HKCR fallback registration
        run: python -m scripts.com_lifecycle --host wine --mode classes-root --prefix "$RUNNER_TEMP/com-prefix" --checker build/com_check.exe --dll build/swcompat_com.dll --output build/com-root-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com-lifecycle-macos-wine
          path: build/com-*-result.json
          retention-days: 7
          if-no-files-found: warn
