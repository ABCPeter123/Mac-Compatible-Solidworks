name: One-shot Wiage drain Microsoft CLR4 NGen queues then signed .NET 4.8 MSI

# The original signed .NET 4.0 setup timed out, but verified native Microsoft
# x64 and x86 CLR survived restart. The subsequent signed .NET 4.8 x64 MSI
# installed/registered a real 4.8 CLR and hosted original managed code, but
# timed out in an NGen custom action and never launched the original MSP.
# Test a specific Microsoft-documented servicing dependency: drain any queued
# native CLR4 compilation synchronously before starting 4.8 MSI.
# This uses BOTH original installed Microsoft x86/x64 NGen executables.
# If either cannot fully drain, stop BEFORE the 4.8 MSI and report only fixed
# classification fields. No stub ngen, bypassed custom action, fake Release,
# copied DLL, private log, or vendor binary is permitted.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-wiage-ngen-drain-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: authentic-wiage-clr4-ngen-drain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  genuine-ngen-drain-before-signed-msi:
    name: Drain original Microsoft x64/x86 NGen before signed 4.8 MSI
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: 'wiage-11.13'
      use_macos26_runner: true
      host_provenance_only: false
      win7_setup: false
      try_wow64_managed: false
      try_wow64_faults: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_payload_host: false
      try_48_msi: true
      drain_native40_ngen: true
      signed_msi_timeout_seconds: 420
      prepare_48_assembly_cache: true
      pause_native_ngen_queue: false
