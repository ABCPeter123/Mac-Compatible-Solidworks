name: One-shot Wine 11.10 versus 11.21 dotnet48 compatibility differential

# Official Gcenx Wine Staging 11.10 SHA256-pinned asset, fresh Apple
# Silicon macOS 26 CI prefix, authentic Microsoft native CLR 4.0 first.
# This changes ONLY the Wine engine from the unsuccessful 11.21 baseline.
# Pinned Winetricks 20260125 dotnet48, original Microsoft media and all
# native 4.8/4.8.1 / SOLIDWORKS verification gates remain unchanged.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-wine1110-full-verb-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: netfx48-wine1110-full-verb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wine-1110-native48-control:
    name: Compare native 4.8 on SHA256 verified Wine Staging 11.10
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: '11.10'
      use_macos26_runner: true
      host_provenance_only: false
      try_48_payload_host: false
      try_48_direct: false
      try_48_intermediate: true
