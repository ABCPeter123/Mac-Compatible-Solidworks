name: One-shot authenticated original Microsoft .NET 4.8 with Winetricks flags

# Exact .NET 4.8 argument ordering from current upstream Winetricks and
# Bottles recipes: /sfxlang:1027 /q /norestart on reported Windows 7.
# The previously tested /q /norestart /log mode returned 5100 on Win7/Win10.
# All media is signed Microsoft original and verified independently in CI.
# Genuine CLR binaries, registry Release and native managed execution must
# change before this trial can count as an actual .NET 4.8 success.
# No raw original vendor transcript, installer or private path is uploaded.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-winetricks-flags-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-netfx48-exact-winetricks-flags-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authentic-original-48-upstream-flags:
    name: Verify native 4.0 then original signed 4.8 Winetricks-style arguments
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      host_provenance_only: false
      try_48_payload_host: false
      try_48_intermediate: false
      try_48_direct: true
      original_48_profile: win7
      original_48_setup_args: winetricks
      use_macos26_runner: true
