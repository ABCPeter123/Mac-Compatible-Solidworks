name: One-shot authenticated .NET 4.8 CLR payload hosting trial

# A main-branch change to this workflow triggers the experiment once.
# Next run tests the merged signed-MZZ staging repairs and the bounded
# same-basename x86-to-x64 extraction fallback from PR #177. We must first
# establish genuine Microsoft .NET 4.0 managed execution in the Wine prefix.
# No signed Microsoft 4.8 original becomes a runtime install or artifact.
# All original Microsoft 4.0 files must still be restored after the trial.
# Genuine original 4.0 must first pass native CLR hosting. The 4.8 media
# is Authenticode-bound and staged only inside a disposable Wine prefix.
# Neither 4.8 nor 4.8.1 installers are executed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-core-host-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: netfx48-core-host-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticated-48-payload:
    name: Test original 4.8 CLR against verified native 4.0 Wine
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      host_provenance_only: true
      try_48_payload_host: true
      try_48_intermediate: false
      try_48_direct: false
