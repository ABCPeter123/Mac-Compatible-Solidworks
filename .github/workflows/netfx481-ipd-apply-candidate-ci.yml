name: Experimental verified IPD WUSA servicing on native CLR4
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/netfx481-ipd-apply-candidate-ci.yml'
permissions:
  contents: read
concurrency:
  group: ipd-apply-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-clr4-ipd:
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: 'wiage-11.13'
      use_macos26_runner: true
      host_provenance_only: false
      win7_setup: false
      try_48_msi: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_payload_host: false
      try_481_catalog_wusa: true
      try_481_ipd_apply_candidate: true
