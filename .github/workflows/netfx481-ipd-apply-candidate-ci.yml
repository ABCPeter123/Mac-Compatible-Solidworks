name: Experimental verified IPD WUSA servicing on native CLR4
on:
  workflow_dispatch:
    inputs:
      try_solidworks_after_ipd:
        description: 'Launch private licensed SOLIDWORKS bootstrapper only after native framework and WebView2 verification'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/netfx481-ipd-apply-candidate-ci.yml'
permissions:
  contents: read
concurrency:
  group: ipd-apply-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Exercise the exact-clean-1603 fresh-prefix synchronization differential
  # from the reusable workflow; the first attempt retains the proven profile.
  # On a failed first attempt, measure only public API returns in MSI DLL scopes.
  # After verified dual-architecture CLR/GAC, test marked GDI and WebView2.
  # Measure local DOM and browser composition in the same verified prefix.
  original-native-clr4-ipd:
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: 'wiage-11.13'
      use_macos26_runner: true
      host_provenance_only: false
      win7_setup: false
      try_48_msi: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_payload_host: false
      try_481_catalog_wusa: true
      try_481_ipd_apply_candidate: true
      try_webview2_after_ipd: true
      try_solidworks_after_ipd: ${{ github.event_name == 'workflow_dispatch' && inputs.try_solidworks_after_ipd }}
    secrets:
      SWCOMPAT_INSTALLER_URL: ${{ secrets.SWCOMPAT_INSTALLER_URL }}
      SWCOMPAT_INSTALLER_SHA256: ${{ secrets.SWCOMPAT_INSTALLER_SHA256 }}

# Preserve full Windows installer exit and use separate native CAD result packets.

# Experimental prerequisite order: verified WebView2 first, then native CLR; re-probe both after servicing.

# Recover only an observed functional browser after verified shutdown and restart; keep strict licensed-launch gate.
