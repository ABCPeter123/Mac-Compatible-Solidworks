name: One-shot genuine .NET4.8 MSI NGen log and MSDTC evidence

# Diagnose the NGen custom-action timeout and independent real MSDTC
# SCM state. Only newly appended original NGen log bytes yield fixed error
# categories. No raw Microsoft log, command, assembly or vendor text leaves CI.
# Also query actual Service Control Manager running/stopped states of every
# fixed service on the same Win7 profile, before and after original signed
# MSI attempt. Service existence alone was not sufficient to explain hang.
# This updated main-only one-shot rerun specifically tests the state API.
# Same signed Microsoft x64 MSI+MSP and genuine CLR success gates as baseline.
# Do not fabricate, register or start any Windows service.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-msi-ngen-evidence-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-netfx48-ngen-msdtc-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-msi-ngen-service-diagnostic:
    name: Authenticate CLR4 and inspect original MSI NGen errors and MSDTC
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: '11.21'
      use_macos26_runner: true
      host_provenance_only: false
      try_48_payload_host: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_msi: true
      prepare_48_assembly_cache: true
