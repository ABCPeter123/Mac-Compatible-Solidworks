name: Original self-authored MSI deferred DLL trace vs Apple Silicon Wine

on:
  pull_request:
    paths:
      - '.github/workflows/msi-custom-action-type-control-ci.yml'
      - 'probes/msi_custom_action_type_control.wxs'
      - 'probes/msi_custom_action_fail.c'
      - 'scripts/msi_custom_action_type_control.py'
      - 'probes/msi_custom_action_table_probe.c'
      - 'probes/msi_action_spawn_probe.c'
      - 'scripts/msi_action_spawn_trial.py'
      - 'tests/test_msi_action_spawn_trial.py'
      - 'scripts/msi_custom_action_table_type.py'
      - 'tests/test_msi_custom_action_table_type.py'
      - 'scripts/netfx40_msi_custom_type.py'
      - 'tests/test_msi_custom_action_type_control.py'
      - 'docs/MSI_CUSTOM_ACTION_TRACE_CONTROL.md'
      - 'docs/MSI_CUSTOM_ACTION_TABLE_LOOKUP.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msi-reference:
    name: Build and execute original harmless deferred DLL MSI on Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bounded custom action reporting and private capture
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_msi_custom_action_type_control.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unsafe self-authored MSI differential' }
          python -m unittest discover -s tests -p 'test_msi_custom_action_table_type.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unsafe MSI Action Type lookup' }
          python -m unittest discover -s tests -p 'test_msi_action_spawn_trial.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unsafe Win32 process-start observer' }
      - name: Compile original x64 DLL, WiX 5 MSI, and exact hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/wix | Out-Null
          Set-Content -Path build/msi_custom_action_control.txt -Value 'SWCOMPAT_ORIGINAL_CUSTOM_ACTION_CONTROL' -NoNewline -Encoding ascii
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'MSVC locator absent' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC tools missing' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (!(Test-Path $vcvars)) { throw 'MSVC environment absent' }
          $lines = @('@echo off', ('call "' + $vcvars + '"'),
            'cl /nologo /W4 /O2 /LD /Fe:build\msi_custom_action_fail.dll probes\msi_custom_action_fail.c',
            'if errorlevel 1 exit /b %errorlevel%',
            'cl /nologo /W4 /O2 /MT /DUNICODE /D_UNICODE /Fe:build\msi_custom_action_table_probe.exe probes\msi_custom_action_table_probe.c',
            'if errorlevel 1 exit /b %errorlevel%',
            'cl /nologo /W4 /O2 /MT /DUNICODE /D_UNICODE /Fe:build\msi_action_spawn_probe.exe probes\msi_action_spawn_probe.c',
            'exit /b %errorlevel%')
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'build\compile-custom-control.cmd'), $lines, [System.Text.Encoding]::ASCII)
          & cmd.exe /d /c build\compile-custom-control.cmd
          if ($LASTEXITCODE -ne 0 -or !(Test-Path build/msi_custom_action_fail.dll) -or !(Test-Path build/msi_custom_action_table_probe.exe) -or !(Test-Path build/msi_action_spawn_probe.exe)) { throw 'Original harmless DLL / MSI table probe compile failed' }
          dotnet tool install wix --tool-path build/wix --version 5.0.1
          if ($LASTEXITCODE -ne 0) { throw 'WiX 5 setup failed' }
          & build/wix/wix.exe build probes/msi_custom_action_type_control.wxs -arch x64 -o build/swcompat_custom_action_type_control.msi
          if ($LASTEXITCODE -ne 0) { throw 'Self-authored MSI build failed' }
          (Get-FileHash -LiteralPath build/swcompat_custom_action_type_control.msi -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath build/msi-custom-control.sha256 -NoNewline -Encoding ascii
      - name: Verify deliberately failing original deferred action on native Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path build/swcompat_custom_action_type_control.msi).Path
          $marker = Join-Path $env:ProgramFiles 'SWCompatMsiCustomActionControl\msi_custom_action_control.txt'
          if (Test-Path $marker) { throw 'Preexisting control marker' }
          $smokeFile = Join-Path $env:TEMP 'swcompat-ca-table-win-smoke.status'
          $smoke = & build/msi_custom_action_table_probe.exe --selftest $smokeFile
          if ($LASTEXITCODE -ne 0 -or $smoke -notcontains 'SWCOMPAT_CA_TABLE_STATUS=SELFTEST_OK') {
            throw 'Native Windows MSI helper selftest did not reach process entry'
          }
          Remove-Item -LiteralPath $smokeFile -ErrorAction SilentlyContinue
          $spawnFile = Join-Path $env:TEMP 'swcompat-ca-spawn-win-smoke.status'
          $spawn = & build/msi_action_spawn_probe.exe (Resolve-Path build/msi_custom_action_table_probe.exe).Path $spawnFile
          if ($LASTEXITCODE -ne 0 -or $spawn -notcontains 'SWCOMPAT_SPAWN_STATUS=STARTED' -or $spawn -notcontains 'SWCOMPAT_SPAWN_CHILD_EXIT=ZERO') {
            throw 'Native Windows CreateProcessW MSI helper selftest failed'
          }
          Remove-Item -LiteralPath $spawnFile -ErrorAction SilentlyContinue
          $metadata = 'ServiceTypeControlSentinel' | & build/msi_custom_action_table_probe.exe $msi
          if ($LASTEXITCODE -ne 0 -or $metadata -notcontains 'SWCOMPAT_CA_TABLE_STATUS=ACTION_FOUND' -or $metadata -notcontains 'SWCOMPAT_CA_TABLE_TYPE=3073') {
            throw 'Windows read-only MSI CustomAction Type metadata mismatch'
          }
          $p = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart') -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 1603) { throw "Expected native Windows MSI 1603 from deliberate custom action, got $($p.ExitCode)" }
          if (Test-Path $marker) { throw 'Expected MSI rollback failed to remove marker' }
          Write-Output 'Self-authored native Windows deferred custom action 1603 and rollback verified'
      - uses: actions/upload-artifact@v4
        with:
          name: self-authored-deferred-custom-action-control
          path: |
            build/swcompat_custom_action_type_control.msi
            build/msi-custom-control.sha256
            build/msi_custom_action_table_probe.exe
            build/msi_action_spawn_probe.exe
          retention-days: 1

  apple-silicon-wine-control:
    name: Verify source-authored MSI custom action trace under Apple Silicon Wine
    needs: windows-msi-reference
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: self-authored-deferred-custom-action-control
          path: build
      - name: Download and verify identical Wine Staging 11.21
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/wine-staging-11.21-osx64.tar.xz"
          curl --fail --location --retry 3 --output "$ARCHIVE" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-staging-11.21-osx64.tar.xz"
          echo "d7bcd5abf4df27aae397a7898aef074fea4a2e0b51e0a55aa9659517bbf9d452  $ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/wine-build"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/wine-build"
          WINE_BIN="$(find "$RUNNER_TEMP/wine-build" -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN" && test -x "$WINE_BIN"
          echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
      - name: Initialize isolated marked Wine prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m swcompat --prefix "$RUNNER_TEMP/msi-custom-control-prefix" --logs-dir "$RUNNER_TEMP/msi-custom-control-logs" init
          touch "$RUNNER_TEMP/msi-custom-control-prefix/.swcompat-netfx481-disposable"
      - name: Verify Win32 MSI helper startup independently of MSI APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.msi_custom_action_table_type import inspect_selftest, validate as validate_table
          from scripts.msi_action_spawn_trial import inspect as inspect_spawn, validate as validate_spawn
          w = Path(os.environ["SWCOMPAT_WINE"])
          prefix = Path(os.environ["RUNNER_TEMP"]) / "msi-custom-control-prefix"
          helper = Path("build/msi_custom_action_table_probe.exe")
          selftest = inspect_selftest(w, prefix, helper)
          startup = inspect_spawn(w, prefix, Path("build/msi_action_spawn_probe.exe"), helper)
          assert validate_table(selftest) and validate_spawn(startup)
          print("Win32 MSI helper selftest:", selftest["status"])
          print("Win32 MSI helper selftest stage:", selftest["stage"])
          print("Win32 CreateProcessW startup:", startup["status"])
          print("Win32 CreateProcessW child exit:", startup["child_exit"])
          print("Win32 CreateProcessW failure class:", startup["error"])
          Path("build/msi-win32-startup-status.json").write_text(
              json.dumps({"selftest": selftest, "spawn": startup}, sort_keys=True),
              encoding="utf-8")
          assert selftest["status"] == "SELFTEST_OK"
          assert startup["status"] == "STARTED"
          assert startup["child_exit"] == "ZERO"
          PY
      - name: Inspect native Windows MSI CustomAction table metadata under Wine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.msi_custom_action_table_type import inspect, validate
          r = inspect(Path(os.environ["SWCOMPAT_WINE"]),
                      Path(os.environ["RUNNER_TEMP"]) / "msi-custom-control-prefix",
                      Path("build/msi_custom_action_table_probe.exe"),
                      Path("build/swcompat_custom_action_type_control.msi"))
          assert validate(r)
          print("MSI table probe status:", r["status"])
          print("MSI table probe stage:", r["stage"])
          Path("build/msi-custom-table-control.json").write_text(
              json.dumps(r, sort_keys=True), encoding="utf-8")
          assert r["status"] == "ACTION_FOUND"
          assert r["base_type"] == 1
          assert r["family"] == "DLL_BINARY"
          print("MSI table probe status:", r["status"])
          print("MSI table probe family:", r["family"])
          PY
      - name: Run original self-authored MSI and inspect strict Wine action type
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.msi_custom_action_type_control \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/msi-custom-control-prefix" \
            --msi build/swcompat_custom_action_type_control.msi \
            --sha256 build/msi-custom-control.sha256 \
            --output build/msi-custom-action-control.json \
            --timeout 120 --agree-disposable-prefix
      - name: Summarize source-authored MSI custom action metadata only
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.msi_custom_action_type_control import validate
          p = Path("build/msi-custom-action-control.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Original harmless deferred MSI custom action trace\n\n")
              if not p.is_file():
                  f.write("No verified result. Native Microsoft CLR NOT DEMONSTRATED.\n")
              else:
                  r = json.loads(p.read_text())
                  if not validate(r):
                      raise ValueError("Unsafe original MSI control report")
                  f.write(f"msi_process: **{r['msi_process']}**\n\n")
                  for field in ("status", "family", "base_type", "execution",
                                "impersonation", "asynchronous", "capture_reason"):
                      f.write(f"custom_action_{field}: **{r['custom_action_type'][field]}**\n\n")
                  table_report = Path("build/msi-custom-table-control.json")
                  if table_report.is_file():
                      m = json.loads(table_report.read_text())
                      from scripts.msi_custom_action_table_type import validate as validate_table
                      if not validate_table(m):
                          raise ValueError("Unsafe CustomAction table metadata result")
                      f.write(f"msi_table_status: **{m['status']}**\n\n")
                      f.write(f"msi_table_family: **{m['family']}**\n\n")
                      f.write(f"msi_table_stage: **{m['stage']}**\n\n")
                  f.write("native_microsoft_clr: **False**\n\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-authored-msi-action-type-status-only
          path: |
            build/msi-custom-action-control.json
            build/msi-custom-table-control.json
            build/msi-win32-startup-status.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require real self-authored MSI failure and Wine DLL type match
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.msi_custom_action_type_control import validate
          r = json.loads(Path("build/msi-custom-action-control.json").read_text())
          assert validate(r)
          assert r["status"] == "MEASURED"
          assert r["msi_process"] == "NONZERO"
          assert r["custom_action_type"]["status"] == "TRACE_MATCHED"
          assert r["custom_action_type"]["family"] == "DLL_BINARY"
          assert r["custom_action_type"]["base_type"] == 1
          assert r["custom_action_type"]["execution"] == "DEFERRED"
          assert r["native_microsoft_clr"] is False
          assert r["solidworks_compatibility"] == "NOT_DEMONSTRATED"
          PY
