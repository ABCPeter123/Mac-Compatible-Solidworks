name: Original MSI InstallServices without StartServices differential on Apple Silicon Wine

on:
  pull_request:
    paths:
      - '.github/workflows/msi-service-install-only-ci.yml'
      - 'probes/msi_service_install_only_probe.wxs'
      - 'probes/win_service_smoke.c'
      - 'scripts/msi_service_action_trial.py'
      - 'tests/test_msi_service_action_trial.py'
      - 'scripts/msi_service_registry_observation.py'
      - 'tests/test_msi_service_registry_observation.py'
      - 'scripts/msi_service_restart_refresh.py'
      - 'scripts/msi_service_scm_api_reconcile.py'
      - 'scripts/msi_service_scm_coherence.py'
      - 'scripts/msi_service_scm_session_hold.py'
      - 'tests/test_msi_service_scm_session_hold.py'
      - 'docs/MSI_SERVICE_SCM_SESSION_HOLD.md'
      - 'tests/test_msi_service_scm_coherence.py'
      - 'docs/MSI_SERVICE_SCM_COHERENCE.md'
      - 'tests/test_msi_service_scm_api_reconcile.py'
      - 'docs/MSI_SERVICE_SCM_API_DIFFERENTIAL.md'
      - 'tests/test_msi_service_restart_refresh.py'
      - 'docs/MSI_SERVICE_WINE_RESTART.md'
      - 'docs/MSI_SERVICE_REGISTRY_OBSERVATION.md'
      - 'docs/MSI_SERVICE_INSTALL_ONLY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-install:
    name: Build native original MSI service-install-only baseline
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict self-authored MSI proof requirements
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_msi_service_action_trial.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Original service MSI regression' }
          python -m unittest discover -s tests -p 'test_msi_service_registry_observation.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Service registry test failed' }
          python -m unittest discover -s tests -p 'test_msi_service_restart_refresh.py' -v
          python -m unittest discover -s tests -p 'test_msi_service_scm_api_reconcile.py' -v
          python -m unittest discover -s tests -p 'test_msi_service_scm_coherence.py' -v
          python -m unittest discover -s tests -p 'test_msi_service_scm_session_hold.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Unsafe MSI transaction test gate" }
      - name: Compile original x64 SCM service and MSI using MSVC and pinned WiX 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/wix | Out-Null
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'MSVC locator absent' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC toolchain missing' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (!(Test-Path $vcvars)) { throw 'MSVC environment missing' }
          $lines = @('@echo off', ('call "' + $vcvars + '"'),
            'cl /nologo /W4 /O2 /DUNICODE /D_UNICODE /Fe:build\service_smoke.exe probes\win_service_smoke.c advapi32.lib',
            'exit /b %errorlevel%')
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'build\compile-original-service.cmd'), $lines, [System.Text.Encoding]::ASCII)
          & cmd.exe /d /c build\compile-original-service.cmd
          if ($LASTEXITCODE -ne 0 -or !(Test-Path build/service_smoke.exe)) { throw 'MSVC service compile failed' }
          dotnet tool install wix --tool-path build/wix --version 5.0.1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned WiX install failed' }
          & build/wix/wix.exe build probes/msi_service_install_only_probe.wxs -arch x64 -o build/swcompat_msi_service_action.msi
          if ($LASTEXITCODE -ne 0) { throw 'Original service MSI build failed' }
          (Get-FileHash -LiteralPath build/swcompat_msi_service_action.msi -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath build/msi-service.sha256 -NoNewline -Encoding ascii
      - name: Require native MSI service start, exact service binary and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'SWCompatOriginalServiceTest'
          $binary = Join-Path $env:ProgramFiles 'SWCompatMsiServiceAction\service_smoke.exe'
          $msi = (Resolve-Path build/swcompat_msi_service_action.msi).Path
          if ((Get-Service -Name $name -ErrorAction SilentlyContinue) -or (Test-Path $binary)) { throw 'Preexisting original service' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart') -PassThru -Wait -NoNewWindow
          if ($install.ExitCode -ne 0) { throw 'Original MSI service install failed' }
          $svc = Get-Service -Name $name -ErrorAction Stop
          if ($svc.Status -ne 'Stopped' -or !(Test-Path $binary)) { throw 'MSI unexpectedly started demand service' }
          $before = [System.IO.File]::ReadAllBytes((Resolve-Path build/service_smoke.exe).Path)
          $after = [System.IO.File]::ReadAllBytes($binary)
          if ([Convert]::ToBase64String($before) -cne [Convert]::ToBase64String($after)) { throw 'Original MSI service executable bytes mismatch' }
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', ('"' + $msi + '"'), '/qn', '/norestart') -PassThru -Wait -NoNewWindow
          if ($uninstall.ExitCode -ne 0) { throw 'Original MSI service uninstall failed' }
          if ((Get-Service -Name $name -ErrorAction SilentlyContinue) -or (Test-Path $binary)) { throw 'MSI service removal failed' }
          Write-Output 'Native Windows original MSI service installed stopped/removed verified'
      - uses: actions/upload-artifact@v4
        with:
          name: self-authored-msi-service-private-transfer
          path: |
            build/swcompat_msi_service_action.msi
            build/msi-service.sha256
            build/service_smoke.exe
          retention-days: 1

  apple-silicon-msi:
    name: Test original MSI service registration without automatic start under Apple Silicon Wine
    runs-on: macos-15
    needs: windows-build-and-install
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: self-authored-msi-service-private-transfer
          path: build
      - name: Download identical hash-verified Wine 11.21
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/wine-devel-11.21-osx64.tar.xz"
          curl --fail --location --retry 3 --output "$ARCHIVE" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-devel-11.21-osx64.tar.xz"
          echo "9909b486657e10ab66c7279371ae1f990345b596b3b1b3a0cf21f28af24fa0ce  $ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/wine-build"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/wine-build"
          WINE_BIN="$(find "$RUNNER_TEMP/wine-build" -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN" && test -x "$WINE_BIN"
          echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
      - name: Initialize a brand-new explicitly marked Wine prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m swcompat --prefix "$RUNNER_TEMP/self-msi-prefix" --logs-dir "$RUNNER_TEMP/self-msi-logs" init
          touch "$RUNNER_TEMP/self-msi-prefix/.swcompat-netfx481-disposable"
      - name: Run original self-authored MSI transaction and verify file bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.msi_service_action_trial \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/self-msi-prefix" \
            --msi build/swcompat_msi_service_action.msi \
            --sha256 build/msi-service.sha256 \
            --exe build/service_smoke.exe \
            --output build/msi-service-action.json \
            --timeout 150 --agree-disposable-prefix
      - name: Read-only independent service registry query after original MSI installation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_msi_service_registry_observation.py' -v
          python3 -m scripts.msi_service_registry_observation \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/self-msi-prefix" \
            --prior build/msi-service-action.json \
            --output build/msi-service-registry-vs-scm.json \
            --agree-disposable-prefix
      - name: Retry service visibility only via a bounded disposable Wine restart
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_msi_service_restart_refresh.py' -v
          python3 -m scripts.msi_service_restart_refresh \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/self-msi-prefix" \
            --exe build/service_smoke.exe \
            --prior build/msi-service-registry-vs-scm.json \
            --output build/msi-service-restart.json \
            --agree-disposable-prefix
      - name: Test real CreateServiceW registration after original MSI registry-only service
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_msi_service_scm_api_reconcile.py' -v
          python3 -m scripts.msi_service_scm_api_reconcile \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/self-msi-prefix" \
            --exe build/service_smoke.exe \
            --prior build/msi-service-restart.json \
            --output build/msi-scm-api-reconcile.json \
            --agree-disposable-prefix
      - name: Test OpenServiceW/CreateServiceW on one retained SCM connection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_msi_service_scm_coherence.py' -v
          python3 -m scripts.msi_service_scm_coherence \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/self-msi-prefix" \
            --exe build/service_smoke.exe \
            --prior build/msi-scm-api-reconcile.json \
            --output build/msi-scm-coherence.json \
            --agree-disposable-prefix
      - name: Test independent service lookup while real SCM handle stays open
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_msi_service_scm_session_hold.py' -v
          python3 -m scripts.msi_service_scm_session_hold \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/self-msi-prefix" \
            --exe build/service_smoke.exe \
            --prior build/msi-scm-coherence.json \
            --output build/msi-scm-session-hold.json \
            --agree-disposable-prefix
      - name: Report independent cross-process SCM observation during handle hold
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.msi_service_scm_session_hold import validate
          path = Path("build/msi-scm-session-hold.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Cross-process original SCM service while handle retained\n\n")
              if not path.is_file():
                  f.write("No bounded handle-lifetime measurement.\n\n")
              else:
                  r = json.loads(path.read_text())
                  if not validate(r):
                      raise ValueError("Invalid SCM lifetime report")
                  for field in ("trial", "binary", "registry", "scm_before",
                                "diagnostic_before", "holder", "scm_while_held",
                                "diagnostic_while_held", "detail_before",
                                "detail_while_held", "scm_after",
                                "diagnostic_after", "detail_after", "outcome", "native_microsoft_clr"):
                      f.write(f"{field}: **{r[field]}**\n\n")
          PY
      - name: Report original MSI same-handle SCM coherence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.msi_service_scm_coherence import validate
          path = Path("build/msi-scm-coherence.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Original MSI single-connection SCM probe\n\n")
              if not path.is_file():
                  f.write("Original single-handle API test not measured.\n")
              else:
                  r = json.loads(path.read_text())
                  if not validate(r):
                      raise ValueError("Invalid original SCM coherence report")
                  for field in ("trial", "first_lookup", "create", "second_lookup",
                                "registry_after", "outcome", "native_microsoft_clr"):
                      f.write(f"{field}: **{r[field]}**\n\n")
          PY
      - name: Report finite SCM API registration and service start evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.msi_service_scm_api_reconcile import validate
          path = Path("build/msi-scm-api-reconcile.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## SCM API registration after original MSI service install\n\n")
              if not path.is_file():
                  f.write("Original API reconciliation not measured.\n")
              else:
                  r = json.loads(path.read_text())
                  if not validate(r):
                      raise ValueError("Unsafe SCM API reconciliation report")
                  for field in ("trial", "installed_binary", "scm_before",
                                "registry_before", "api_register", "scm_after_register",
                                "api_start", "scm_final", "registry_final",
                                "registration_visibility_recovered",
                                "service_running_verified", "native_microsoft_clr"):
                      f.write(f"{field}: **{r[field]}**\n\n")
          PY
      - name: Report finite pre/post-restart service visibility evidence
        shell: bash
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.msi_service_restart_refresh import validate
          path = Path("build/msi-service-restart.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Wine service registry to SCM visibility after isolated restart\n\n")
              if not path.is_file():
                  f.write("No verified service restart comparison.\n")
              else:
                  report = json.loads(path.read_text())
                  if not validate(report):
                      raise ValueError("Unsafe service restart report")
                  for field in ("trial", "restart", "registry_before", "scm_before",
                                "registry_after", "scm_after", "service_visibility_recovered",
                                "native_microsoft_clr"):
                      f.write(f"{field}: **{report[field]}**\n\n")
          PY
      - name: Report only fixed service registry and SCM comparison categories
        shell: bash
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.msi_service_registry_observation import validate
          path = Path("build/msi-service-registry-vs-scm.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Independent registry versus SCM service visibility\n\n")
              if not path.is_file():
                  f.write("Registry/SCM comparison not measured.\n")
              else:
                  data = json.loads(path.read_text())
                  if not validate(data):
                      raise ValueError("Invalid independent service registry status")
                  for field in ("service_registry", "independent_scm", "difference",
                                "installer_status", "file_status",
                                "native_dotnet_compatibility"):
                      f.write(f"{field}: **{data[field]}**\n\n")
          PY
      - name: Summarize only fixed self-authored MSI outcomes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.msi_service_action_trial import validate
          path = Path("build/msi-service-action.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Original MSI InstallServices without StartServices on Apple Silicon Wine\n\n")
              if not path.exists():
                  f.write("Experiment incomplete; MSI service-start outcome NOT VERIFIED.\n")
              else:
                  report = json.loads(path.read_text())
                  if not validate(report):
                      raise ValueError("Unsafe MSI transaction report")
                  for key in ("status", "winver", "service_before", "binary_before",
                              "msi_process", "binary_after", "service_after",
                              "msi_service_start_candidate", "dotnet_compatibility",
                              "solidworks_compatibility"):
                      f.write(f"{key}: **{report[key]}**\n\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-original-msi-service-status-only
          path: |
            build/msi-service-action.json
            build/msi-service-registry-vs-scm.json
            build/msi-service-restart.json
            build/msi-scm-api-reconcile.json
            build/msi-scm-coherence.json
            build/msi-scm-session-hold.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require actual bounded MSI attempt and prohibit false compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.msi_service_action_trial import validate
          report = json.loads(Path("build/msi-service-action.json").read_text())
          assert validate(report)
          from scripts.msi_service_registry_observation import validate as validate_registration
          other = json.loads(Path("build/msi-service-registry-vs-scm.json").read_text())
          assert validate_registration(other)
          assert other["installer_status"] == report["msi_process"]
          assert other["independent_scm"] == report["service_after"]
          assert other["file_status"] == report["binary_after"]
          from scripts.msi_service_restart_refresh import validate as validate_restart
          restart = json.loads(Path("build/msi-service-restart.json").read_text())
          assert validate_restart(restart)
          assert restart["trial"] == "MEASURED"
          assert restart["registry_before"] == "PRESENT"
          assert restart["scm_before"] == "ABSENT"
          assert restart["native_microsoft_clr"] is False
          from scripts.msi_service_scm_api_reconcile import validate as validate_api
          api = json.loads(Path("build/msi-scm-api-reconcile.json").read_text())
          assert validate_api(api)
          if restart["service_visibility_recovered"]:
              # Original MSI service is already independently visible after a
              # bounded Wine restart. A *repair* must not be attempted.
              assert restart["restart"] == "COMPLETED"
              assert restart["registry_after"] == "PRESENT"
              assert restart["scm_after"] in {"RUNNING", "STOPPED"}
              assert report["msi_process"] == "ZERO"
              assert report["binary_after"] == "PRESENT_MATCH"
              assert api["trial"] == "NOT_APPLICABLE"
          else:
              assert api["trial"] == "MEASURED"
          assert api["native_microsoft_clr"] is False
          assert api["solidworks_compatibility"] == "NOT_DEMONSTRATED"
          from scripts.msi_service_scm_coherence import validate as validate_coherence
          coherence = json.loads(Path("build/msi-scm-coherence.json").read_text())
          assert validate_coherence(coherence)
          assert coherence["trial"] in {"MEASURED", "NOT_APPLICABLE"}
          if restart["service_visibility_recovered"]:
              assert coherence["trial"] == "NOT_APPLICABLE"
          if (api["trial"] == "MEASURED"
              and api["installed_binary"] == "PRESENT_MATCH"
              and api["api_register"] in {"ALREADY_EXISTS", "CREATED"}
              and api["scm_after_register"] in {"ABSENT", "UNKNOWN"}
              and api["scm_final"] in {"ABSENT", "UNKNOWN"}
              and api["registry_final"] == "PRESENT"):
              assert coherence["trial"] == "MEASURED"
          assert coherence["native_microsoft_clr"] is False
          assert coherence["solidworks_compatibility"] == "NOT_DEMONSTRATED"
          from scripts.msi_service_scm_session_hold import validate as validate_hold
          hold = json.loads(Path("build/msi-scm-session-hold.json").read_text())
          assert validate_hold(hold)
          if restart["service_visibility_recovered"]:
              assert hold["trial"] == "NOT_APPLICABLE"
          if coherence["trial"] == "MEASURED" and coherence["registry_after"] == "PRESENT":
              assert hold["trial"] == "MEASURED"
          assert hold["native_microsoft_clr"] is False
          assert hold["solidworks_compatibility"] == "NOT_DEMONSTRATED"
          assert report["status"] == "MEASURED"
          assert report["service_before"] == "ABSENT"
          assert report["winver"] == "APPLIED"
          assert report["msi_process"] in {"ZERO", "NONZERO", "TIMEOUT"}
          assert report["dotnet_compatibility"] is False
          assert report["solidworks_compatibility"] == "NOT_DEMONSTRATED"
          PY
