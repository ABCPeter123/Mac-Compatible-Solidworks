name: One-shot macOS 15 original Microsoft CLR4 x86 WoW64 with 64 MiB host stack

# Exact x86 genuine Microsoft CLR4 and bounded native Wine tests as separate
# macOS 15 control for the pinned Wine 11.21 macOS 26 experiment.
# Never trigger original 4.8 MSI, MSP, 4.8.1 or SOLIDWORKS installation.
# Re-trigger with isolated runtime concurrency after previous host job was cancelled.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx40-wow64-hoststack64-macos15-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-clr4-wow64-macos15-hoststack64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-clr4-x86-macos15-stack64:
    name: Compare Windows-proven native and managed x86 Wine with macOS 15 Rosetta
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: '11.21'
      use_macos26_runner: false
      host_provenance_only: true
      try_wow64_managed: true
      try_wow64_faults: true
      wow64_host_stack64: true
      try_48_msi: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_payload_host: false
