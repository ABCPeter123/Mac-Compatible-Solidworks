            --installer build/dotNetFx40_Full_x86_x64.exe \
            --output build/netfx40-msxml3-original-table.json \
            --agree-disposable-prefix
      - name: Test authentic original .NET4 Core x64 MSI after baseline setup 1603
        if: env.SWCOMPAT_MSXML3_READY == 'yes' && inputs.try_40_core_msi_recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_original_core_msi_recovery \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --original build/dotNetFx40_Full_x86_x64.exe \
            --original-extract build/netfx40-msxml3-original-extract.json \
            --original-setup build/netfx40-msxml3-runtime.json \
