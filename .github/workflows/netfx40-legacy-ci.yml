name: Original Microsoft .NET 4.0 CLR on Wine Staging A/B

# Original Microsoft installer experiments require explicit workflow_dispatch.
# A separately gated, main-only one-shot reusable caller may select the
# host-provenance-only mode. It cannot request any .NET 4.8 installation.
# All pull requests use compatibility-ci.yml for non-proprietary regressions.
# Use exactly one optional 4.8 intermediate; do not rerun both paths.
on:
  workflow_call:
    inputs:
      try_48_intermediate:
        description: 'Optional .NET 4.8 intermediate; disabled in one-shot caller'
        type: boolean
        required: false
        default: false
      try_48_direct:
        description: 'Optional original .NET 4.8 direct; disabled in one-shot caller'
        type: boolean
        required: false
        default: false
      try_48_msi:
        description: 'Original signed .NET 4.8 MSI+MSP control after authentic 4.0'
        type: boolean
        required: false
        default: false
      signed_msi_timeout_seconds:
        description: 'Allowlisted genuine signed MSI NGen experiment timeout (seconds)'
        type: number
        required: false
        default: 420
      prepare_48_assembly_cache:
        description: 'Only for signed x64 MSI, opt-in create missing Windows assembly cache in isolated prefix'
        type: boolean
        required: false
        default: false
      original_48_profile:
        description: 'Original signed 4.8 setup reported Windows profile; Win10 is distinct experiment'
        type: string
        required: false
        default: win7
      original_48_setup_args:
        description: 'Use logged setup or exact upstream Winetricks/Bottles flags'
        type: string
        required: false
        default: logged
      host_provenance_only:
        description: 'Authenticate genuine .NET 4.0 host; skip 4.8/4.8.1 installers'
        type: boolean
        required: false
        default: false
      try_48_payload_host:
        description: 'Test signed original 4.8 runtime payload in disposable native 4.0 prefix; no installer'
        type: boolean
        required: false
        default: false
      use_macos26_runner:
        description: 'Select macOS 26 Apple Silicon runner; default remains macOS 15'
        type: boolean
        required: false
        default: false
      reuse_verified_native40:
        description: 'Experimental: record genuine Microsoft CLR4.0 only after checking Winetricks required 32-bit ngen PE'
        type: boolean
        required: false
        default: false
      settle_wineserver:
        description: 'Opt-in stop lingering Wine server and clients in disposable prefix before dotnet48'
        type: boolean
        required: false
        default: false
      wine_baseline:
        description: 'Only authenticated SHA256-pinned Wine Staging baseline releases'
        type: string
        required: false
        default: '11.21'
  workflow_dispatch:
    inputs:
      try_48_intermediate:
        description: 'Try verified native .NET 4.8 after 4.0 before attempting 4.8.1'
        type: boolean
        required: false
        default: false
      try_48_direct:
        description: 'Opt-in original signed Microsoft 4.8 offline upgrade after real 4.0, before 4.8.1'
        type: boolean
        required: false
        default: false
      try_48_msi:
        description: 'Test extracted original signed 4.8 x64 MSI and MSP after native 4.0'
        type: boolean
        required: false
        default: false
      signed_msi_timeout_seconds:
        description: 'Original signed .NET 4.8 x64 MSI timeout (seconds)'
        type: choice
        required: false
        default: '420'
        options: ['420', '1200']
      original_48_profile:
        description: 'Original 4.8 profile for distinct Win7/Win10 compatibility trial'
        type: choice
        required: false
        default: win7
        options: [win7, win10]
      original_48_setup_args:
        description: 'Original signed 4.8 launch arguments'
        type: choice
        required: false
        default: logged
        options: [logged, winetricks]
      host_provenance_only:
        description: 'Authenticate Microsoft .NET 4.0 CLR hosting after msxml3; skip 4.8 and 4.8.1 installers'
        type: boolean
        required: false
        default: false
      try_48_payload_host:
        description: 'Reversibly stage original signed 4.8 CLR payload in proven native 4.0 Wine; no 4.8 setup'
        type: boolean
        required: false
        default: false

      use_macos26_runner:
        description: 'Select macOS 26 Apple Silicon runner; default remains macOS 15'
        type: boolean
        required: false
        default: false
      reuse_verified_native40:
        description: 'Avoid duplicate original 4.0 Winetricks install only if independently verified'
        type: boolean
        required: false
        default: false
      settle_wineserver:
        description: 'Test clearing Wine clients blocking Winetricks wineserver -w'
        type: boolean
        required: false
        default: false
      wine_baseline:
        description: 'Select hash-pinned Wine Staging environment'
        type: choice
        required: false
        default: '11.21'
        options: ['11.21', '11.10']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  absolute-path-regressions:
    name: Verify .NET 4.0 native CLR false-positive regressions on POSIX
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run absolute media and fixture path regression tests
        run: |
          python -m unittest discover -s tests -p 'test_netfx40_legacy.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_launcher_timeout.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msxml3_prerequisite.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msxml3_restart.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_native_mscoree_provenance.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_host_api_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_core_host_trial.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_start_trace.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_to_481_upgrade.py' -v
          python -m unittest discover -s tests -p 'test_netfx481_prereq_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_netfx4x_authenticated_media_fetch.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msi_evidence.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msi_inventory.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_offline_extract.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_windows_extract_reference.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_original_msi_table.py' -v
          python -m unittest discover -s tests -p 'test_msi_original_binary_imports.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_wine_msi_errors.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msi_custom_type.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msi_logging_policy.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_direct_workflow_shell.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_registry_preflight.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_scm_service_probe.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_blockif_trace.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_to_48_direct.py' -v

  authentic-netfx40-windows:
    name: Authenticate original Microsoft .NET 4.0 and compile CLR probes
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safety gate and strict no-leak reporting
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_netfx40_legacy.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Original Microsoft 4.0 safety tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_launcher_timeout.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Original .NET 4.0 Win32 setup wait regression failed" }
          python -m unittest discover -s tests -p 'test_netfx40_msxml3_prerequisite.py' -v
          if ($LASTEXITCODE -ne 0) { throw "msxml3 workaround tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_msxml3_restart.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_to_481_upgrade.py' -v
          python -m unittest discover -s tests -p 'test_netfx481_prereq_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_netfx4x_authenticated_media_fetch.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Post-setup CLR restart persistence safety regression failed" }
          if ($LASTEXITCODE -ne 0) { throw "Original Microsoft .NET in-place upgrade safety regression failed" }
          python -m unittest discover -s tests -p 'test_netfx40_msi_evidence.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Nested MSI privacy and failure-action tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_msi_inventory.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Retained MSI candidate census privacy test failed" }
          python -m unittest discover -s tests -p 'test_netfx40_offline_extract.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Original .NET offline extraction privacy and fixture tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_windows_extract_reference.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Native Windows /x reference privacy and fixture tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_original_msi_table.py' -v
          python -m unittest discover -s tests -p 'test_msi_original_binary_imports.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Private original MSI action lookup tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_wine_msi_errors.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Wine MSI error evidence regression failed" }
          python -m unittest discover -s tests -p 'test_netfx40_msi_logging_policy.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Opt-in MSI policy safety regression failed" }

      - name: Compile independent native CLR and managed execution probes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "MSVC locator missing" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "MSVC tools missing" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) { throw "MSVC x64 environment missing" }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /Fe:build\netfx481_clr_load.exe probes\netfx481_clr_load.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-netfx40-loader.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-netfx40-loader.cmd
          if ($LASTEXITCODE -ne 0) { throw "CLR loader compilation failed" }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /DSWCOMPAT_NETFX40 /Fe:build\netfx40_win32_launch.exe probes\netfx481_win32_launch.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-netfx40-launcher.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-netfx40-launcher.cmd
          if ($LASTEXITCODE -ne 0) { throw "Exact 4.8 Win32 launcher compilation failed" }
          $selftest = & build\netfx40_win32_launch.exe --selftest-3010
          if ($LASTEXITCODE -ne 0 -or $selftest -notcontains 'SWCOMPAT_WIN32_SETUP_EXIT_HEX=00000BC2') {
            throw "Exact 4.8 Windows process exit selftest failed"
          }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /DUNICODE /D_UNICODE /Fe:build\netfx481_win32_launch.exe probes\netfx481_win32_launch.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-upgrade-481-launcher.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-upgrade-481-launcher.cmd
          if ($LASTEXITCODE -ne 0) { throw "Original .NET 4.8.1 upgrade launcher compilation failed" }
          $selftest481 = & build\netfx481_win32_launch.exe --selftest-3010
          if ($LASTEXITCODE -ne 0 -or $selftest481 -notcontains 'SWCOMPAT_WIN32_SETUP_EXIT_HEX=00000BC2') {
            throw "Original .NET 4.8.1 upgrade launch reference failed"
          }
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "Microsoft C# compiler missing" }
          & $csc /nologo /target:exe /reference:System.Core.dll /reference:System.Xml.dll /out:build\netfx481_runtime_probe.exe probes\netfx481_runtime_probe.cs
          if ($LASTEXITCODE -ne 0) { throw "C# fixture compilation failed" }
          & $csc /nologo /target:library /reference:System.Core.dll /reference:System.Xml.dll /out:build\netfx48_managed_host_check.dll probes\netfx48_managed_host_check.cs
          if ($LASTEXITCODE -ne 0) { throw "Native CLR hosting managed library compilation failed" }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /GS- /Zl /Fe:build\netfx48_host_activation.exe probes\netfx48_host_activation.c /link /NODEFAULTLIB kernel32.lib /ENTRY:host_entry /SUBSYSTEM:CONSOLE`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-netfx40-host.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-netfx40-host.cmd
          if ($LASTEXITCODE -ne 0) { throw "Native CLR hosting fixture compilation failed" }
          # Prove this exact fixture works against installed genuine Microsoft
          # .NET on native Windows before interpreting any Wine result.
          $env:SWCOMPAT_MANAGED_DLL = (Resolve-Path 'build/netfx48_managed_host_check.dll').Path
          try {
            $env:SWCOMPAT_CLR_PATH = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\clr.dll'
            if (!(Test-Path -LiteralPath $env:SWCOMPAT_CLR_PATH -PathType Leaf)) {
              throw "Official Windows CLR baseline unavailable"
            }
            $positive = & build\netfx48_host_activation.exe
            if ($LASTEXITCODE -ne 0 -or $positive -notcontains 'SWCOMPAT_NETFX48_HOST_STATUS=MANAGED_ORIGINAL_PASS') {
              throw "Official Windows public CLR hosting positive control failed"
            }
            # Positive native-Windows control for Microsoft's documented
            # process-only CLR activation logging. Never emit log contents,
            # runtime paths, vendor files or arbitrary file names.
            $activationDir = Join-Path $env:RUNNER_TEMP 'swcompat-clr-activation-native-control'
            if (Test-Path -LiteralPath $activationDir) { throw 'Unsafe preexisting activation folder' }
            New-Item -ItemType Directory -Path $activationDir | Out-Null
            try {
              $env:COMPLUS_CLRLoadLogDir = $activationDir
              $activation = & build\netfx48_host_activation.exe
              if ($LASTEXITCODE -ne 0 -or $activation -notcontains 'SWCOMPAT_NETFX48_HOST_STATUS=MANAGED_ORIGINAL_PASS') {
                throw 'Native Windows activation log control host failed'
              }
              $captured = @(Get-ChildItem -LiteralPath $activationDir -File -Force).Count
              Write-Output ('WINDOWS_NATIVE_CLR_ACTIVATION_LOG ' +
                $(if ($captured -gt 0) { 'EMITTED' } else { 'NOT_EMITTED' }))
            }
            finally {
              Remove-Item env:COMPLUS_CLRLoadLogDir -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $activationDir -Force -Recurse -ErrorAction SilentlyContinue
            }
            $env:SWCOMPAT_CLR_PATH = Join-Path $env:WINDIR 'System32\kernel32.dll'
            $negative = & build\netfx48_host_activation.exe
            if ($LASTEXITCODE -ne 0 -or $negative -notcontains 'SWCOMPAT_NETFX48_HOST_STATUS=OTHER_RUNTIME_SELECTED') {
              throw "Public CLR host rejected-runtime negative control failed"
            }
            'AUTHENTIC_NETFX40_HOST_FIXTURE_WINDOWS_CONTROL POSITIVE_PASS WRONG_RUNTIME_REJECTED'
          }
          finally {
            Remove-Item env:SWCOMPAT_CLR_PATH -ErrorAction SilentlyContinue
            Remove-Item env:SWCOMPAT_MANAGED_DLL -ErrorAction SilentlyContinue
          }
          $loader = & build\netfx481_clr_load.exe
          if ($LASTEXITCODE -ne 0 -or $loader -notcontains 'SWCOMPAT_CLR_LOAD_STATUS=LOADED') {
            throw "Windows native CLR baseline failed"
          }
          & build\netfx481_runtime_probe.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows managed baseline failed" }
      - name: Compile read-only .NET 4.8.1 disk-space prerequisite API probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "MSVC x64 tools unavailable" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $lines = @('@echo off', ('call "' + $vcvars + '"'),
            'cl /nologo /W4 /O2 /Fe:build\netfx481_disk_space_gate.exe probes\netfx481_disk_space_gate.c',
            'exit /b %errorlevel%')
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'build\compile-481-disk.cmd'), $lines, [System.Text.Encoding]::ASCII)
          & cmd.exe /d /c build\compile-481-disk.cmd
          if ($LASTEXITCODE -ne 0) { throw "Original 4.8.1 disk API reference compilation failed" }
          $lines = @(& build\netfx481_disk_space_gate.exe)
          if ($LASTEXITCODE -ne 0 -or $lines -notcontains 'SWCOMPAT_DISK_SCHEMA=1') {
            throw "Original 4.8.1 disk API reference failed"
          }
      - name: Compile read-only original MSI CustomAction table inspector
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "MSVC tools missing for MSI inspector" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /MT /DUNICODE /D_UNICODE /Fe:build\msi_custom_action_table_probe.exe probes\msi_custom_action_table_probe.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-original-msi-table.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-original-msi-table.cmd
          if ($LASTEXITCODE -ne 0) { throw "Original read-only MSI inspector compilation failed" }
          $smokeFile = Join-Path $env:TEMP 'swcompat-netfx40-table-selftest.status'
          try {
            $smoke = & build/msi_custom_action_table_probe.exe --selftest $smokeFile
            if ($LASTEXITCODE -ne 0 -or $smoke -notcontains 'SWCOMPAT_CA_TABLE_STATUS=SELFTEST_OK') { throw "Original MSI inspector baseline failed" }
          } finally {
            Remove-Item -LiteralPath $smokeFile -ErrorAction SilentlyContinue
          }
      - name: Compile read-only original MSI Binary PE import census
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "MSVC compiler missing for Binary import analysis" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $lines = @('@echo off', ('call "' + $vcvars + '"'),
            'cl /nologo /W4 /O2 /MT /DUNICODE /D_UNICODE /Fe:build\msi_original_binary_imports.exe probes\msi_original_binary_imports.c',
            'exit /b %errorlevel%')
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'build\compile-original-binary.cmd'), $lines, [System.Text.Encoding]::ASCII)
          & cmd.exe /d /c build\compile-original-binary.cmd
          if ($LASTEXITCODE -ne 0 -or !(Test-Path build/msi_original_binary_imports.exe)) { throw "Private original Binary probe compilation failed" }
      - name: Download official Microsoft .NET 4.0 offline installer and validate original Authenticode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.microsoft.com/download/9/5/A/95A9616B-7A37-4AF6-BC36-D6EA96C8DAAE/dotNetFx40_Full_x86_x64.exe"
          $exe = Join-Path (Resolve-Path build) "dotNetFx40_Full_x86_x64.exe"
          curl.exe --fail --location --retry 3 --max-time 600 --output $exe $url
          if ($LASTEXITCODE -ne 0) { throw "Official .NET 4.0 offline download failed" }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 15728640 -or $item.Length -gt 262144000) { throw "Unexpected original installer size" }
          $expected = "65e064258f2e418816b304f646ff9e87af101e4c9552ab064bb74d281c38659f"
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Microsoft original .NET 4.0 SHA256 differs from pinned Winetricks recipe" }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid) { throw "Microsoft installer Authenticode invalid" }
          if ($null -eq $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch '(^|, )O=Microsoft Corporation(,|$)') {
            throw "Original .NET 4.0 redistributable not Microsoft-signed"
          }
          (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath build/netfx40.sha256 -NoNewline -Encoding ascii
          Write-Output "Original .NET Framework 4.0 signed by Microsoft and digest bound"
      - name: Download and authenticate original Microsoft .NET Framework 4.8.1 upgrade media
        if: '!inputs.host_provenance_only'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.microsoft.com/download/4/b/2/cd00d4ed-ebdd-49ee-8a33-eabc3d1030e3/NDP481-x86-x64-AllOS-ENU.exe"
          $exe = Join-Path (Resolve-Path build) "NDP481-x86-x64-AllOS-ENU.exe"
          curl.exe --fail --location --retry 3 --max-time 600 --output $exe $url
          if ($LASTEXITCODE -ne 0) { throw "Authentic Microsoft .NET 4.8.1 upgrade media unavailable" }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 15728640 -or $item.Length -gt 262144000) { throw "Unexpected .NET 4.8.1 media size" }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid) { throw "Original .NET 4.8.1 signature invalid" }
          if ($null -eq $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch '(^|, )O=Microsoft Corporation(,|$)') {
            throw "Original .NET 4.8.1 upgrade media not Microsoft-signed"
          }
          (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath build/netfx481.sha256 -NoNewline -Encoding ascii
          Write-Output "Verified signed official .NET 4.8.1 in-place upgrade package"
      - name: Download and authenticate original signed Microsoft .NET Framework 4.8 intermediate
        if: ((inputs.try_48_direct || inputs.try_48_msi) && !inputs.host_provenance_only) || inputs.try_48_payload_host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.microsoft.com/download/f/3/a/f3a6af84-da23-40a5-8d1c-49cc10c8e76f/NDP48-x86-x64-AllOS-ENU.exe"
          $exe = Join-Path (Resolve-Path build) "NDP48-x86-x64-AllOS-ENU.exe"
          curl.exe --fail --location --retry 3 --max-time 600 --output $exe $url
          if ($LASTEXITCODE -ne 0) { throw "Official Microsoft .NET 4.8 offline media unavailable" }
          $length = (Get-Item -LiteralPath $exe).Length
          if ($length -lt 15728640 -or $length -gt 262144000) { throw "Unexpected original 4.8 media size" }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $null -eq $sig.SignerCertificate -or
              $sig.SignerCertificate.Subject -notmatch '(^|, )O=Microsoft Corporation(,|$)') {
            throw "Original Microsoft 4.8 publisher authentication failed"
          }
          (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath build/netfx48.sha256 -NoNewline -Encoding ascii
          Write-Output "Original signed Microsoft .NET 4.8 authenticated, checksum staged privately"
      - name: Compile distinct 4.8 original Windows process monitor
        if: (inputs.try_48_direct || inputs.try_48_msi) && !inputs.host_provenance_only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "MSVC required for original 4.8 Win32 launcher" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $lines = @('@echo off', ('call "' + $vcvars + '"'),
            'cl /nologo /W4 /O2 /DUNICODE /D_UNICODE /DSWCOMPAT_NETFX48 /Fe:build\netfx48_win32_launch.exe probes\netfx481_win32_launch.c',
            'exit /b %errorlevel%')
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'build\compile-original-48.cmd'), $lines, [System.Text.Encoding]::ASCII)
          & cmd.exe /d /c build\compile-original-48.cmd
          if ($LASTEXITCODE -ne 0) { throw "Original .NET 4.8 launcher build failed" }
          $selftest = & build\netfx48_win32_launch.exe --selftest-3010
          if ($LASTEXITCODE -ne 0 -or $selftest -notcontains 'SWCOMPAT_WIN32_SETUP_EXIT_HEX=00000BC2') {
            throw "Original .NET 4.8 launcher 3010 selftest failed"
          }
          # Native OpenSCManagerW/OpenServiceW avoids ambiguous sc.exe strings.
          # Read-only: never create, start, stop or configure a service.
          $lines = @('@echo off', ('call "' + $vcvars + '"'),
            'cl /nologo /W4 /O2 /Fe:build\netfx48_scm_service_probe.exe probes\netfx48_scm_service_probe.c advapi32.lib',
            'exit /b %errorlevel%')
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'build\compile-original-scm.cmd'), $lines, [System.Text.Encoding]::ASCII)
          & cmd.exe /d /c build\compile-original-scm.cmd
          if ($LASTEXITCODE -ne 0) { throw "Native SCM API probe compilation failed" }
          $startupControl = & build\netfx48_scm_service_probe.exe --selftest
          if ($LASTEXITCODE -ne 0 -or
              $startupControl -notcontains 'SWCOMPAT_SCM_FIXTURE_SELFTEST=PASS') {
            throw "Native SCM fixture startup selftest failed"
          }
          $serviceControl = & build\netfx48_scm_service_probe.exe
          if ($LASTEXITCODE -ne 0 -or
              $serviceControl -notcontains 'SWCOMPAT_SCM_API_STATUS=COMPLETE' -or
              $serviceControl -notcontains 'SWCOMPAT_SCM_API_TRUSTEDINSTALLER=PRESENT') {
            throw "Native Windows TrustedInstaller positive control failed"
          }
      - name: Check authenticated Microsoft /x extraction on native Windows without installing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m scripts.netfx40_windows_extract_reference --installer build/dotNetFx40_Full_x86_x64.exe
          if ($LASTEXITCODE -ne 0) { throw "Original .NET 4.0 native Windows extraction control failed" }
      # NEVER include original Microsoft .NET installers in GitHub Actions
      # artifacts. These are downloadable from public-repo runs even when the
      # artifact name contains "private". Transfer only signed SHA256 digests
      # and self-authored diagnostic executables; each Mac runner fetches
      # originals again from Microsoft's fixed URL and verifies byte equality.
      - uses: actions/upload-artifact@v4
        with:
          name: self-authored-netfx40-probes-and-signed-digests
          path: |
            build/netfx40.sha256
            build/netfx481.sha256
            build/netfx48.sha256
            build/netfx48_win32_launch.exe
            build/netfx48_scm_service_probe.exe
            build/netfx481_runtime_probe.exe
            build/netfx481_clr_load.exe
            build/netfx40_win32_launch.exe
            build/netfx481_win32_launch.exe
            build/netfx481_disk_space_gate.exe
            build/netfx48_host_activation.exe
            build/netfx48_managed_host_check.dll
            build/msi_custom_action_table_probe.exe
            build/msi_original_binary_imports.exe
          compression-level: 0
          retention-days: 1

  apple-silicon-native-baseline:
    if: github.event_name == 'workflow_dispatch' && !inputs.host_provenance_only
    name: Check genuine Microsoft .NET 4.0 on Apple Silicon Wine Staging 11.21
    needs: [authentic-netfx40-windows, absolute-path-regressions]
    runs-on: ${{ inputs.use_macos26_runner && 'macos-26' || 'macos-15' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: self-authored-netfx40-probes-and-signed-digests
          path: build
      - name: Fetch original .NET 4.0 privately and independently verify Windows signed digest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx4x_authenticated_media_fetch --version 40
      - name: Download and hash-check fixed Apple Silicon Wine 11.21 build
        shell: bash
        run: |
          set -euo pipefail
          # A/B against Wine Development 11.21 on main. The exact
          # Staging 11.21 archive is already checksum-pinned in SCM CI.
          ARCHIVE="$RUNNER_TEMP/wine-staging-11.21-osx64.tar.xz"
          curl --fail --location --retry 3 --output "$ARCHIVE" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-staging-11.21-osx64.tar.xz"
          echo "d7bcd5abf4df27aae397a7898aef074fea4a2e0b51e0a55aa9659517bbf9d452  $ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/wine-build"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/wine-build"
          WINE_BIN="$(find "$RUNNER_TEMP/wine-build" -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN" && test -x "$WINE_BIN"
          echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
      - name: Initialize original Microsoft runtime experiment in a new disposable prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m swcompat --prefix "$RUNNER_TEMP/netfx40-prefix" --logs-dir "$RUNNER_TEMP/netfx40-logs" init
          touch "$RUNNER_TEMP/netfx40-prefix/.swcompat-netfx481-disposable"
      - name: Install only original signed .NET 4.0 and independently check native CLR
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_legacy \
            --wine "$SWCOMPAT_WINE" --prefix "$RUNNER_TEMP/netfx40-prefix" \
            --installer build/dotNetFx40_Full_x86_x64.exe \
            --managed build/netfx481_runtime_probe.exe \
            --loader build/netfx481_clr_load.exe \
            --launcher build/netfx40_win32_launch.exe \
            --output build/netfx40-baseline.json \
            --timeout 210 --agree-disposable-prefix \
            --experiment-enable-verbose-msi \
            --experiment-restart-after-mono \
            --experiment-trace-custom-action-type \
            --experiment-inventory-retained-msi \
            --experiment-private-original-action
      - name: Attempt original signed Microsoft /x offline extraction without installing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_offline_extract \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-prefix" \
            --installer build/dotNetFx40_Full_x86_x64.exe \
            --output build/netfx40-original-extract.json \
            --timeout 120 --agree-disposable-prefix
      - name: Privately correlate first genuine failed action to extracted MSI Type
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_original_msi_table \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-prefix" \
            --helper build/msi_custom_action_table_probe.exe \
            --binary-helper build/msi_original_binary_imports.exe \
            --installer build/dotNetFx40_Full_x86_x64.exe \
            --output build/netfx40-original-table.json \
            --agree-disposable-prefix
      - name: Publish only bounded .NET 4.0 status categories
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx40_legacy import validate
          p = Path("build/netfx40-baseline.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Genuine Microsoft .NET 4.0 with legacy WinXP setup\n\n")
              if not p.is_file():
                  f.write("Experiment incomplete. Native CLR NOT VERIFIED.\n")
              else:
                  r = json.loads(p.read_text())
                  if not validate(r):
                      raise ValueError("Unsafe original .NET 4.0 report")
                  for field in ("status", "winver", "registry64", "registry32", "mono",
                                "selftest", "installer_status", "installer_exit",
                                "installer_child_seen", "installer_child_lifecycle",
                                "installer_child_exit", "pre_setup_scm_restart", "reboot",
                                "clr64_before", "clr64_after", "clr32_after",
                                "mscorlib64_after", "native_loader", "runtime_family",
                                "managed_functionality", "candidate_native40",
                                "netfx481_ready", "solidworks_compatibility"):
                      f.write(f"{field}: **{r[field]}**\n\n")
                  for field in ("status", "classes", "msi_error_lines",
                                "first_failed_action", "service_action_failures",
                                "nonstandard_name_hint",
                                "first_failed_script_phase",
                                "first_install_failed_action",
                                "install_script_failures",
                                "rollback_script_failures"):
                      f.write(f"wine_msi_{field}: **{r['wine_msi_errors'][field]}**\n\n")
                  for field in ("status", "family", "base_type", "execution",
                                "impersonation", "asynchronous", "ts_aware",
                                "capture_reason"):
                      f.write(f"custom_action_{field}: **{r['custom_action_type'][field]}**\n\n")
                  for field in ("activation", "restoration"):
                      f.write(f"msi_logging_{field}: **{r['msi_logging_policy'][field]}**\n\n")
                  for field in ("status", "msi_candidates", "netfx_named_candidates",
                                "directories_checked", "file_entries_checked"):
                      f.write(f"retained_msi_{field}: **{r['msi_inventory'][field]}**\n\n")
                  original_table = Path("build/netfx40-original-table.json")
                  if original_table.is_file():
                      from scripts.netfx40_original_msi_table import validate as validate_table
                      table = json.loads(original_table.read_text())
                      if not validate_table(table):
                          raise ValueError("Unsafe original MSI Type result")
                      for field in ("status", "msis_queried", "action_matches", "family", "base_type",
                                    "execution", "impersonation", "asynchronous", "ts_aware"):
                          f.write(f"original_msi_table_{field}: **{table[field]}**\n\n")
                  binary = table["binary_imports"]
                  from scripts.msi_original_binary_imports import validate as validate_binary
                  assert validate_binary(binary)
                  for field in ("status", "machine"):
                      f.write(f"original_action_binary_{field}: **{binary[field]}**\n\n")
                  for family, count in binary["imports"].items():
                      f.write(f"original_action_import_{family}: **{count}**\n\n")
                  for family, count in binary["api_imports"].items():
                      f.write(f"original_action_api_{family}: **{count}**\n\n")
                  original_extract = Path("build/netfx40-original-extract.json")
                  if original_extract.is_file():
                      from scripts.netfx40_offline_extract import validate as validate_extract
                      extract = json.loads(original_extract.read_text())
                      if not validate_extract(extract):
                          raise ValueError("Unsafe original offline extraction report")
                      for field in ("status", "process", "msi_entries",
                                    "ole_msi_candidates", "core_x64_ole_candidate",
                                    "directories_scanned", "file_entries_scanned"):
                          f.write(f"offline_extract_{field}: **{extract[field]}**\n\n")
                  for field in ("status", "files_scanned", "msi_files",
                                "primary_source", "msi_result",
                                "first_failed_action_class", "errors", "causality"):
                      f.write(f"nested_msi_{field}: **{r['inner_msi'][field]}**\n\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netfx40-apple-silicon-privacy-safe-result
          path: |
            build/netfx40-baseline.json
            build/netfx40-original-extract.json
            build/netfx40-original-table.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require genuine original Microsoft setup execution and independent CLR test
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.netfx40_legacy import validate
          r = json.loads(Path("build/netfx40-baseline.json").read_text())
          assert validate(r)
          assert r["status"] == "MEASURED"
          assert r["selftest"] == "PASS"
          assert r["pre_setup_scm_restart"] == "COMPLETED"
          assert r["installer_status"] == "EXIT_CAPTURED"
          from scripts.netfx40_msi_evidence import validate as validate_msi
          assert validate_msi(r["inner_msi"])
          from scripts.netfx40_msi_inventory import validate as validate_inventory
          assert validate_inventory(r["msi_inventory"])
          assert r["msi_inventory"]["status"] != "NOT_REQUESTED"
          from scripts.netfx40_wine_msi_errors import validate as validate_wine_msi
          assert validate_wine_msi(r["wine_msi_errors"])
          from scripts.netfx40_msi_custom_type import validate as validate_custom_type
          assert validate_custom_type(r["custom_action_type"])
          assert r["custom_action_type"]["status"] != "NOT_REQUESTED"
          from scripts.netfx40_msi_logging_policy import validate as validate_policy
          assert validate_policy(r["msi_logging_policy"])
          assert r["msi_logging_policy"] == {"activation": "APPLIED", "restoration": "REMOVED"}
          from scripts.netfx40_offline_extract import validate as validate_offline_extract
          extracted = json.loads(Path("build/netfx40-original-extract.json").read_text())
          assert validate_offline_extract(extracted)
          assert extracted["process"] in {"ZERO", "NONZERO", "TIMEOUT", "START_FAILED"}
          from scripts.netfx40_original_msi_table import validate as validate_original_table
          original_table = json.loads(Path("build/netfx40-original-table.json").read_text())
          assert validate_original_table(original_table)
          assert r["netfx481_ready"] is False
          assert r["solidworks_compatibility"] == "NOT_DEMONSTRATED"
          PY

  apple-silicon-msxml3-fix:
    name: Try genuine .NET 4.0 after msxml3 in a fresh Apple Silicon Wine prefix
    needs: [authentic-netfx40-windows, absolute-path-regressions]
    runs-on: ${{ inputs.use_macos26_runner && 'macos-26' || 'macos-15' }}
    timeout-minutes: ${{ inputs.try_48_msi && inputs.signed_msi_timeout_seconds == 1200 && 55 || 35 }}
    env:
      SWCOMPAT_TRY_48_INTERMEDIATE: ${{ inputs.try_48_intermediate }}
      SWCOMPAT_TRY_48_DIRECT: ${{ inputs.try_48_direct }}
      SWCOMPAT_TRY_48_MSI: ${{ inputs.try_48_msi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: self-authored-netfx40-probes-and-signed-digests
          path: build
      - name: Reject payload-only mode outside native 4.0 host-only trial
        if: inputs.try_48_payload_host && (!inputs.host_provenance_only || inputs.try_48_direct || inputs.try_48_intermediate || inputs.try_48_msi)
        run: |
          echo "Original .NET 4.8 payload-host trial requires host-only and forbids all installer trials."
          exit 1
      - name: Fetch selected Microsoft media privately using Windows authenticated SHA256
        shell: bash
        env:
          SWCOMPAT_PROVENANCE_ONLY: ${{ inputs.host_provenance_only }}
          SWCOMPAT_DIRECT_48: ${{ inputs.try_48_direct || inputs.try_48_msi }}
          SWCOMPAT_PAYLOAD_48: ${{ inputs.try_48_payload_host }}
        run: |
          set -euo pipefail
          versions=(--version 40)
          if [ "$SWCOMPAT_PROVENANCE_ONLY" != "true" ]; then
            versions+=(--version 481)
          fi
          if [ "$SWCOMPAT_DIRECT_48" = "true" ] || [ "$SWCOMPAT_PAYLOAD_48" = "true" ]; then
            versions+=(--version 48)
          fi
          python3 -m scripts.netfx4x_authenticated_media_fetch "${versions[@]}"
      - name: Install supported Winetricks 20260125 and its cabextract dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install winetricks
          command -v cabextract >/dev/null
          command -v winetricks >/dev/null
          winetricks --version | grep -F '20260125'
          echo "SWCOMPAT_WINETRICKS=$(realpath "$(command -v winetricks)")" >> "$GITHUB_ENV"
      - name: Download and authenticate allowlisted Wine Staging environment
        shell: bash
        env:
          SWCOMPAT_WINE_BASELINE: ${{ inputs.wine_baseline }}
        run: |
          set -euo pipefail
          case "$SWCOMPAT_WINE_BASELINE" in
            '11.21')
              EXPECTED_SHA=d7bcd5abf4df27aae397a7898aef074fea4a2e0b51e0a55aa9659517bbf9d452
              ;;
            '11.10')
              EXPECTED_SHA=940bdd1a177872020be01c5c33917cb8eecc1cc3193ad554914fb6efd90d7889
              ;;
            *)
              echo "Unsupported Wine baseline" >&2
              exit 1
              ;;
          esac
          ARCHIVE="$RUNNER_TEMP/wine-staging-${SWCOMPAT_WINE_BASELINE}-osx64.tar.xz"
          curl --fail --location --retry 3 --output "$ARCHIVE" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/${SWCOMPAT_WINE_BASELINE}/wine-staging-${SWCOMPAT_WINE_BASELINE}-osx64.tar.xz"
          printf '%s  %s\n' "$EXPECTED_SHA" "$ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/msxml3-wine-build"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/msxml3-wine-build"
          WINE_BIN="$(find "$RUNNER_TEMP/msxml3-wine-build" -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN" && test -x "$WINE_BIN"
          echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
      - name: Initialize new marked Wine x64 prefix for msxml3 fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m swcompat --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" --logs-dir "$RUNNER_TEMP/netfx40-msxml3-logs" init
          touch "$RUNNER_TEMP/netfx40-msxml3-prefix/.swcompat-netfx481-disposable"
      - name: Install native msxml3 through original Winetricks verb
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_msxml3_prerequisite \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --winetricks "$SWCOMPAT_WINETRICKS" \
            --output build/netfx40-msxml3-prerequisite.json \
            --timeout 300 --agree-disposable-prefix
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx40_msxml3_prerequisite import validate
          r = json.loads(Path("build/netfx40-msxml3-prerequisite.json").read_text())
          assert validate(r)
          if r["status"] == "VERB_SUCCEEDED":
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("SWCOMPAT_MSXML3_READY=yes\n")
          PY
      - name: Retry genuine original Microsoft .NET 4.0 following msxml3
        if: env.SWCOMPAT_MSXML3_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_legacy \
            --wine "$SWCOMPAT_WINE" --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --installer build/dotNetFx40_Full_x86_x64.exe \
            --managed build/netfx481_runtime_probe.exe \
            --loader build/netfx481_clr_load.exe \
            --launcher build/netfx40_win32_launch.exe \
            --output build/netfx40-msxml3-runtime.json \
            --timeout 330 --agree-disposable-prefix \
            --experiment-extended-setup-wait \
            --experiment-enable-verbose-msi \
            --experiment-restart-after-mono \
            --experiment-trace-custom-action-type \
            --experiment-inventory-retained-msi
      - name: Restart isolated Wine to verify the real CLR persists after setup
        if: env.SWCOMPAT_MSXML3_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_msxml3_restart \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --loader build/netfx481_clr_load.exe \
            --managed build/netfx481_runtime_probe.exe \
            --original build/netfx40-msxml3-runtime.json \
            --output build/netfx40-msxml3-restart.json \
            --agree-disposable-prefix
      - name: Gate original 4.8.1 upgrade on restarted native Microsoft 4.0
        if: env.SWCOMPAT_MSXML3_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx40_msxml3_restart import validate
          p = Path("build/netfx40-msxml3-restart.json")
          assert p.is_file(), "Real Microsoft .NET 4.0 restart evidence missing"
          r = json.loads(p.read_text(encoding="utf-8"))
          assert validate(r)
          if r["persistent_native_managed"] and r["native_only_managed"] == "PASS":
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("SWCOMPAT_NATIVE40_READY=yes\n")
          print("Original native .NET 4.0 prerequisites passed:", r["persistent_native_managed"])
          PY
      - name: Capture genuine 4.0 Wine mscoree CLR native-loader provenance without vendor logs
        if: env.SWCOMPAT_NATIVE40_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_native_mscoree_provenance \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --fixture build/netfx481_runtime_probe.exe \
            --native40-report build/netfx40-msxml3-restart.json \
            --output build/netfx40-mscoree-provenance.json \
            --agree-disposable-prefix
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.netfx40_native_mscoree_provenance import valid
          report = json.loads(Path("build/netfx40-mscoree-provenance.json").read_text())
          assert valid(report) and report["status"] == "MEASURED"
          assert not report["framework48_installed"]
          print("Native Microsoft .NET 4.0 mscoree host provenance:",
                report["mscoree"], report["clr"],
                report["managed"], report["native_host_confirmed"])
          PY
      - name: Test original installed .NET 4.0 public CLRCreateInstance hosting API against Wine shim
        if: env.SWCOMPAT_NATIVE40_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_host_api_diagnostic \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --fixture build/netfx48_host_activation.exe \
