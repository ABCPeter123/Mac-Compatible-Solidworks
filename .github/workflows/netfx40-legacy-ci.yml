name: Original Microsoft .NET 4.0 legacy CLR on Apple Silicon Wine

on:
  pull_request:
    paths:
      - '.github/workflows/netfx40-legacy-ci.yml'
      - 'scripts/netfx40_legacy.py'
      - 'probes/netfx481_win32_launch.c'
      - 'tests/test_netfx40_legacy.py'
      - 'scripts/netfx481_trial.py'
      - 'scripts/wine_mono_removal.py'
      - 'scripts/netfx481_clr_load.py'
      - 'scripts/netfx481_payload_audit.py'
      - 'probes/netfx481_runtime_probe.cs'
      - 'probes/netfx481_clr_load.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  absolute-path-regressions:
    name: Verify .NET 4.0 native CLR false-positive regressions on POSIX
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run absolute media and fixture path regression tests
        run: |
          python -m unittest discover -s tests -p 'test_netfx40_legacy.py' -v

  authentic-netfx40-windows:
    name: Authenticate original Microsoft .NET 4.0 and compile CLR probes
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safety gate and strict no-leak reporting
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_netfx40_legacy.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Original Microsoft 4.0 safety tests failed" }

      - name: Compile independent native CLR and managed execution probes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "MSVC locator missing" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "MSVC tools missing" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) { throw "MSVC x64 environment missing" }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /Fe:build\netfx481_clr_load.exe probes\netfx481_clr_load.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-netfx40-loader.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-netfx40-loader.cmd
          if ($LASTEXITCODE -ne 0) { throw "CLR loader compilation failed" }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /DSWCOMPAT_NETFX40 /Fe:build\netfx40_win32_launch.exe probes\netfx481_win32_launch.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-netfx40-launcher.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-netfx40-launcher.cmd
          if ($LASTEXITCODE -ne 0) { throw "Exact 4.8 Win32 launcher compilation failed" }
          $selftest = & build\netfx40_win32_launch.exe --selftest-3010
          if ($LASTEXITCODE -ne 0 -or $selftest -notcontains 'SWCOMPAT_WIN32_SETUP_EXIT_HEX=00000BC2') {
            throw "Exact 4.8 Windows process exit selftest failed"
          }
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "Microsoft C# compiler missing" }
          & $csc /nologo /target:exe /reference:System.Core.dll /reference:System.Xml.dll /out:build\netfx481_runtime_probe.exe probes\netfx481_runtime_probe.cs
          if ($LASTEXITCODE -ne 0) { throw "C# fixture compilation failed" }
          $loader = & build\netfx481_clr_load.exe
          if ($LASTEXITCODE -ne 0 -or $loader -notcontains 'SWCOMPAT_CLR_LOAD_STATUS=LOADED') {
            throw "Windows native CLR baseline failed"
          }
          & build\netfx481_runtime_probe.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows managed baseline failed" }
      - name: Download official Microsoft .NET 4.0 offline installer and validate original Authenticode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.microsoft.com/download/9/5/A/95A9616B-7A37-4AF6-BC36-D6EA96C8DAAE/dotNetFx40_Full_x86_x64.exe"
          $exe = Join-Path (Resolve-Path build) "dotNetFx40_Full_x86_x64.exe"
          curl.exe --fail --location --retry 3 --max-time 600 --output $exe $url
          if ($LASTEXITCODE -ne 0) { throw "Official .NET 4.0 offline download failed" }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 15728640 -or $item.Length -gt 262144000) { throw "Unexpected original installer size" }
          $expected = "65e064258f2e418816b304f646ff9e87af101e4c9552ab064bb74d281c38659f"
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Microsoft original .NET 4.0 SHA256 differs from pinned Winetricks recipe" }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid) { throw "Microsoft installer Authenticode invalid" }
          if ($null -eq $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch '(^|, )O=Microsoft Corporation(,|$)') {
            throw "Original .NET 4.0 redistributable not Microsoft-signed"
          }
          (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath build/netfx40.sha256 -NoNewline -Encoding ascii
          Write-Output "Original .NET Framework 4.8 signed by Microsoft and digest bound"
      - uses: actions/upload-artifact@v4
        with:
          name: authenticated-original-microsoft-netfx40-private
          path: |
            build/dotNetFx40_Full_x86_x64.exe
            build/netfx40.sha256
            build/netfx481_runtime_probe.exe
            build/netfx481_clr_load.exe
            build/netfx40_win32_launch.exe
          compression-level: 0
          retention-days: 1

  apple-silicon-native-baseline:
    name: Check real Microsoft .NET 4.0 CLR deployment under Apple Silicon Wine
    needs: [authentic-netfx40-windows, absolute-path-regressions]
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: authenticated-original-microsoft-netfx40-private
          path: build
      - name: Download and hash-check fixed Apple Silicon Wine 11.21 build
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/wine-devel-11.21-osx64.tar.xz"
          curl --fail --location --retry 3 --output "$ARCHIVE" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-devel-11.21-osx64.tar.xz"
          echo "9909b486657e10ab66c7279371ae1f990345b596b3b1b3a0cf21f28af24fa0ce  $ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/wine-build"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/wine-build"
          WINE_BIN="$(find "$RUNNER_TEMP/wine-build" -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN" && test -x "$WINE_BIN"
          echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
      - name: Initialize original Microsoft runtime experiment in a new disposable prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m swcompat --prefix "$RUNNER_TEMP/netfx40-prefix" --logs-dir "$RUNNER_TEMP/netfx40-logs" init
          touch "$RUNNER_TEMP/netfx40-prefix/.swcompat-netfx481-disposable"
      - name: Install only original signed .NET 4.0 and independently check native CLR
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_legacy \
            --wine "$SWCOMPAT_WINE" --prefix "$RUNNER_TEMP/netfx40-prefix" \
            --installer build/dotNetFx40_Full_x86_x64.exe \
            --managed build/netfx481_runtime_probe.exe \
            --loader build/netfx481_clr_load.exe \
            --launcher build/netfx40_win32_launch.exe \
            --output build/netfx40-baseline.json \
            --timeout 210 --agree-disposable-prefix
      - name: Publish only bounded .NET 4.0 status categories
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx40_legacy import validate
          p = Path("build/netfx40-baseline.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Genuine Microsoft .NET 4.0 with legacy WinXP setup\n\n")
              if not p.is_file():
                  f.write("Experiment incomplete. Native CLR NOT VERIFIED.\n")
              else:
                  r = json.loads(p.read_text())
                  if not validate(r):
                      raise ValueError("Unsafe original .NET 4.0 report")
                  for field in ("status", "winver", "registry64", "registry32", "mono",
                                "selftest", "installer_status", "installer_exit",
                                "installer_child_seen", "installer_child_lifecycle",
                                "installer_child_exit", "reboot", "clr64_before", "clr64_after", "clr32_after",
                                "mscorlib64_after", "native_loader", "runtime_family",
                                "managed_functionality", "candidate_native40",
                                "netfx481_ready", "solidworks_compatibility"):
                      f.write(f"{field}: **{r[field]}**\n\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netfx40-apple-silicon-privacy-safe-result
          path: build/netfx40-baseline.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require genuine original Microsoft setup execution and independent CLR test
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.netfx40_legacy import validate
          r = json.loads(Path("build/netfx40-baseline.json").read_text())
          assert validate(r)
          assert r["status"] == "MEASURED"
          assert r["selftest"] == "PASS"
          assert r["installer_status"] == "EXIT_CAPTURED"
          assert r["netfx481_ready"] is False
          assert r["solidworks_compatibility"] == "NOT_DEMONSTRATED"
          PY
