          fi

          # Reuse the canonical prefix path for all downstream gate checks.
          # The original attempt was moved, not mutated or reused.
          python3 -m swcompat \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --logs-dir "$RUNNER_TEMP/netfx40-msxml3-retry-logs" init \
            --timeout 120 --skip-bootstrap-mono-gecko
          touch "$RUNNER_TEMP/netfx40-msxml3-prefix/.swcompat-netfx481-disposable"
          python3 -m scripts.netfx40_prefix_readiness \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --output build/netfx40-prefix-readiness-retry.json \
            --agree-disposable-prefix
          if [[ "$SWCOMPAT_WEBVIEW2_FIRST" == "true" ]]; then
            # Previous report describes the archived prefix, not this one.
            mv build/solidworks-webview2-prerequisite.json build/solidworks-webview2-attempt1.json
            bash scripts/netfx481_webview2_first.sh build/solidworks-webview2-prerequisite.json
          fi
          python3 -m scripts.netfx40_msxml3_prerequisite \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --winetricks "$SWCOMPAT_WINETRICKS" \
            --output build/netfx40-msxml3-prerequisite-retry.json \
            --timeout 300 --agree-disposable-prefix
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.netfx40_prefix_readiness import valid as valid_prefix
          from scripts.netfx40_msxml3_prerequisite import validate as valid_msxml
          pre = json.loads(Path("build/netfx40-prefix-readiness-retry.json").read_text())
          xml = json.loads(Path("build/netfx40-msxml3-prerequisite-retry.json").read_text())
          assert valid_prefix(pre) and pre["ready"] is True
          assert valid_msxml(xml) and xml["status"] == "VERB_SUCCEEDED"
          assert xml["x64_dll_changed"] and xml["x86_dll_changed"]
          PY

          set -- python3 -m scripts.netfx40_legacy \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --installer build/dotNetFx40_Full_x86_x64.exe \
            --managed build/netfx481_runtime_probe.exe \
            --loader build/netfx481_clr_load.exe \
            --launcher build/netfx40_win32_launch.exe \
            --output build/netfx40-msxml3-runtime.json \
            --timeout 330 --agree-disposable-prefix \
            --experiment-extended-setup-wait \
            --experiment-enable-verbose-msi \
            --experiment-restart-after-mono \
            --experiment-trace-custom-action-type \
            --experiment-inventory-retained-msi \
            --experiment-private-original-action
          if [[ "${SWCOMPAT_WIN7_SETUP:-false}" == "true" ]]; then
            set -- "$@" --experiment-win7-setup
          fi
          if [[ "$SWCOMPAT_IPD_SYNC_RETRY" == "true" && "$SWCOMPAT_RETRY_WINE_BASELINE" == "wiage-11.13" ]]; then
            set -- "$@" --experiment-dll-relay-output build/netfx40-msxml3-dll-relay.json
          fi
          "$@"
          python3 -m scripts.netfx40_msxml3_restart \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --loader build/netfx481_clr_load.exe \
            --managed build/netfx481_runtime_probe.exe \
            --original build/netfx40-msxml3-runtime.json \
            --output build/netfx40-msxml3-restart.json \
            --agree-disposable-prefix
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.netfx40_msxml3_restart import validate
          from scripts.netfx40_fresh_prefix_retry import decision
          r = json.loads(Path("build/netfx40-msxml3-restart.json").read_text())
          original = json.loads(Path("build/netfx40-msxml3-runtime.json").read_text())
          assert validate(r)
          outcome = decision(original, r)
          if r["persistent_native_managed"] and r["native_only_managed"] == "PASS":
              assert outcome == "ALREADY_VERIFIED"
          else:
              # Only the exact clean, observed 1603 failure can proceed to the
              # existing read-only MSI attribution steps. The native40 gate
              # below must still fail. Unknown lifecycle/partial state aborts.
              assert outcome == "RETRY_ELIGIBLE", (
                  "Second independent original CLR4 attempt ended in an unverified state")
              print("Second authentic CLR4 attempt returned 1603; collecting private MSI attribution before failing native CLR gate.")
          PY

      - name: Extract unchanged signed .NET 4.0 MSI for private failure attribution
        if: env.SWCOMPAT_MSXML3_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_offline_extract \
