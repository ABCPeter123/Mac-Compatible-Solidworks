      - name: Validate that msxml3 cannot fabricate a CLR install
        if: always()
        env:
          SWCOMPAT_PROVENANCE_ONLY: ${{ inputs.host_provenance_only }}
          SWCOMPAT_PAYLOAD_48: ${{ inputs.try_48_payload_host }}
          SWCOMPAT_DRAIN_NGEN: ${{ inputs.drain_native40_ngen }}
          SWCOMPAT_TRY_40_CORE: ${{ inputs.try_40_core_msi_recovery }}
          SWCOMPAT_CORE_NGEN: ${{ inputs.probe_native40_ngen_if_ready }}
          SWCOMPAT_TRY_481_RECOVERY: ${{ inputs.try_481_after_verified_partial48 }}
          SWCOMPAT_TRY_CATALOG: ${{ inputs.try_481_catalog_wusa }}
          SWCOMPAT_TRY_IPD_APPLY: ${{ inputs.try_481_ipd_apply_candidate }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.netfx40_msxml3_prerequisite import validate as pre_validate
          from scripts.netfx40_legacy import validate as runtime_validate
          prerequisite = Path("build/netfx40-msxml3-prerequisite.json")
          assert prerequisite.is_file(), "Pre-install msxml3 experiment missing"
          p = json.loads(prerequisite.read_text())
          assert pre_validate(p)
          runtime = Path("build/netfx40-msxml3-runtime.json")
          if p["status"] == "VERB_SUCCEEDED":
              assert runtime.is_file(), "msxml3 succeeded but original setup was not tested"
          if runtime.is_file():
              r = json.loads(runtime.read_text())
              assert runtime_validate(r)
              assert r["installer_status"] != "NOT_RUN"
              assert r["solidworks_compatibility"] == "NOT_DEMONSTRATED"
              if r["status"] == "BLOCKED_INSTALLER_CLEANUP":
                  # A still-open original installer pipe means later CLR, MSI
                  # and NGen measurements were intentionally never attempted.
                  assert r["installer_cleanup"] == "UNVERIFIED"
                  assert not Path("build/netfx40-msxml3-restart.json").exists()
                  assert not Path("build/netfx40-original-core-msi-recovery.json").exists()
                  raise AssertionError(
                      "Original Microsoft .NET4 installer cleanup UNVERIFIED; "
                      "CLR, MSI and NGen tests were deliberately blocked")
              if r["candidate_native40"]:
                  assert r["native_loader"] == "LOADED"
                  assert r["managed_functionality"] == "PASS"
              restart_path = Path("build/netfx40-msxml3-restart.json")
              assert restart_path.is_file(), "Restart persistence experiment missing"
              from scripts.netfx40_msxml3_restart import validate as validate_restart
              rr = json.loads(restart_path.read_text())
              assert validate_restart(rr)
              # The direct-core recovery is most relevant when the original
              # Microsoft CLR4 is ABSENT. Validate it independently of
              # the successful-CLR branch, or the 1603 case can go green
              # without an MSI attempt (observed in run 44990034092).
              core_requested = os.environ.get("SWCOMPAT_TRY_40_CORE") == "true"
              core_path = Path("build/netfx40-original-core-msi-recovery.json")
              assert core_path.is_file() == core_requested, (
                  "Requested authentic original .NET4 core MSI recovery not measured")
              if core_path.is_file():
                  assert os.environ.get("SWCOMPAT_PROVENANCE_ONLY") == "true"
                  from scripts.netfx40_original_core_msi_recovery import valid as valid_core
                  from scripts.netfx40_offline_extract import validate as valid_extract
                  core = json.loads(core_path.read_text(encoding="ascii"))
                  assert valid_core(core)
                  assert core["status"] != "NOT_RUN"
                  assert core["framework40_installed"] is False
                  assert core["framework48_installed"] is False
                  extracted_path = Path("build/netfx40-msxml3-original-extract.json")
                  assert extracted_path.is_file()
                  extracted = json.loads(extracted_path.read_text(encoding="ascii"))
                  assert valid_extract(extracted)
                  genuine_1603 = (
                      r["installer_status"] == "EXIT_CAPTURED"
                      and r["installer_exit"] == "MSI_FATAL_ERROR"
                      and r["installer_exit_hex"] == "00000643"
                      and r["clr64_after"] == "ABSENT"
                      and rr["status"] == "NOT_ELIGIBLE"
                      and extracted["process"] == "ZERO"
                      and extracted["core_x64_ole_candidate"])
                  if genuine_1603:
                      assert core["status"] == "MEASURED", (
                          "Authentic original .NET4 Core MSI 1603 recovery "
                          "did not execute despite verified extracted media")
                      assert core["install"] != "NOT_RUN"
              core_ngen_requested = os.environ.get("SWCOMPAT_CORE_NGEN") == "true"
              core_ngen_path = Path("build/netfx40-core-path-ngen-drain.json")
              assert core_ngen_path.is_file() == (
                  core_ngen_requested and rr["persistent_native_managed"]), (
                  "Adaptive original Microsoft NGen did not run after verified native CLR4 "
                  "or ran without a working authenticated Microsoft runtime")
              if core_ngen_path.is_file():
                  from scripts.netfx48_native_ngen_drain import valid as valid_drain
                  ngen_report = json.loads(core_ngen_path.read_text(encoding="ascii"))
                  assert valid_drain(ngen_report)
                  assert ngen_report["status"] in {"READY", "BLOCKED"}
                  assert core_path.is_file() and core["status"] == "SKIPPED_ALREADY_NATIVE", (
                      "Original core recovery and NGen cannot run concurrently")
              if rr["persistent_native_managed"]:
                  assert rr["restart"] == "COMPLETED"
                  assert rr["native_loader"] == "LOADED"
                  assert rr["native_only_managed"] == "PASS"
                  from scripts.netfx40_host_api_diagnostic import valid as host_valid
                  host_path = Path("build/netfx40-public-host-api.json")
                  assert host_path.is_file(), "Original .NET 4.0 public host API evidence missing"
                  host = json.loads(host_path.read_text(encoding="ascii"))
                  assert host_valid(host) and host["status"] == "MEASURED", (
                      "Original CLR hosting probe must be measured, not inferred")
                  from scripts.netfx40_native_mscoree_provenance import valid as provenance_valid
                  provenance_path = Path("build/netfx40-mscoree-provenance.json")
                  assert provenance_path.is_file(), "Original CLR DLL provenance evidence missing"
                  provenance = json.loads(provenance_path.read_text(encoding="ascii"))
                  assert provenance_valid(provenance) and provenance["status"] == "MEASURED"
                  payload_requested = os.environ.get("SWCOMPAT_PAYLOAD_48") == "true"
                  payload_path = Path("build/netfx48-core-host-categories.json")
                  assert payload_path.is_file() == payload_requested, (
                      "Requested original 4.8 CLR payload-host test missing")
                  if payload_requested:
                      from scripts.netfx48_core_host_trial import valid as payload_valid
                      payload = json.loads(payload_path.read_text(encoding="ascii"))
                      assert payload_valid(payload) and payload["original48_sha256_verified"]
                      assert payload["framework48_installed"] is False
                      assert payload["framework481_installed"] is False
                  host_only = os.environ.get("SWCOMPAT_PROVENANCE_ONLY") == "true"
                  from scripts.netfx40_to_481_upgrade import validate as upgrade_valid
                  intermediate_path = Path("build/netfx40-to-48-intermediate.json")
                  intermediate_required = os.environ.get("SWCOMPAT_TRY_48_INTERMEDIATE") == "true"
                  assert intermediate_path.is_file() == intermediate_required, (
                      "Requested intermediate 4.8 experiment was not measured")
                  intermediate_ready = False
                  if intermediate_path.is_file():
                      from scripts.netfx40_to_48_intermediate import validate as valid_intermediate
                      intermediate = json.loads(intermediate_path.read_text(encoding="ascii"))
                      assert valid_intermediate(intermediate)
                      intermediate_ready = intermediate["native48_candidate"]
                  direct_path = Path("build/netfx40-to-48-direct.json")
                  direct_required = os.environ.get("SWCOMPAT_TRY_48_DIRECT") == "true"
                  msi_required = os.environ.get("SWCOMPAT_TRY_48_MSI") == "true"
                  assert sum((direct_required, intermediate_required, msi_required)) <= 1, (
                      "Cannot mix original signed MSI, bootstrapper or Winetricks 4.8")
                  assert direct_path.is_file() == direct_required, (
                      "Requested signed original 4.8 experiment was not measured")
                  if direct_path.is_file():
                      from scripts.netfx40_to_48_direct import validate as valid_direct
                      direct = json.loads(direct_path.read_text(encoding="ascii"))
                      assert valid_direct(direct)
                      intermediate_ready = direct["native48_candidate"]
                  # A failed genuine CLR4 NGen drain is a valid, measured
                  # pre-MSI *block*. It is not a successful framework install
                  # and must not be misreported as a missing MSI test report.
                  drain_requested = os.environ.get("SWCOMPAT_DRAIN_NGEN") == "true"
                  assert not drain_requested or msi_required, (
                      "Native NGen preflight requires signed MSI trial")
                  drain_path = Path("build/netfx40-native-ngen-drain.json")
                  native40_ready = (
                      rr["persistent_native_managed"]
                      and rr["native_only_managed"] == "PASS")
                  assert drain_path.is_file() == (drain_requested and native40_ready), (
                      "Original CLR4 NGen evidence missing after verified native baseline "
                      "or NGen ran without an authenticated working CLR4")
                  drain_ready = not drain_requested
                  if drain_requested and not native40_ready:
                      print("Original Microsoft CLR4 NGen trial not eligible: CLR4 prerequisite failed")
                  if drain_path.is_file():
                      from scripts.netfx48_native_ngen_drain import valid as valid_drain
                      drain = json.loads(drain_path.read_text(encoding="ascii"))
                      assert valid_drain(drain)
                      assert drain["status"] in {"BLOCKED", "READY"}
                      drain_ready = drain["ready"]
                      if not drain_ready:
                          assert drain["status"] == "BLOCKED"
                          print("Signed MSI was correctly skipped after failed original NGen preflight")
                  msi_path = Path("build/netfx40-to-48-signed-msi.json")
                  assert msi_path.is_file() == (msi_required and drain_ready), (
                      "Original signed 4.8 MSI missing despite successful preflight "
                      "or unexpectedly ran after failed native NGen preflight")
                  recovery_eligible = False
                  if msi_path.is_file():
                      from scripts.netfx40_to_48_signed_msi import validate as valid_msi, eligible_481_recovery
                      msi = json.loads(msi_path.read_text(encoding="ascii"))
                      assert valid_msi(msi)
                      intermediate_ready = msi["native48_candidate"]
                      recovery_eligible = (
                          os.environ.get("SWCOMPAT_TRY_481_RECOVERY") == "true"
                          and eligible_481_recovery(msi))
                      if recovery_eligible:
                          assert not intermediate_ready
                  catalog_requested = os.environ.get("SWCOMPAT_TRY_CATALOG") == "true"
                  catalog_path = Path("build/netfx481-catalog-wusa.json")
                  ipd_requested = os.environ.get("SWCOMPAT_TRY_IPD_APPLY") == "true"
                  assert catalog_path.is_file() == (catalog_requested and native40_ready and not ipd_requested)
                  ipd_preflight = Path("build/netfx481-ipd-wusa-dryrun.json")
                  ipd_apply = Path("build/netfx481-ipd-apply-candidate.json")
                  assert ipd_preflight.is_file() == (ipd_requested and native40_ready)
                  if ipd_preflight.is_file():
                      from scripts.netfx481_ipd_apply_candidate import preflight_ready
                      eligible = preflight_ready(json.loads(ipd_preflight.read_text(encoding="ascii")))
                      assert ipd_apply.is_file() == eligible
                      if ipd_apply.is_file():
                          result = json.loads(ipd_apply.read_text(encoding="ascii"))
                          assert result["experimental"] is True and result["strict_cbs_equivalence"] is False
                          assert result["solidworks_compatibility"] == "NOT_DEMONSTRATED"
                          print("Experimental IPD framework confirmed:", result["framework481_confirmed"])
                  else:
                      assert not ipd_apply.is_file()
                  if catalog_path.is_file():
                      from scripts.netfx481_catalog_wusa import valid as valid_catalog
                      catalog = json.loads(catalog_path.read_text(encoding="ascii"))
                      assert valid_catalog(catalog)
                      assert catalog["original_package_verified"]
                      print("Independent catalog WUSA framework confirmed:", catalog["framework481_confirmed"])
                  upgrade_path = Path("build/netfx40-to-481-upgrade.json")
                  assert upgrade_path.is_file() == (
                      not host_only and not catalog_requested and (
                          (not intermediate_required and not direct_required and not msi_required)
                          or intermediate_ready or recovery_eligible)), (
                      "4.8.1 is forbidden in host-only mode and requires verified baseline or independently eligible recovery")
                  if host_only:
                      assert not intermediate_required and not direct_required and not msi_required
                      assert not intermediate_path.is_file() and not direct_path.is_file()
                      assert not msi_path.is_file()
                      assert not upgrade_path.is_file(), "Host-only must skip 4.8.1"
                  if upgrade_path.is_file():
                      upgraded = json.loads(upgrade_path.read_text(encoding="utf-8"))
                      assert upgrade_valid(upgraded)
                      assert upgraded["original_native40_persistent"]
                      assert upgraded["solidworks_compatibility"] == "NOT_DEMONSTRATED"
                  win11_path = Path("build/netfx40-to-481-win11.json")
                  if upgrade_path.is_file():
                      assert win11_path.is_file()
                      after = json.loads(win11_path.read_text(encoding="utf-8"))
                      assert set(after) == {"win11_native_only_registry",
                                            "win11_native_only_family",
                                            "win11_native_only_managed",
                                            "win11_native481_ready"}
                      assert type(after["win11_native481_ready"]) is bool
                      if after["win11_native481_ready"]:
                          assert upgraded["framework481_confirmed"]
                          assert after["win11_native_only_managed"] == "PASS"
          PY
