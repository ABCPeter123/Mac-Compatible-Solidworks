        if: inputs.pause_after_verified_native40_ngen && (!inputs.progress_gated_native40_ngen || !inputs.drain_native40_ngen || !inputs.ngen_host_stack64 || !inputs.try_48_msi || inputs.host_provenance_only || inputs.wine_baseline != 'wiage-11.13' || !inputs.use_macos26_runner || inputs.pause_native_ngen_queue || inputs.try_48_direct || inputs.try_48_intermediate || inputs.try_48_payload_host || inputs.try_40_core_msi_recovery || inputs.probe_native40_ngen_if_ready || inputs.signed_msi_timeout_seconds != 420)
        shell: bash
        run: |
          echo "Post-preflight NGen pause requires a verified native Microsoft CLR4 x86/x64 drain and isolated signed MSI/MSP servicing."
          exit 1
      - name: Reject progress-gated NGen outside genuine Wiage signed .NET 4.8 MSI servicing
        if: inputs.progress_gated_native40_ngen && (!inputs.drain_native40_ngen || !inputs.ngen_host_stack64 || !inputs.try_48_msi || inputs.host_provenance_only || inputs.wine_baseline != 'wiage-11.13' || !inputs.use_macos26_runner || inputs.pause_native_ngen_queue || inputs.try_48_direct || inputs.try_48_intermediate || inputs.try_48_payload_host || inputs.try_40_core_msi_recovery || inputs.probe_native40_ngen_if_ready || (inputs.signed_msi_timeout_seconds != 420 && !(inputs.signed_msp_reinstall && inputs.signed_msp_win32_exit && inputs.signed_msi_timeout_seconds == 1200)))
        shell: bash
        run: |
          echo "Progress-gated NGen requires isolated authentic CLR4 and signed .NET 4.8 servicing; the 1200s MSI budget is permitted only with explicit silent MSP reinstall and native Win32 monitoring."
          exit 1
      - name: Fetch selected Microsoft media privately using Windows authenticated SHA256
        shell: bash
        env:
          SWCOMPAT_PROVENANCE_ONLY: ${{ inputs.host_provenance_only }}
          SWCOMPAT_DIRECT_48: ${{ inputs.try_48_direct || inputs.try_48_msi }}
          SWCOMPAT_TRY_CATALOG: ${{ inputs.try_481_catalog_wusa }}
          SWCOMPAT_PAYLOAD_48: ${{ inputs.try_48_payload_host }}
        run: |
          set -euo pipefail
          versions=(--version 40)
          if [ "$SWCOMPAT_PROVENANCE_ONLY" != "true" ] && [ "$SWCOMPAT_TRY_CATALOG" != "true" ]; then
            versions+=(--version 481)
          fi
          if [ "$SWCOMPAT_TRY_CATALOG" == "true" ]; then
            curl --fail --location --retry 3 --max-time 600 --output build/KB5011048.msu \
              "https://catalog.s.download.windowsupdate.com/c/msdownload/update/software/ftpk/2023/09/windows10.0-kb5011048-x64_411d40ab5705c99f2bdb576ad3dc3e6ec0f3902e.msu"
            python3 -c 'from pathlib import Path; from scripts.netfx481_catalog_wusa import verify_package; verify_package(Path("build/KB5011048.msu"), Path("build/netfx481-catalog.sha256"))'
          fi
          if [ "$SWCOMPAT_DIRECT_48" = "true" ] || [ "$SWCOMPAT_PAYLOAD_48" = "true" ]; then
            versions+=(--version 48)
          fi
          python3 -m scripts.netfx4x_authenticated_media_fetch "${versions[@]}"
      - name: Install supported Winetricks 20260125 and its cabextract dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install winetricks
          command -v cabextract >/dev/null
          command -v winetricks >/dev/null
          winetricks --version | grep -F '20260125'
          echo "SWCOMPAT_WINETRICKS=$(realpath "$(command -v winetricks)")" >> "$GITHUB_ENV"
      - name: Download and authenticate allowlisted Wine Staging environment
        shell: bash
        env:
          SWCOMPAT_WINE_BASELINE: ${{ inputs.wine_baseline }}
          SWCOMPAT_HOST_ONLY: ${{ inputs.host_provenance_only }}
          SWCOMPAT_MACOS26: ${{ inputs.use_macos26_runner }}
          SWCOMPAT_WIAGE_TRY_MSI: ${{ inputs.try_48_msi }}
          SWCOMPAT_WIAGE_TRY_DIRECT: ${{ inputs.try_48_direct }}
          SWCOMPAT_WIAGE_TRY_INTERMEDIATE: ${{ inputs.try_48_intermediate }}
          SWCOMPAT_WIAGE_TRY_PAYLOAD: ${{ inputs.try_48_payload_host }}
          SWCOMPAT_WIAGE_TRY_CATALOG: ${{ inputs.try_481_catalog_wusa || false }}
        run: |
          set -euo pipefail
          if [[ "$SWCOMPAT_WINE_BASELINE" == "wiage-11.13" ]]; then
            # Three isolated, authenticated macOS 26 trials only:
            # (1) native original Microsoft CLR4 hosting;
            # (2) original signed Microsoft .NET 4.8 bootstrapper; or
            # (3) original signed Microsoft .NET 4.8 x64 MSI + MSP, extracted
            # from the same authenticated Microsoft media after the observed
            # 5100 bootstrapper prerequisite block. This third trial changes
            # the installation path, not Microsoft package content. All
            # install arms still require verified persistent native CLR4 and
            # original .NET 4.8 managed execution before allowing 4.8.1.
            if [[ "$SWCOMPAT_MACOS26" != "true" ||
                  "$SWCOMPAT_WIAGE_TRY_INTERMEDIATE" != "false" ||
                  "$SWCOMPAT_WIAGE_TRY_PAYLOAD" != "false" ]]; then
              echo "Pinned Wiage requires macOS26, no Winetricks48 and no payload-only trial" >&2
              exit 1
            fi
            case "$SWCOMPAT_HOST_ONLY:$SWCOMPAT_WIAGE_TRY_DIRECT:$SWCOMPAT_WIAGE_TRY_MSI:$SWCOMPAT_WIAGE_TRY_CATALOG" in
              true:false:false:false|false:true:false:false|false:false:true:false|false:false:false:true) ;;
              *)
                echo "Wiage must select exactly one of CLR4 host, signed 4.8 direct, signed 4.8 MSI or catalog WUSA" >&2
                exit 1
                ;;
            esac
            EXPECTED_SHA=d0cea7ff492dd3801dfa26a2a7d5ed1331e60f65929318d17301a3ce9cbba56c
            ARCHIVE="$RUNNER_TEMP/wiage-11.13-runtime.tar.gz"
            curl --fail --location --retry 3 --max-time 600 --output "$ARCHIVE" \
              "https://github.com/dttdrv/mage/releases/download/preview-2026-08-02/wiage-runtime.tar.gz"
            printf '%s  %s\n' "$EXPECTED_SHA" "$ARCHIVE" | shasum -a 256 -c -
            mkdir -p "$RUNNER_TEMP/msxml3-wine-build"
            # Independently reject archive traversal, malformed metadata,
            # untrusted special files and links before any bytes are extracted.
            python3 -m scripts.wine_engine_archive --archive "$ARCHIVE"
            # The pinned macOS-produced tar contains AppleDouble
            # ._wiage and potentially wiage/**/._* host metadata entries.
            # Validation permits only small regular sidecars. Never extract
            # them, especially ._wiage outside the isolated wiage root.
            COPYFILE_DISABLE=1 tar --exclude='._*' --exclude='*/._*' \
              -xzf "$ARCHIVE" -C "$RUNNER_TEMP/msxml3-wine-build"
            test ! -e "$RUNNER_TEMP/msxml3-wine-build/._wiage"
            WINE_BIN="$RUNNER_TEMP/msxml3-wine-build/wiage/bin/wine"
            test -e "$WINE_BIN" && test -x "$WINE_BIN"
            test -x "$RUNNER_TEMP/msxml3-wine-build/wiage/bin/wineserver"
            echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
            echo "Authenticated separate Wiage Rosetta WoW64 experimental Wine 11.13 runtime"
            exit 0
          fi
          case "$SWCOMPAT_WINE_BASELINE" in
            '11.21')
              EXPECTED_SHA=d7bcd5abf4df27aae397a7898aef074fea4a2e0b51e0a55aa9659517bbf9d452
              ;;
            '11.10')
              EXPECTED_SHA=940bdd1a177872020be01c5c33917cb8eecc1cc3193ad554914fb6efd90d7889
              ;;
            *)
              echo "Unsupported Wine baseline" >&2
              exit 1
              ;;
          esac
          ARCHIVE="$RUNNER_TEMP/wine-staging-${SWCOMPAT_WINE_BASELINE}-osx64.tar.xz"
          curl --fail --location --retry 3 --output "$ARCHIVE" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/${SWCOMPAT_WINE_BASELINE}/wine-staging-${SWCOMPAT_WINE_BASELINE}-osx64.tar.xz"
          printf '%s  %s\n' "$EXPECTED_SHA" "$ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/msxml3-wine-build"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/msxml3-wine-build"
          WINE_BIN="$(find "$RUNNER_TEMP/msxml3-wine-build" -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN" && test -x "$WINE_BIN"
          echo "SWCOMPAT_WINE=$WINE_BIN" >> "$GITHUB_ENV"
      - name: Initialize new marked Wine x64 prefix for msxml3 fix
        shell: bash
        env:
          SWCOMPAT_WINE_BASELINE: ${{ inputs.wine_baseline }}
        run: |
          set -euo pipefail
          if [[ "$SWCOMPAT_WINE_BASELINE" == "wiage-11.13" ]]; then
            # The pinned Wiage fork implements MAGE_BACKGROUND_EXE in its
            # ntdll loader and suppresses helper window foreground activation
            # in winemac. WineHQ bug 59595 reports rundll32's visible window
            # can keep macOS26 wineboot stuck inside display event callbacks.
            # The fork also explicitly documents WINEMSYNC=1 for both its
            # client and wineserver. Apply only to this experimental engine.
            export MAGE_BACKGROUND_EXE=rundll32.exe:services.exe:explorer.exe:conhost.exe
            export WINEMSYNC=1
            echo "MAGE_BACKGROUND_EXE=$MAGE_BACKGROUND_EXE" >> "$GITHUB_ENV"
            echo "WINEMSYNC=1" >> "$GITHUB_ENV"
            BOOT_TIMEOUT=120
            BOOTSTRAP_OVERRIDE=(--skip-bootstrap-mono-gecko)
            echo "Original CLR4 Wiage Wineboot environment: BACKGROUND_HELPERS_MSYNC_SKIP_MONO_GECKO"
          else
            BOOT_TIMEOUT=240
            BOOTSTRAP_OVERRIDE=()
            echo "Original CLR4 Wineboot environment: DEFAULT"
          fi
          python3 -m swcompat --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" --logs-dir "$RUNNER_TEMP/netfx40-msxml3-logs" init --timeout "$BOOT_TIMEOUT" "${BOOTSTRAP_OVERRIDE[@]}"
          touch "$RUNNER_TEMP/netfx40-msxml3-prefix/.swcompat-netfx481-disposable"
      - name: Verify genuine Wiage Wineboot registry flush before Microsoft prerequisites
        if: inputs.wine_baseline == 'wiage-11.13'
        shell: bash
        run: |
          set -euo pipefail
          # Successful Wineboot process exit is not proof that wineserver has
          # persisted system.reg. Do not create dummy registry files.
          python3 -m scripts.netfx40_prefix_readiness \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --output build/netfx40-prefix-readiness.json \
            --agree-disposable-prefix
      - uses: actions/download-artifact@v4
        if: inputs.try_481_ipd_apply_candidate && (inputs.try_webview2_after_ipd || (github.event_name == 'workflow_dispatch' && inputs.try_solidworks_after_ipd))
        with:
          name: ipd-solidworks-self-authored-probes-and-webview-digest
          path: build
      - name: Fetch independently verified WebView2 media and pinned SDK loader privately
        if: inputs.try_481_ipd_apply_candidate && (inputs.try_webview2_after_ipd || (github.event_name == 'workflow_dispatch' && inputs.try_solidworks_after_ipd))
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 360 --output build/MicrosoftEdgeWebView2RuntimeInstallerX64.exe 'https://go.microsoft.com/fwlink/?linkid=2124701'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("build/MicrosoftEdgeWebView2RuntimeInstallerX64.exe")
          assert hashlib.file_digest(p.open("rb"), "sha256").hexdigest() == Path("build/evergreen-installer.sha256").read_text().strip()
          PY
          curl --fail --location --retry 3 --max-time 120 --output build/ipd-webview-sdk.zip 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4314.35/microsoft.web.webview2.1.0.4314.35.nupkg'
          printf '%s  %s\n' 90778deb1b77e36292828b4b5833c9255c27533f40e0ddd55891ae718944edc4 build/ipd-webview-sdk.zip | shasum -a 256 -c -
          unzip -p build/ipd-webview-sdk.zip runtimes/win-x64/native/WebView2Loader.dll > build/WebView2Loader.dll
          printf '%s  %s\n' d3fce90bdeecb08596e377dea6a316354dd8949e32ff09b89d51be00c14e21b6 build/WebView2Loader.dll | shasum -a 256 -c -
      - name: Install official WebView2 in fresh prefix before native CLR servicing
        if: inputs.try_481_ipd_apply_candidate && (inputs.try_webview2_after_ipd || (github.event_name == 'workflow_dispatch' && inputs.try_solidworks_after_ipd))
        shell: bash
