name: Original Microsoft .NET 4.0 CLR on Wine Staging A/B

# Original Microsoft installer experiments require explicit workflow_dispatch.
# A separately gated, main-only one-shot reusable caller may select the
# host-provenance-only mode. It cannot request any .NET 4.8 installation.
# All pull requests use compatibility-ci.yml for non-proprietary regressions.
# Use exactly one optional 4.8 intermediate; do not rerun both paths.
on:
  workflow_call:
    inputs:
      try_48_intermediate:
        description: 'Optional .NET 4.8 intermediate; disabled in one-shot caller'
        type: boolean
        required: false
        default: false
      try_48_direct:
        description: 'Optional original .NET 4.8 direct; disabled in one-shot caller'
        type: boolean
        required: false
        default: false
      wow64_host_stack64:
        description: 'Only for isolated x86 WoW64 probes: raise inherited host stack to 65520 KiB'
        type: boolean
        required: false
        default: false
      try_wow64_faults:
        description: 'Collect private bounded exception categories for x86 managed/native WoW64'
        type: boolean
        required: false
        default: false
      try_wow64_managed:
        description: 'Verify native Microsoft CLR4 executes x86 managed code under Wine WoW64'
        type: boolean
        required: false
        default: false
      try_48_msi:
        description: 'Original signed .NET 4.8 MSI+MSP control after authentic 4.0'
        type: boolean
        required: false
        default: false
      ngen_host_stack64:
        description: 'Opt-in inherited macOS 65520 KiB host stack and private Wine NGen failure classifier'
        type: boolean
        required: false
        default: false
      probe_native40_ngen_if_ready:
        description: 'Adaptive core MSI trial: on verified native CLR4, test original NGen with 64MiB stack'
        type: boolean
        required: false
        default: false
      try_40_core_msi_recovery:
        description: 'Original extracted .NET4 Core x64 MSI after genuine 1603, Wiage-only'
        type: boolean
        required: false
        default: false
      drain_native40_ngen:
        description: 'Bounded authentic x64 and x86 CLR4 NGen queue drain before signed 4.8 MSI, Wiage-only'
        type: boolean
        required: false
        default: false
      progress_gated_native40_ngen:
        description: 'Only in isolated signed 4.8 MSI arm: grant NGen grace when original queue logs grow'
        type: boolean
        required: false
        default: false
      retry_growing_native40_ngen_nonzero:
        description: 'Optional one bounded original NGen retry only after actual x64/x86 queue progress and clean nonzero exit'
        type: boolean
        required: false
        default: false
      pause_native_ngen_queue:
        description: 'Opt-in real Microsoft ngen queue pause/continue around original signed MSI'
        type: boolean
        required: false
        default: false
      pause_after_verified_native40_ngen:
        description: 'Only with authenticated Wiage progress preflight: pause both real NGen queues around original 4.8 MSI+MSP'
        type: boolean
        required: false
        default: false
      signed_msi_win10_profile:
        description: 'Only after pinned original CLR4 NGen preflight, test unchanged signed 4.8 MSI+MSP under Wine Windows 10'
        type: boolean
        required: false
        default: false
      signed_msp_win32_exit:
        description: 'Only authenticated native CLR4 test: run unmodified original MSP through MSVC Win32 full exit monitor'
        type: boolean
        required: false
        default: false
      try_481_catalog_wusa:
        description: 'Independent official KB5011048 MSU via Wine WUSA on persistent native CLR4'
        type: boolean
        required: false
        default: false
      try_481_ipd_apply_candidate:
        description: 'Explicit isolated experimental IPD WUSA transaction; requires native CLR4 and complete package-local preflight'
        type: boolean
        required: false
        default: false
      try_webview2_after_ipd:
        description: 'Verify genuine CLR and WebView2 coexist in same disposable prefix, no private media'
        type: boolean
        required: false
        default: false
      try_solidworks_after_ipd:
        description: 'Manual only: licensed bootstrapper after verified native .NET 4.8.1 and ready WebView2 in same prefix'
        type: boolean
        required: false
        default: false
      try_481_after_verified_partial48:
        description: 'Independent genuine 4.8.1 recovery after native 4.8 MSP 1603; never marks 4.8 complete'
        type: boolean
        required: false
        default: false
      signed_msi_host_stack64:
        description: 'Only isolated native explicit-reinstall signed MSI/MSP: inherit 65520 KiB macOS stack'
        type: boolean
        required: false
        default: false
      signed_msp_reinstall:
        description: 'Explicit Microsoft silent MSP REINSTALL=ALL REINSTALLMODE=ecmus, native monitor only'
        type: boolean
        required: false
        default: false
      signed_msi_timeout_seconds:
        description: 'Allowlisted genuine signed MSI NGen experiment timeout (seconds)'
        type: number
        required: false
        default: 420
      prepare_48_assembly_cache:
        description: 'Only for signed x64 MSI, opt-in create missing Windows assembly cache in isolated prefix'
        type: boolean
        required: false
        default: false
      original_48_profile:
        description: 'Original signed 4.8 setup reported Windows profile; Win10 is distinct experiment'
        type: string
        required: false
        default: win7
      original_48_setup_args:
        description: 'Use logged setup or exact upstream Winetricks/Bottles flags'
        type: string
        required: false
        default: logged
      host_provenance_only:
        description: 'Authenticate genuine .NET 4.0 host; skip 4.8/4.8.1 installers'
        type: boolean
        required: false
        default: false
      try_48_payload_host:
        description: 'Test signed original 4.8 runtime payload in disposable native 4.0 prefix; no installer'
        type: boolean
        required: false
        default: false
      use_macos26_runner:
        description: 'Select macOS 26 Apple Silicon runner; default remains macOS 15'
        type: boolean
        required: false
        default: false
      win7_setup:
        description: 'Opt-in Windows 7 reported version for original Microsoft .NET 4.0 after msxml3'
        type: boolean
        required: false
        default: false
      reuse_verified_native40:
        description: 'Experimental: record genuine Microsoft CLR4.0 only after checking Winetricks required 32-bit ngen PE'
        type: boolean
        required: false
        default: false
      settle_wineserver:
        description: 'Opt-in stop lingering Wine server and clients in disposable prefix before dotnet48'
        type: boolean
        required: false
        default: false
      wine_baseline:
        description: 'Pinned Wine baseline; experimental Wiage Rosetta only in isolated macOS26 host/4.8 trials'
        type: string
        required: false
        default: '11.21'
    secrets:
      SWCOMPAT_INSTALLER_URL:
        required: false
      SWCOMPAT_INSTALLER_SHA256:
        required: false
  workflow_dispatch:
    inputs:
      try_48_intermediate:
        description: 'Try verified native .NET 4.8 after 4.0 before attempting 4.8.1'
        type: boolean
        required: false
        default: false
      try_48_direct:
        description: 'Opt-in original signed Microsoft 4.8 offline upgrade after real 4.0, before 4.8.1'
        type: boolean
        required: false
        default: false
      wow64_host_stack64:
        description: 'Opt-in 65520 KiB host stack for original x86 WoW64 tests only'
        type: boolean
        required: false
        default: false
      try_wow64_faults:
        description: 'Opt in native vs managed x86 WoW64 exception triage'
        type: boolean
        required: false
        default: false
      try_wow64_managed:
        description: 'Check original x86 .NET managed code under Apple Silicon Wine WoW64'
        type: boolean
        required: false
        default: false
      try_48_msi:
        description: 'Test extracted original signed 4.8 x64 MSI and MSP after native 4.0'
        type: boolean
        required: false
        default: false
      ngen_host_stack64:
        description: 'Try 65520 KiB host stack during genuine Wiage NGen and classify Wine errors'
        type: boolean
        required: false
        default: false
      probe_native40_ngen_if_ready:
        description: 'If CLR4 is already native, drain genuine NGen instead of Core MSI'
        type: boolean
        required: false
        default: false
      try_40_core_msi_recovery:
        description: 'Try original .NET4 Core x64 MSI after original bootstrapper 1603'
        type: boolean
        required: false
        default: false
      drain_native40_ngen:
        description: 'Opt-in Microsoft x86 and x64 NGen queue drain before signed MSI on Wiage'
        type: boolean
        required: false
        default: false
      progress_gated_native40_ngen:
        description: 'Grant at most 2 extra NGen wait windows only on new genuine queue progress'
        type: boolean
        required: false
        default: false
      retry_growing_native40_ngen_nonzero:
        description: 'Safely retry original Microsoft NGen once only on nonzero with real queue progress'
        type: boolean
        required: false
        default: false
      pause_native_ngen_queue:
        description: 'Opt-in original Microsoft NGen queue pause before signed MSI'
        type: boolean
        required: false
        default: false
      pause_after_verified_native40_ngen:
        description: 'After authenticated native CLR4 NGen preflight, pause both genuine queues for signed MSI+MSP'
        type: boolean
        required: false
        default: false
      signed_msi_win10_profile:
        description: 'Win10 profile A/B for genuine signed .NET 4.8 MSI+MSP only after x86/x64 CLR4 NGen success'
        type: boolean
        required: false
        default: false
      signed_msp_win32_exit:
        description: 'Capture original signed MSP full Win32 exit DWORD after genuine MSI success'
        type: boolean
        required: false
        default: false
      signed_msi_timeout_seconds:
        description: 'Original signed .NET 4.8 x64 MSI timeout (seconds)'
        type: choice
        required: false
        default: '420'
        options: ['420', '1200']
      original_48_profile:
        description: 'Original 4.8 profile for distinct Win7/Win10 compatibility trial'
        type: choice
        required: false
        default: win7
        options: [win7, win10]
      original_48_setup_args:
        description: 'Original signed 4.8 launch arguments'
        type: choice
        required: false
        default: logged
        options: [logged, winetricks]
      host_provenance_only:
        description: 'Authenticate Microsoft .NET 4.0 CLR hosting after msxml3; skip 4.8 and 4.8.1 installers'
        type: boolean
        required: false
        default: false
      try_48_payload_host:
        description: 'Reversibly stage original signed 4.8 CLR payload in proven native 4.0 Wine; no 4.8 setup'
        type: boolean
        required: false
        default: false

      use_macos26_runner:
        description: 'Select macOS 26 Apple Silicon runner; default remains macOS 15'
        type: boolean
        required: false
        default: false
      reuse_verified_native40:
        description: 'Avoid duplicate original 4.0 Winetricks install only if independently verified'
        type: boolean
        required: false
        default: false
      settle_wineserver:
        description: 'Test clearing Wine clients blocking Winetricks wineserver -w'
        type: boolean
        required: false
        default: false
      wine_baseline:
        description: 'Select hash-pinned Wine Staging environment'
        type: choice
        required: false
        default: '11.21'
        options: ['11.21', '11.10']

permissions:
  contents: read

# Keep signed original-Microsoft MSI trials alive across subsequent commits.
# In workflow_call, github.workflow resolves to the CALLER workflow name.
# A shared caller group and cancel=true previously cancelled uncompleted
# Apple Silicon installer experiments when a new commit queued a follow-up.
# Fast non-MSI checks retain the existing cancel-in-progress behavior.
concurrency:
  # Original signed MSI, authentic Core MSI and genuine CLR NGen controls
  # can run long. Do not cancel them when unrelated branch CI starts.
  # Keep experiments from distinct commits separated, even when the reusable
  # workflow is called on the same branch and shares the workflow name.
  # Preserve existing cancellation behavior for ordinary non-experiment CI.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.try_wow64_managed && format('wow64-{0}-{1}-{2}-{3}', github.sha, inputs.wine_baseline, inputs.use_macos26_runner, inputs.wow64_host_stack64) || inputs.try_40_core_msi_recovery && format('core-{0}-{1}-{2}', github.sha, inputs.probe_native40_ngen_if_ready, inputs.use_macos26_runner) || inputs.try_481_ipd_apply_candidate && format('ipd-{0}', github.sha) || (inputs.try_48_msi || inputs.try_48_direct || inputs.try_48_intermediate) && github.sha || 'shared' }}
  cancel-in-progress: ${{ !inputs.try_48_msi && !inputs.try_48_direct && !inputs.try_48_intermediate && !inputs.try_wow64_managed && !inputs.try_40_core_msi_recovery }}

jobs:
  absolute-path-regressions:
    name: Verify .NET 4.0 native CLR false-positive regressions on POSIX
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.try_481_ipd_apply_candidate && 12 || 5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run absolute media and fixture path regression tests
        run: |
          python -m unittest discover -s tests -p 'test_netfx481_ipd_apply_candidate.py' -v
          python -m unittest discover -s tests -p 'test_netfx481_ipd_gac.py' -v
          python -m unittest discover -s tests -p 'test_netfx481_solidworks_gate.py' -v
          python -m unittest discover -s tests -p 'test_netfx481_cad_prerequisites.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_legacy.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_launcher_timeout.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_original_installer_group.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msxml3_prerequisite.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_prefix_readiness.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_original_core_msi_recovery.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_adaptive_native_ngen.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_native_ngen_drain.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_ngen_wine_trace.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msxml3_restart.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_fresh_prefix_retry.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_fresh_prefix_retry_workflow.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_native_mscoree_provenance.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_host_api_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_core_host_trial.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_start_trace.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_to_481_upgrade.py' -v
          python -m unittest discover -s tests -p 'test_netfx481_prereq_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_netfx4x_authenticated_media_fetch.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msi_evidence.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msi_inventory.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_offline_extract.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_windows_extract_reference.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_original_msi_table.py' -v
          python -m unittest discover -s tests -p 'test_msi_original_binary_imports.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_wine_msi_errors.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msi_custom_type.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_msi_logging_policy.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_direct_workflow_shell.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_registry_preflight.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_scm_service_probe.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_blockif_trace.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_to_48_direct.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_msi_registration.py' -v
          python -m unittest discover -s tests -p 'test_netfx48_msp_patch_sequence.py' -v

      - name: Compile exact pinned Wine source for IPD preflight and apply candidate before native CLR installation
        if: inputs.try_481_ipd_apply_candidate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix
          src="$RUNNER_TEMP/wusa-original"
          mkdir -p "$src/wine"
          base=https://raw.githubusercontent.com/wine-mirror/wine/wine-11.13
          for name in main.c manifest.c wusa.h; do
            curl --fail --location --retry 4 --retry-all-errors --max-time 60 --output "$src/$name" "$base/programs/wusa/$name"
          done
          curl --fail --location --retry 4 --retry-all-errors --max-time 60 --output "$src/wine/list.h" "$base/include/wine/list.h"
          python -m scripts.patch_wusa_ipd_dryrun "$src" "$RUNNER_TEMP/wusa-ipd-dryrun"
          python -m scripts.patch_wusa_ipd_apply_candidate "$src" "$RUNNER_TEMP/wusa-ipd-apply-candidate"
          for mode in dryrun apply-candidate; do
            dst="$RUNNER_TEMP/wusa-ipd-$mode"
            x86_64-w64-mingw32-gcc-posix -std=gnu11 -O2 -municode -mconsole -static -D_WIN32_WINNT=0x0601 \
              -I"$dst" "$dst/main.c" "$dst/manifest.c" \
              -o "$RUNNER_TEMP/swcompat-wusa-ipd-$mode.exe" \
              -lcabinet -lshlwapi -lole32 -loleaut32 -ladvapi32 -lshell32 -luuid
          done
          x86_64-w64-mingw32-gcc-posix -std=gnu11 -O2 -municode -mconsole -static \
            probes/netfx481_ipd_gac.c -o "$RUNNER_TEMP/swcompat-netfx481-ipd-gac.exe"
          echo "Pinned Wine dry-run and experimental apply candidates compiled"
  
  authentic-netfx40-windows:
    name: Authenticate original Microsoft .NET 4.0 and compile CLR probes
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.try_webview2_after_ipd && 35 || inputs.try_solidworks_after_ipd && 35 || 20 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safety gate and strict no-leak reporting
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_netfx40_legacy.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Original Microsoft 4.0 safety tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_launcher_timeout.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Original .NET 4.0 Win32 setup wait regression failed" }
          python -m unittest discover -s tests -p 'test_netfx40_msxml3_prerequisite.py' -v
          if ($LASTEXITCODE -ne 0) { throw "msxml3 workaround tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_msxml3_restart.py' -v
          python -m unittest discover -s tests -p 'test_netfx40_to_481_upgrade.py' -v
          python -m unittest discover -s tests -p 'test_netfx481_prereq_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_netfx4x_authenticated_media_fetch.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Post-setup CLR restart persistence safety regression failed" }
          if ($LASTEXITCODE -ne 0) { throw "Original Microsoft .NET in-place upgrade safety regression failed" }
          python -m unittest discover -s tests -p 'test_netfx40_msi_evidence.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Nested MSI privacy and failure-action tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_msi_inventory.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Retained MSI candidate census privacy test failed" }
          python -m unittest discover -s tests -p 'test_netfx40_offline_extract.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Original .NET offline extraction privacy and fixture tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_windows_extract_reference.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Native Windows /x reference privacy and fixture tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_original_msi_table.py' -v
          python -m unittest discover -s tests -p 'test_msi_original_binary_imports.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Private original MSI action lookup tests failed" }
          python -m unittest discover -s tests -p 'test_netfx40_wine_msi_errors.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Wine MSI error evidence regression failed" }
          python -m unittest discover -s tests -p 'test_netfx40_msi_logging_policy.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Opt-in MSI policy safety regression failed" }

      - name: Compile independent native CLR and managed execution probes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "MSVC locator missing" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "MSVC tools missing" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) { throw "MSVC x64 environment missing" }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /Fe:build\netfx481_clr_load.exe probes\netfx481_clr_load.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-netfx40-loader.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-netfx40-loader.cmd
          if ($LASTEXITCODE -ne 0) { throw "CLR loader compilation failed" }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /DSWCOMPAT_NETFX40 /Fe:build\netfx40_win32_launch.exe probes\netfx481_win32_launch.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-netfx40-launcher.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-netfx40-launcher.cmd
          if ($LASTEXITCODE -ne 0) { throw "Exact 4.8 Win32 launcher compilation failed" }
          $selftest = & build\netfx40_win32_launch.exe --selftest-3010
          if ($LASTEXITCODE -ne 0 -or $selftest -notcontains 'SWCOMPAT_WIN32_SETUP_EXIT_HEX=00000BC2') {
            throw "Exact 4.8 Windows process exit selftest failed"
          }
          if ("${{ inputs.try_481_ipd_apply_candidate }}" -eq "true") {
            $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /DSWCOMPAT_WEBVIEW2 /Fe:build\webview2_win32_launch.exe probes\netfx481_win32_launch.c`r`nexit /b %errorlevel%`r`n"
            Set-Content -LiteralPath build/compile-webview2-launcher.cmd -Value $cmdText -Encoding ascii
            & cmd.exe /d /c build\compile-webview2-launcher.cmd
            if ($LASTEXITCODE -ne 0) { throw "WebView2 Win32 launcher compile failed" }
            $wvtest = & build\webview2_win32_launch.exe --selftest-3010
            if ($LASTEXITCODE -ne 0 -or $wvtest -notcontains 'SWCOMPAT_WIN32_SETUP_EXIT_HEX=00000BC2') { throw "WebView2 Win32 launcher selftest failed" }
          }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /DUNICODE /D_UNICODE /Fe:build\netfx481_win32_launch.exe probes\netfx481_win32_launch.c`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-upgrade-481-launcher.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-upgrade-481-launcher.cmd
          if ($LASTEXITCODE -ne 0) { throw "Original .NET 4.8.1 upgrade launcher compilation failed" }
          $selftest481 = & build\netfx481_win32_launch.exe --selftest-3010
          if ($LASTEXITCODE -ne 0 -or $selftest481 -notcontains 'SWCOMPAT_WIN32_SETUP_EXIT_HEX=00000BC2') {
            throw "Original .NET 4.8.1 upgrade launch reference failed"
          }
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "Microsoft C# compiler missing" }
