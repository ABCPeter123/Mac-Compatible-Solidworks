      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-netfx40-after-msxml3-privacy-safe-result
          path: |
            build/netfx40-prefix-readiness.json
            build/netfx481-native-delta.json
            build/netfx481-ipd-wusa-dryrun.json
            build/netfx481-ipd-apply-candidate.json
