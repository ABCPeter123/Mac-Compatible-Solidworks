      - name: Retry genuine original Microsoft .NET 4.0 following msxml3
        if: env.SWCOMPAT_MSXML3_READY == 'yes'
        shell: bash
        env:
          SWCOMPAT_WIN7_SETUP: ${{ inputs.win7_setup }}
        run: |
          set -euo pipefail
          # macOS ships Bash 3.2. With nounset, expanding an empty array
          # raises "unbound variable" and skips the original Microsoft setup.
          # Use the always-defined positional argument list instead.
          set -- python3 -m scripts.netfx40_legacy \
            --wine "$SWCOMPAT_WINE" --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --installer build/dotNetFx40_Full_x86_x64.exe \
            --managed build/netfx481_runtime_probe.exe \
            --loader build/netfx481_clr_load.exe \
            --launcher build/netfx40_win32_launch.exe \
            --output build/netfx40-msxml3-runtime.json \
            --timeout 330 --agree-disposable-prefix \
            --experiment-extended-setup-wait \
            --experiment-enable-verbose-msi \
            --experiment-restart-after-mono \
            --experiment-trace-custom-action-type \
            --experiment-inventory-retained-msi \
            --experiment-private-original-action
          if [[ "${SWCOMPAT_WIN7_SETUP:-false}" == "true" ]]; then
            set -- "$@" --experiment-win7-setup
          fi
          "$@"
      - name: Restart isolated Wine to verify the real CLR persists after setup
        if: env.SWCOMPAT_MSXML3_READY == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.netfx40_msxml3_restart \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --loader build/netfx481_clr_load.exe \
            --managed build/netfx481_runtime_probe.exe \
            --original build/netfx40-msxml3-runtime.json \
            --output build/netfx40-msxml3-restart.json \
            --agree-disposable-prefix
      # Only authenticated signed-MSP or IPD apply experiments may spend another
      # fresh prefix after original .NET 4.0 setup returned exact Win32 1603.
      # Neither a failed partial installation nor a missing CLR can pass.
      - name: One genuine CLR4 retry in a second fresh disposable Wine prefix after 1603
        if: env.SWCOMPAT_MSXML3_READY == 'yes' && (inputs.signed_msp_win32_exit || inputs.try_481_ipd_apply_candidate)
        shell: bash
        env:
          SWCOMPAT_WIN7_SETUP: ${{ inputs.win7_setup }}
          SWCOMPAT_IPD_SYNC_RETRY: ${{ inputs.try_481_ipd_apply_candidate }}
          SWCOMPAT_RETRY_WINE_BASELINE: ${{ inputs.wine_baseline }}
          SWCOMPAT_WEBVIEW2_FIRST: ${{ inputs.try_481_ipd_apply_candidate && (inputs.try_webview2_after_ipd || (github.event_name == 'workflow_dispatch' && inputs.try_solidworks_after_ipd)) }}
        run: |
          set -euo pipefail
          outcome=$(python3 -m scripts.netfx40_fresh_prefix_retry \
            --wine "$SWCOMPAT_WINE" \
            --prefix "$RUNNER_TEMP/netfx40-msxml3-prefix" \
            --original build/netfx40-msxml3-runtime.json \
            --restart build/netfx40-msxml3-restart.json \
            --agree-disposable-prefix)
          if [[ "$outcome" == "ALREADY_VERIFIED" ]]; then
            echo "Original genuine CLR4 persisted, fresh retry is unnecessary."
            exit 0
          fi
          test "$outcome" = "FRESH_PREFIX_REQUIRED"
          echo "Real CLR4 setup 1603; original disposable prefix archived privately."
          mv build/netfx40-msxml3-runtime.json build/netfx40-msxml3-runtime-attempt1.json
          mv build/netfx40-msxml3-restart.json build/netfx40-msxml3-restart-attempt1.json

          # Wiage's optional Mach semaphore backend is enabled in the original
          # attempt. After a verified 1603 and successful server shutdown, test
          # ordinary wineserver synchronization in the new IPD prefix only.
          # Set the environment before *any* new prefix process, and retain it
          # for later servicing, rather than mixing server/client backends.
          if [[ "$SWCOMPAT_IPD_SYNC_RETRY" == "true" && "$SWCOMPAT_RETRY_WINE_BASELINE" == "wiage-11.13" ]]; then
