          Set-Content -LiteralPath build/compile-netfx40-wow64-x86.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-netfx40-wow64-x86.cmd
          if ($LASTEXITCODE -ne 0) { throw "Native Windows 32-bit process control compilation failed" }
          $x86Native = & build\netfx40_wow64_native_smoke.exe
          if ($LASTEXITCODE -ne 0 -or $x86Native -notcontains 'SWCOMPAT_WOW64_NATIVE_RESULT=PASS') {
            throw "Native Windows x86 process control failed on Windows"
          }
          & $csc /nologo /platform:x86 /target:exe /reference:System.Core.dll /reference:System.Xml.dll /out:build\netfx40_wow64_managed_probe.exe probes\netfx481_runtime_probe.cs
          if ($LASTEXITCODE -ne 0) { throw "Authenticated x86 Microsoft managed WoW64 fixture compilation failed" }
          & build\netfx40_wow64_managed_probe.exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Native Windows Microsoft CLR4 x86 positive control failed" }
          & $csc /nologo /target:exe /reference:System.Core.dll /reference:System.Xml.dll /out:build\netfx481_runtime_probe.exe probes\netfx481_runtime_probe.cs
          if ($LASTEXITCODE -ne 0) { throw "C# fixture compilation failed" }
          & $csc /nologo /target:library /reference:System.Core.dll /reference:System.Xml.dll /out:build\netfx48_managed_host_check.dll probes\netfx48_managed_host_check.cs
          if ($LASTEXITCODE -ne 0) { throw "Native CLR hosting managed library compilation failed" }
          $cmdText = "@echo off`r`ncall `"$vcvars`"`r`ncl /nologo /W4 /O2 /GS- /Zl /Fe:build\netfx48_host_activation.exe probes\netfx48_host_activation.c /link /NODEFAULTLIB kernel32.lib /ENTRY:host_entry /SUBSYSTEM:CONSOLE`r`nexit /b %errorlevel%`r`n"
          Set-Content -LiteralPath build/compile-netfx40-host.cmd -Value $cmdText -Encoding ascii
          & cmd.exe /d /c build\compile-netfx40-host.cmd
          if ($LASTEXITCODE -ne 0) { throw "Native CLR hosting fixture compilation failed" }
          # Prove this exact fixture works against installed genuine Microsoft
          # .NET on native Windows before interpreting any Wine result.
          $env:SWCOMPAT_MANAGED_DLL = (Resolve-Path 'build/netfx48_managed_host_check.dll').Path
          try {
            $env:SWCOMPAT_CLR_PATH = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\clr.dll'
            if (!(Test-Path -LiteralPath $env:SWCOMPAT_CLR_PATH -PathType Leaf)) {
              throw "Official Windows CLR baseline unavailable"
            }
            $positive = & build\netfx48_host_activation.exe
            if ($LASTEXITCODE -ne 0 -or $positive -notcontains 'SWCOMPAT_NETFX48_HOST_STATUS=MANAGED_ORIGINAL_PASS') {
              throw "Official Windows public CLR hosting positive control failed"
            }
            # Positive native-Windows control for Microsoft's documented
            # process-only CLR activation logging. Never emit log contents,
            # runtime paths, vendor files or arbitrary file names.
            $activationDir = Join-Path $env:RUNNER_TEMP 'swcompat-clr-activation-native-control'
            if (Test-Path -LiteralPath $activationDir) { throw 'Unsafe preexisting activation folder' }
            New-Item -ItemType Directory -Path $activationDir | Out-Null
            try {
              $env:COMPLUS_CLRLoadLogDir = $activationDir
              $activation = & build\netfx48_host_activation.exe
              if ($LASTEXITCODE -ne 0 -or $activation -notcontains 'SWCOMPAT_NETFX48_HOST_STATUS=MANAGED_ORIGINAL_PASS') {
                throw 'Native Windows activation log control host failed'
              }
              $captured = @(Get-ChildItem -LiteralPath $activationDir -File -Force).Count
              Write-Output ('WINDOWS_NATIVE_CLR_ACTIVATION_LOG ' +
                $(if ($captured -gt 0) { 'EMITTED' } else { 'NOT_EMITTED' }))
            }
            finally {
              Remove-Item env:COMPLUS_CLRLoadLogDir -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $activationDir -Force -Recurse -ErrorAction SilentlyContinue
            }
            $env:SWCOMPAT_CLR_PATH = Join-Path $env:WINDIR 'System32\kernel32.dll'
            $negative = & build\netfx48_host_activation.exe
            if ($LASTEXITCODE -ne 0 -or $negative -notcontains 'SWCOMPAT_NETFX48_HOST_STATUS=OTHER_RUNTIME_SELECTED') {
              throw "Public CLR host rejected-runtime negative control failed"
            }
            'AUTHENTIC_NETFX40_HOST_FIXTURE_WINDOWS_CONTROL POSITIVE_PASS WRONG_RUNTIME_REJECTED'
          }
          finally {
            Remove-Item env:SWCOMPAT_CLR_PATH -ErrorAction SilentlyContinue
            Remove-Item env:SWCOMPAT_MANAGED_DLL -ErrorAction SilentlyContinue
          }
          $loader = & build\netfx481_clr_load.exe
          if ($LASTEXITCODE -ne 0 -or $loader -notcontains 'SWCOMPAT_CLR_LOAD_STATUS=LOADED') {
            throw "Windows native CLR baseline failed"
          }
          & build\netfx481_runtime_probe.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows managed baseline failed" }
