name: One-shot original .NET 4.8 with verified Winetricks dotnet40 reuse

# Previous full dotnet48 Winetricks run entered load_dotnet40 despite a
# separately authenticated installed Microsoft 4.0 CLR. It then timed out,
# with last recognized stage WINVER_COMMAND and unchanged 4.8 CLR/Release.
# Winetricks requires both 32-bit ngen.exe and a dotnet40 entry in its
# own winetricks.log. An opt-in provenance marker is added only AFTER the
# original 4.0 native loader and managed probes PASS, and only when genuine
# ngen.exe is a PE_I386 and no unsafe symlink/log is present.
# No false .NET Release registry value or vendor file is created. If ngen
# is missing, the marker is NOT added. Normal CI keeps this disabled.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-skip-verified-dotnet40-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: netfx48-reuse-real-native40-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-native40-winetricks-reuse:
    name: Run original full dotnet48 with independently verified 4.0 already installed
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: '11.21'
      use_macos26_runner: true
      host_provenance_only: false
      try_48_payload_host: false
      try_48_direct: false
      try_48_intermediate: true
      reuse_verified_native40: true
