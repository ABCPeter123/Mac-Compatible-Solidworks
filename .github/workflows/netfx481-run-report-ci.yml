name: Report genuine framework installation run IDs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx481-run-report-ci.yml'
  workflow_run:
    workflows:
      - One-shot authenticated Wiage .NET 4.8 MSI after progress-drained CLR4 NGen
      - Independent genuine .NET 4.8.1 Windows Update catalog experiment
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  issues: write

concurrency:
  group: original-netfx481-run-report
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout, artifact download, installer logs or untrusted code execution.
      # Infrastructure status is never a framework or CAD compatibility claim.
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const routes = [
              ["In-place recovery", "netfx48-wiage-ngen-progress-msi-once-ci.yml"],
              ["Independent catalog WUSA", "netfx481-catalog-wusa-ci.yml"],
            ];
            const marker = "<!-- swcompat-netfx481-run-report -->";
            const lines = [marker, "### Original framework installation run locator", "",
              "These are GitHub Actions infrastructure outcomes, not evidence of a working .NET 4.8.1 or SOLIDWORKS installation.", ""];
            for (const [label, workflow_id] of routes) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: "main", per_page: 10
              });
              const run = response.data.workflow_runs.find(r =>
                r.head_repository?.full_name === owner + "/" + repo &&
                r.head_branch === "main" &&
                ["push", "workflow_dispatch"].includes(r.event));
              if (!run) {
                lines.push("- " + label + ": no matching main-branch run");
                continue;
              }
              if (!Number.isSafeInteger(run.id) || !Number.isSafeInteger(run.run_attempt) ||
                  !/^[a-f0-9]{40}$/.test(run.head_sha)) {
                core.setFailed("Unexpected Actions run metadata");
                return;
              }
              const status = ["queued", "in_progress", "completed", "waiting", "pending", "requested"].includes(run.status)
                ? run.status : "unknown";
              const conclusion = ["success", "failure", "cancelled", "skipped", "timed_out", "action_required", "neutral", "stale", "startup_failure"].includes(run.conclusion)
                ? run.conclusion : "not available";
              lines.push("- " + label + ": [run " + run.id + "](https://github.com/" + owner + "/" + repo + "/actions/runs/" + run.id + "), attempt " + run.run_attempt + ", commit " + run.head_sha.slice(0, 12) + ", " + status + ", conclusion " + conclusion);
            }
            lines.push("", "Inspect the actual installer job and independent native-runtime result before making compatibility claims.");
            const body = lines.join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: 115, per_page: 100
            });
            const last = comments.reverse().find(c =>
              c.user?.login === "github-actions[bot]" &&
              c.body?.startsWith(marker));
            if (last?.body === body) {
              core.info("Unchanged installation run locator");
              return;
            }
            await github.rest.issues.createComment({owner, repo, issue_number: 115, body});
            core.info("Published allowlisted run identifiers to existing issue");

  prune-superseded-pr-builds:
    # Run only from the trusted main branch on an explicit manual invocation
    # or this file's self-path push. Never run with write access on workflow_run.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: write
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const cutoff = Date.now() - 3 * 86400 * 1000;
            const allowed = new Set([
              "macos-diagnostics-macos-15",
              "macos-diagnostics-macos-15-intel",
              "windows-x64-wgl-probe"
            ]);
            // Only the ordinary code-only foundation workflow. Never delete
            // installer artifacts, logs, run records, caches, or main evidence.
            const runs = [];
            for (let page = 1; page <= 10; page++) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "compatibility-ci.yml",
                event: "pull_request", status: "completed", per_page: 100, page
              });
              if (!Array.isArray(data.workflow_runs)) throw Error("Unexpected run listing");
              runs.push(...data.workflow_runs);
              if (data.workflow_runs.length < 100) break;
            }
            const eligible = runs.filter(r =>
              r.event === "pull_request" && r.status === "completed" &&
              r.head_repository?.full_name === owner + "/" + repo &&
              typeof r.head_branch === "string" && r.head_branch !== "main" &&
              Number.isSafeInteger(r.id) && Number.isFinite(Date.parse(r.created_at))
            ).sort((a,b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            // Retain the newest completed run and newest successful run per
            // branch even when old. Earlier evidence logs always remain.
            const newest = new Set(), newestSuccess = new Set(), protectedIds = new Set();
            for (const r of eligible) {
              if (!newest.has(r.head_branch)) {
                newest.add(r.head_branch); protectedIds.add(r.id);
              }
              if (r.conclusion === "success" && !newestSuccess.has(r.head_branch)) {
                newestSuccess.add(r.head_branch); protectedIds.add(r.id);
              }
            }
            let removed = 0, bytes = 0, inspected = 0;
            for (const run of eligible) {
              if (removed >= 200 || inspected >= 100) break;
              if (protectedIds.has(run.id) || Date.parse(run.created_at) >= cutoff) continue;
              inspected++;
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100
              });
              for (const artifact of data.artifacts) {
                if (removed >= 200) break;
                if (!allowed.has(artifact.name) || artifact.expired !== false ||
                    !Number.isSafeInteger(artifact.id) ||
                    !Number.isFinite(Date.parse(artifact.created_at)) ||
                    Date.parse(artifact.created_at) >= cutoff) continue;
                await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
                removed++;
                if (Number.isSafeInteger(artifact.size_in_bytes) && artifact.size_in_bytes >= 0)
                  bytes += artifact.size_in_bytes;
              }
            }
            const message = "Removed " + removed + " superseded PR foundation artifacts (" + bytes +
              " stored bytes reported by GitHub) from " + inspected + " inspected runs. " +
              "Protected latest completed and successful runs per branch, main evidence, all installer evidence and run logs.";
            core.info(message);
            await core.summary.addHeading("Stale foundation artifact cleanup").addRaw(message).write();
            if (removed > 0) await github.rest.issues.createComment({
              owner, repo, issue_number: 115, body: "### Stale CI artifact cleanup\n\n" + message
            });
