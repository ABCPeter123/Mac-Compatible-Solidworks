name: One-shot genuine Microsoft .NET 4.8 setup under Wine Windows 10

# One authorized main-only differential after repeated original signed 4.8
# Win7 SP1 setup 5100; supported Win10 avoids Windows 7 KB prerequisites.
# Original signed media is verified in Windows CI and stays private.
# Native Microsoft .NET 4.0 must pass after restart before original 4.8 runs.
# Genuine 4.8.1 remains gated on installed 4.8 CLR and managed execution.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-win10-original-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: netfx48-win10-original-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  one-original-win10-trial:
    name: Original signed 4.8 on Windows 10 profile after real native 4.0
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      host_provenance_only: false
      try_48_payload_host: false
      try_48_intermediate: false
      try_48_direct: true
      original_48_profile: win10
      use_macos26_runner: true
