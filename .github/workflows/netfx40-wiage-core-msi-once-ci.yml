name: One-shot Wiage original Microsoft .NET4 x64 core MSI after setup 1603

# Run 45235666305: prefix-specific wineserver cleanup succeeded after the
# genuine .NET4 setup timeout; original Microsoft CLR4 persisted after restart
# and native-only managed code passed. Direct Core MSI correctly skipped.
# Genuine x64 NGen timed out at 180s even though the private original queue
# log grew during 3 of 4 samples, with no Wine SEH fault signature. Retest
# with at most two 180s grace windows, granted only on fresh NGen log growth.
# Do not modify vendor binaries or run .NET4.8/4.8.1 in this diagnostic arm.
# Run 45221756975: original .NET4 setup reached its 330s wait and the
# traced Unix process group could not prove all inherited Wine stderr writers
# had exited (installer_cleanup=UNVERIFIED). No direct Core MSI or NGen ran.
# Retry after marking the exact ephemeral CI prefix and using Wine's own
# prefix-selected wineserver -k/-w to reap clients that escape the Unix group.
# If that also fails, block without running further Microsoft MSI or CLR.
# Run 45214487841: after scoped cleanup, the original .NET4 bootstrapper
# again returned MSI 1603 with CLR absent, and direct Core x64 MSI returned
# nonzero with FILE_NOT_FOUND and SERVICE_MISSING in its private MSI log.
# Capture Wine's actual failed script action and cabinet/service diagnostics
# from the same original unmodified MSI run before selecting a compatibility fix.
# Run 45205577127: original CLR4 persisted and x64 Microsoft NGen timed
# out after 180s, despite 64MiB host stack, with no SEH crash and changing
# native-image queue logs. The original installer wrapper hit its own 330s
# wait while Wine's traced Python launcher killed only its immediate process
# after the outer timeout. Descendant MSI/optimizer processes could retain
# inherited stderr and run into the later NGen attempt. Re-run both genuine
# outcomes after scoped Unix process-group cleanup and unsafe-pipe fail-closed.
# In run 44984967536 the original, authenticated .NET4 bootstrapper exited
# MSI 1603 with CLR64 ABSENT before genuine NGen could be studied. Earlier
# Wiage runs left working Microsoft CLR4 after a long setup timeout. Test
# whether installing the ORIGINAL unmodified x64 core MSI directly from the
# same hash-pinned official Microsoft /x extraction can recover the former.
# Run 45201745572 instead produced authenticated persistent x64/x86 native
# Microsoft CLR4 after setup timed out and the direct Core MSI correctly
# skipped as SKIPPED_ALREADY_NATIVE. Retest adaptively in the SAME isolated
# prefix: original MSI after genuine 1603, or original x64/x86 NGen with
# 65520KiB host stack and private Wine SEH/lock error classification when
# native CLR4 already executes managed code. No 4.8 MSI is attempted.
# Run 44990034092 proved original Microsoft setup MSI 1603 with CLR absent,
# and extraction of 6 original OLE MSIs. Its direct-Core control stopped
# BEFORE msiexec because the private candidate walk rejected the 17-directory
# genuine extraction layout with SCAN_LIMIT. Retest with a finite branch
# allowance, deeper discovery and unchanged trusted package checks.
# This is a narrow diagnostic, not full .NET4/4.8/4.8.1/SOLIDWORKS support.
# Never fake a registry Release or bypass a Microsoft licensing requirement.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx40-wiage-core-msi-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: authentic-wiage-netfx40-core-msi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-microsoft-core-msi:
    name: Try unmodified Microsoft .NET4 Core x64 MSI after proven setup 1603
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: 'wiage-11.13'
      use_macos26_runner: true
      host_provenance_only: true
      win7_setup: false
      try_wow64_managed: false
      try_wow64_faults: false
      try_40_core_msi_recovery: true
      probe_native40_ngen_if_ready: true
      try_48_direct: false
      try_48_intermediate: false
      try_48_payload_host: false
      try_48_msi: false
      drain_native40_ngen: false
      pause_native_ngen_queue: false
