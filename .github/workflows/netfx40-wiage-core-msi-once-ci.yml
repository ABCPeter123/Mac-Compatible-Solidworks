name: One-shot Wiage original Microsoft .NET4 x64 core MSI after setup 1603

# In run 44984967536 the original, authenticated .NET4 bootstrapper exited
# MSI 1603 with CLR64 ABSENT before genuine NGen could be studied. Earlier
# Wiage runs left working Microsoft CLR4 after a long setup timeout. Test
# whether installing the ORIGINAL unmodified x64 core MSI directly from the
# same hash-pinned official Microsoft /x extraction can recover the former.
# This is a narrow diagnostic, not full .NET4/4.8/4.8.1/SOLIDWORKS support.
# Never fake a registry Release or bypass a Microsoft licensing requirement.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx40-wiage-core-msi-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: authentic-wiage-netfx40-core-msi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-microsoft-core-msi:
    name: Try unmodified Microsoft .NET4 Core x64 MSI after proven setup 1603
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: 'wiage-11.13'
      use_macos26_runner: true
      host_provenance_only: true
      win7_setup: false
      try_wow64_managed: false
      try_wow64_faults: false
      try_40_core_msi_recovery: true
      try_48_direct: false
      try_48_intermediate: false
      try_48_payload_host: false
      try_48_msi: false
      drain_native40_ngen: false
      pause_native_ngen_queue: false
