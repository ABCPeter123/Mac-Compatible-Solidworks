name: One-shot original .NET4.8 MSI with verified NGen assembly cache

# Controlled differential from authenticated run 44326957491:
# CLR4 NGen optimization services already PRESENT and NGen last custom action.
# Upstream Winetricks issue 2459 reports NGen can fail when the Windows
# assembly directory is absent in Wine. Create only this empty directory if
# missing, after genuine native CLR4 validation, in a disposable prefix.
# Original signed MSI+MSP, Release, CLR loader and managed gates unchanged.
# No vendor payload mutation, fake services, registry markers, log uploads.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-msi-ngen-cache-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-netfx48-ngen-cache-differential-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-signed-msi-ngen-cache:
    name: Verify real CLR4, prepare missing assembly directory, try original MSI
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: '11.21'
      use_macos26_runner: true
      host_provenance_only: false
      try_48_payload_host: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_msi: true
      prepare_48_assembly_cache: true
