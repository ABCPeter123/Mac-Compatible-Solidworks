name: One-shot original Microsoft NGen queue-controlled .NET4.8 MSI

# Compare original signed 4.8 MSI with an official Microsoft native-image
# queue servicing procedure. No patched MSI, NGen stubs or service spoofing.
# Default MSI procedure never changes. Separate test only on main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netfx48-ngen-queue-pause-once-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-netfx48-ngen-queue-pause-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authentic-msi-ngen-queue-control:
    name: Execute genuine CLR4 and original MSI with native NGen queue coordination
    uses: ./.github/workflows/netfx40-legacy-ci.yml
    with:
      wine_baseline: '11.21'
      use_macos26_runner: true
      host_provenance_only: false
      try_48_payload_host: false
      try_48_direct: false
      try_48_intermediate: false
      try_48_msi: true
      prepare_48_assembly_cache: true
      signed_msi_timeout_seconds: 420
      pause_native_ngen_queue: true
